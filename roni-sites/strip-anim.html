<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>קאברים בגלילה</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#050506;color:#fff;font-family:'IBM Plex Sans Hebrew',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .hero{position:relative;padding:118px 16px 0;text-align:right;background:radial-gradient(120% 60% at 80% 0%,rgba(250,145,84,.14),transparent 60%)}
  .logo{position:absolute;top:24px;right:16px;height:40px;opacity:.95}
  h1{margin:0;font-weight:500;font-size:30px;line-height:1.05}
  .big{margin:6px 0 0;font-size:38px;line-height:1.02;font-weight:600;background:linear-gradient(to right,#8da8cb,#fff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .row{display:flex;gap:10px;margin-top:24px}
  .pill{display:inline-flex;align-items:center;height:48px;padding:0 20px;border-radius:100px;font-size:16px;font-weight:500}
  .pf{background:linear-gradient(to left,#e0783c,#fa9154)}.pl{border:1px solid #e0783c}
  /* the strip: covers drift slowly from side to side, as on the page */
  .strip{position:relative;margin-top:48px;height:200px;perspective:900px}
  .track{position:absolute;top:0;right:0;display:flex;gap:12px;will-change:transform}
  .c{flex:none;width:270px;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:#111 center top/cover;box-shadow:0 20px 40px -18px rgba(0,0,0,.8);will-change:transform,opacity,filter;transform-origin:50% 50%}
  .after{height:1600px;padding:60px 16px;color:#8C97A8;font-size:16px}
  .after h2{margin:0 0 10px;color:#fff;font-weight:400;font-size:30px}
  .hint{position:fixed;bottom:18px;left:50%;translate:-50% 0;font-size:13px;color:#8C97A8;background:rgba(255,255,255,.06);padding:6px 12px;border-radius:100px;transition:opacity .3s}
</style>
</head>
<body>
<section class="hero">
  <img class="logo" src="assets/logo-sm.webp" alt="">
  <h1>ההחלטה נופלת באתר.</h1>
  <p class="big">השיחה רק סוגרת אותה</p>
  <div class="row"><span class="pill pf">לשיחת היכרות</span><span class="pill pl">לפרוייקטים</span></div>
  <div class="strip"><div class="track" id="tr"></div></div>
</section>
<div class="after"><h2>פרויקטים</h2>כאן מתחילים הפרויקטים. גללו למעלה ולמטה כדי לראות את האנימציה של הקאברים.</div>
<div class="hint" id="hint">גללו למטה</div>
<script>
const IM = ['antar-fullcourse', 'joopy-s1', 'kapach-hero', 'noy-hero', 'hitbox-hero'];
const tr = document.getElementById('tr');
tr.innerHTML = [...IM, ...IM].map(n => '<div class="c" style="background-image:url(assets/strip/' + n + '.jpg)"></div>').join('');
const cards = [...tr.children], O = new URLSearchParams(location.search).get('o') || '1';
/* the strip drifts slowly on its own; scrolling feeds speed into it, so a quick scroll makes the covers rush past,
   and they ease back to the slow drift once the scroll stops */
let pos = 0, vel = 0, lastY = scrollY, boost = 0;
function frame(){
  const dy = scrollY - lastY; lastY = scrollY;
  document.getElementById('hint').style.opacity = scrollY > 20 ? 0 : 1;
  const half = tr.scrollWidth / 2;
  if (O === '1') {          /* rush: scroll speed becomes strip speed, same direction both ways */
    boost += (Math.abs(dy) * 1.6 - boost) * .12; vel = .5 + boost;
  } else if (O === '2') {   /* follow: down runs one way, up runs the other */
    boost += (dy * 1.8 - boost) * .12; vel = .5 + boost;
  } else {                  /* rush with a stretch: the covers lean and blur with the speed */
    boost += (Math.abs(dy) * 1.6 - boost) * .12; vel = .5 + boost;
  }
  pos = ((pos + vel) % half + half) % half;
  tr.style.transform = 'translateX(' + pos.toFixed(1) + 'px)';
  if (O === '3') {
    const sk = Math.min(18, boost * .55), bl = Math.min(6, boost * .16);
    cards.forEach(c => { c.style.transform = 'skewX(' + (-sk).toFixed(2) + 'deg) scaleX(' + (1 + sk / 90).toFixed(3) + ')'; c.style.filter = bl > .3 ? 'blur(' + bl.toFixed(1) + 'px)' : ''; });
  } else if (O === '1') {
    const sk = Math.min(10, boost * .3);
    cards.forEach(c => { c.style.transform = 'skewX(' + (-sk).toFixed(2) + 'deg)'; });
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

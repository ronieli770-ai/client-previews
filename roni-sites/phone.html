<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>דף האתרים בטלפון</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:radial-gradient(70% 60% at 50% 40%,#2a2a30,#0d0d10);font-family:'IBM Plex Sans Hebrew',sans-serif;color:#C9D2DE;overflow:hidden}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
  .phone{--s:1;position:relative;width:414px;height:868px;border-radius:64px;background:#0b0b0d;padding:12px;transform:scale(var(--s));transform-origin:50% 50%;
    box-shadow:0 0 0 2px #3a3a40,0 0 0 5px #17171a,0 40px 90px -20px rgba(0,0,0,.8),inset 0 0 0 1px rgba(255,255,255,.06)}
  .screen{position:relative;width:390px;height:844px;border-radius:52px;overflow:hidden;background:#1d1d20}
  .screen iframe{display:block;width:390px;height:844px;border:0}
  .island{position:absolute;top:22px;left:50%;width:120px;height:34px;margin-left:-60px;border-radius:20px;background:#000;z-index:2;pointer-events:none}
  .btn{position:absolute;width:4px;border-radius:2px;background:#2a2a2e}
  .b1{left:-6px;top:170px;height:60px}.b2{left:-6px;top:250px;height:60px}.b3{right:-6px;top:210px;height:96px}
  .tip{font-size:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="phone" id="ph"><i class="btn b1"></i><i class="btn b2"></i><i class="btn b3"></i>
    <div class="screen"><div class="island"></div><iframe src="index.html?v=1794527922" title="דף האתרים"></iframe></div>
  </div>
  <div class="tip">גוללים בתוך הטלפון עם העכבר</div>
</div>
<script>
const ph=document.getElementById('ph');
function fit(){const s=Math.min(1,(innerHeight-70)/868,(innerWidth-20)/414);ph.style.setProperty('--s',s);ph.style.margin=(-(868*(1-s))/2)+'px 0'}
fit();addEventListener('resize',fit);
</script>
</body>
</html>

<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>קאברים בהירו · אפשרויות</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#e9e4df;color:#1d1d20;font-family:'IBM Plex Sans Hebrew',system-ui,sans-serif;display:flex;gap:56px;align-items:center;justify-content:center;padding:32px}
  .side{width:340px}
  h1{margin:0 0 6px;font-weight:500;font-size:30px}
  .sub{margin:0 0 24px;color:#6b6e78;font-size:16px;line-height:1.5}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opts button{display:flex;gap:12px;align-items:baseline;text-align:right;border:0;background:#fff;border-radius:14px;padding:14px 16px;font-family:inherit;cursor:pointer;transition:background .2s,transform .2s}
  .opts button:hover{transform:translateX(-3px)}
  .opts button.on{background:#1d1d20;color:#fff}
  .opts b{font-family:Roboto,sans-serif;font-weight:500;color:#E04A21;font-size:15px}
  .opts span{font-size:18px;font-weight:500}
  .opts small{display:block;font-size:14px;color:#8C97A8;margin-top:2px;font-weight:400}
  /* the phone */
  .phone{position:relative;width:410px;height:860px;border-radius:62px;background:#111;padding:12px;box-shadow:0 40px 80px -30px rgba(0,0,0,.45),inset 0 0 0 2px #2a2a2e}
  .phone iframe{width:100%;height:100%;border:0;border-radius:50px;background:#050506}
  .notch{position:absolute;top:24px;left:50%;translate:-50% 0;width:120px;height:34px;border-radius:20px;background:#000;z-index:2}
  @media (max-width:900px){ body{flex-direction:column} .phone{transform:scale(.8);transform-origin:top center} }
</style>
</head>
<body>
<div class="side">
  <h1>קאברים בהירו בגלילה</h1>
  <p class="sub">בחרי אפשרות, ואז גללי בתוך הטלפון מהר ולאט. ככל שגוללים מהר יותר, הקאברים רצים מהר יותר.</p>
  <div class="opts" id="opts"></div>
</div>
<div class="phone"><div class="notch"></div><iframe id="fr" title="תצוגה בטלפון"></iframe></div>
<script>
const O = [
  ['1', 'רצים עם הגלילה', 'כשגוללים, הקאברים מאיצים ונוטים קצת, וכשעוצרים הם מאטים בחזרה'],
  ['2', 'רצים לפי הכיוון', 'גלילה למטה מריצה אותם לצד אחד, גלילה למעלה לצד השני'],
  ['3', 'מהירות האור', 'כמו 1, ובמהירות גבוהה הם נמתחים ומיטשטשים מהמהירות']
]
const fr = document.getElementById('fr'), box = document.getElementById('opts');
box.innerHTML = O.map(o => '<button data-o="' + o[0] + '"><b>0' + o[0] + '</b><div><span>' + o[1] + '</span><small>' + o[2] + '</small></div></button>').join('');
function pick(k){ fr.src = 'strip-anim.html?o=' + k; box.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.o === k)); }
box.addEventListener('click', e => { const b = e.target.closest('button'); if (b) pick(b.dataset.o); });
pick(new URLSearchParams(location.search).get('o') || '1');
</script>
</body>
</html>

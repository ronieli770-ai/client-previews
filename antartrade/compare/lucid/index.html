<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lucid - אפשרויות תלת מימד</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;600&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Fb Reforma";src:url("../../../fonts/FbReforma-Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Fb Reforma";src:url("../../../fonts/FbReforma-Medium.woff2") format("woff2");font-weight:500}
body{margin:0;background:#0b1220;color:#fff;font-family:"Fb Reforma","Roboto";padding:48px 24px}
h1{font-weight:500;font-size:32px;margin:0 0 8px;background:linear-gradient(90deg,#fff,#7dc6ff);-webkit-background-clip:text;color:transparent;width:fit-content}
p{color:rgba(255,255,255,.72);margin:0 0 32px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;max-width:1200px}
.o{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:18px}
.o.now{border-color:rgba(255,255,255,.2)}
.big{width:150px;height:150px;object-fit:contain}
.row{display:flex;gap:12px;align-items:center}
.tile{width:64px;height:64px;border-radius:18px;background:#131c2e;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);display:grid;place-items:center}
.tile img{width:40px;height:40px;object-fit:contain}
.pill{display:flex;align-items:center;gap:8px;padding:8px 20px 8px 14px;border-radius:999px;background:rgba(255,255,255,.06)}
.pill img{width:28px;height:28px;object-fit:contain}
.pill b{font:600 15px Roboto}
.t{font-weight:500;font-size:18px}
.t span{font:600 18px Roboto}
</style></head><body>
<h1>הלוגו של Lucid בתלת מימד</h1>
<p>כל אפשרות בגודל מלא, באריח צף ובגלולה של הכרטיסים.</p>
<div class="grid">
<div class="o now"><img class="big" src="now.png"><div class="row"><div class="tile"><img src="now.png"></div><div class="pill"><img src="now.png"><b>Lucid</b></div></div><div class="t">היום באתר</div></div>
<div class="o"><img class="big" src="a.png"><div class="row"><div class="tile"><img src="a.png"></div><div class="pill"><img src="a.png"><b>Lucid</b></div></div><div class="t">A - כחול כהה וטבעת זוהרת</div></div>
<div class="o"><img class="big" src="b.png"><div class="row"><div class="tile"><img src="b.png"></div><div class="pill"><img src="b.png"><b>Lucid</b></div></div><div class="t">B - מעבר תכלת</div></div>
<div class="o"><img class="big" src="c.png"><div class="row"><div class="tile"><img src="c.png"></div><div class="pill"><img src="c.png"><b>Lucid</b></div></div><div class="t">C - פנינה לבנה וטבעת תכלת</div></div>
<div class="o"><img class="big" src="d.png"><div class="row"><div class="tile"><img src="d.png"></div><div class="pill"><img src="d.png"><b>Lucid</b></div></div><div class="t">D - זכוכית עם ליבה</div></div>
<div class="o"><img class="big" src="e.png"><div class="row"><div class="tile"><img src="e.png"></div><div class="pill"><img src="e.png"><b>Lucid</b></div></div><div class="t">E - כסף מבריק</div></div>
<div class="o"><img class="big" src="f.png"><div class="row"><div class="tile"><img src="f.png"></div><div class="pill"><img src="f.png"><b>Lucid</b></div></div><div class="t">F - כחול עם הקשת של הלוגו</div></div>
</div></body></html>

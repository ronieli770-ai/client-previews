<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>באנר ניוזלטר - נוזל</title>
<link rel="icon" href="../../site-icon/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=IBM+Plex+Sans+Hebrew:wght@400&display=swap">
<style>
@font-face{font-family:"Fb Reforma";font-weight:400;src:url("FbReforma-Regular.woff2") format("woff2")}
@font-face{font-family:"Fb Reforma";font-weight:500;src:url("FbReforma-Medium.woff2") format("woff2")}
:root{--navy:#12161F;--ink:#12161F}
*{box-sizing:border-box}
body{margin:0;background:var(--navy);color:#fff;font:400 16px/1.5 "Fb Reforma",Roboto,sans-serif;padding:56px 16px 96px}
.en{font-family:Roboto,sans-serif;font-weight:500}
.wrap{width:min(1171px,100%);margin:0 auto}
.opt{margin-top:64px}
.opt:first-of-type{margin-top:0}
/* option name, for Roni only: label on its own line above, on the right */
.tag{display:block;font-size:14px;color:rgba(255,255,255,.6);margin-bottom:6px}
.tag b{display:block;font-size:20px;font-weight:500;color:#fff;margin-top:2px}

/* ---- the banner (same in every option; only the texture and the button motion change) ---- */
.nl{position:relative;overflow:hidden;isolation:isolate;border-radius:32px;padding:56px 64px;color:#fff;
  background:linear-gradient(90deg,#7dc6ff 0%,#4f6bff 70%);box-shadow:0 30px 60px -30px rgba(79,107,255,.75);
  display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:48px;align-items:end}
.nl>*{position:relative;z-index:2;min-width:0}
.nl h2{margin:0;font-size:40px;line-height:1.12;font-weight:500}
.nl p.sub{margin:12px 0 0;font-size:20px;line-height:1.5;color:rgba(255,255,255,.9)}
.form{display:grid;gap:12px;min-width:0}
.form>*,.box{min-width:0}
.row{display:flex;gap:10px}
.in{flex:1;min-width:0;height:52px;border:0;border-radius:999px;padding:0 22px;background:rgba(18,22,31,.16);color:#fff;
  font:400 16px "IBM Plex Sans Hebrew",system-ui,sans-serif;outline:none;text-align:right;direction:rtl;transition:background .2s}
.in::placeholder{color:rgba(255,255,255,.85);text-align:right}
.in:hover,.in:focus,.in:focus-visible{background:rgba(18,22,31,.26);outline:none;box-shadow:none}
.in[type=email]:not(:placeholder-shown){direction:ltr;text-align:right}
.fine{margin:0;font-size:13px;line-height:1.5;color:rgba(255,255,255,.85)}
.btn{position:relative;overflow:hidden;flex:none;display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 26px;border:0;border-radius:999px;
  background:#fff;color:var(--ink);font:500 16px "Fb Reforma",Roboto,sans-serif;cursor:pointer;white-space:nowrap;transition:box-shadow .25s,transform .25s}
.btn svg{width:18px;height:18px;flex:none}
.btn:hover{box-shadow:0 12px 26px -10px rgba(18,22,31,.6)}
.ok{display:none;align-items:center;gap:12px;min-height:52px;font-size:18px;font-weight:500}
.ok svg{width:28px;height:28px}
.done .form{display:none}.done .ok{display:flex}

/* ---- textures: silk folds (Roni, 12.11, direction from the schooliner banner, not a copy) ---- */
.tx{position:absolute;inset:0;z-index:1;pointer-events:none}
.tx svg{position:absolute;inset:0;width:100%;height:100%}
.drift svg{animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(0) scale(1.04)}to{transform:translateX(-3%) scale(1.08)}}
.tx.img{background-size:cover;background-position:center}
/* a soft veil behind the title so white text stays readable on the light parts */
.tx.img::after{content:"";position:absolute;inset:0;background:linear-gradient(270deg,rgba(30,52,170,.42) 0%,rgba(30,52,170,.12) 55%,rgba(30,52,170,.08) 100%)}
/* the button motion switch, for Roni only */
.mv{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:40px}
.mv small{width:100%;font-size:14px;color:rgba(255,255,255,.6)}
.mv button{border:0;border-radius:999px;padding:9px 16px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);font:inherit;font-size:14px;cursor:pointer}
.mv button.on{background:#fff;color:#12161F;font-weight:500}
@media (prefers-reduced-motion:reduce){.drift svg{animation:none}}
/* ---- button motions ---- */
/* 1: a light sweep crosses the button every few seconds */
.m1::after{content:"";position:absolute;top:0;bottom:0;width:46%;right:-60%;background:linear-gradient(90deg,transparent,rgba(125,198,255,.55),transparent);transform:skewX(-20deg);animation:sweep 3.6s ease-in-out infinite}
@keyframes sweep{0%,55%{right:-60%}100%{right:130%}}
/* 2: the arrow nudges forward, twice, then rests */
.m2 svg{animation:nudge 2.6s ease-in-out infinite}
@keyframes nudge{0%,60%,100%{transform:none}70%{transform:translateX(-5px)}80%{transform:none}90%{transform:translateX(-5px)}}
/* 3: a soft white ring breathes out of the button */
.m3{overflow:visible}
.m3::before{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 0 rgba(255,255,255,.55);animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}100%{box-shadow:0 0 0 14px rgba(255,255,255,0)}}
/* 4: hover only - the fill turns navy from the right and the arrow slides out and back in */
.m4{transition:color .35s}
.m4::before{content:"";position:absolute;inset:0;background:#12161F;transform:scaleX(0);transform-origin:right;transition:transform .4s cubic-bezier(.6,0,.2,1);border-radius:inherit}
.m4>*{position:relative}
.m4:hover,.m4.hov{color:#fff}.m4:hover::before,.m4.hov::before{transform:scaleX(1)}
.m4:hover svg,.m4.hov svg{animation:out-in .5s ease forwards}
@keyframes out-in{0%{transform:none;opacity:1}45%{transform:translateX(-14px);opacity:0}46%{transform:translateX(14px);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.m1::after,.m2 svg,.m3::before{animation:none}}

@media (max-width:900px){.nl{grid-template-columns:1fr;gap:28px;padding:40px 28px}}
@media (max-width:760px){
  body{padding-top:32px}
  .nl{border-radius:24px;padding:32px 20px}
  .nl h2{font-size:30px}.nl p.sub{font-size:17px}
  .row{flex-direction:column}.in{flex:none}.btn{width:100%}
}

.ctl{display:grid;gap:18px;margin-bottom:32px;padding:22px 24px;border-radius:20px;background:rgba(255,255,255,.05)}
.ctl .grp{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ctl .grp>span{width:100%;font-size:14px;color:rgba(255,255,255,.6)}
.ctl button{border:0;border-radius:999px;padding:9px 16px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);font:inherit;font-size:14px;cursor:pointer}
.ctl button.on{background:#fff;color:#12161F;font-weight:500}
.ctl input[type=range]{flex:1;min-width:200px;accent-color:#7DC6FF}
.ctl output{min-width:52px;text-align:left;font:500 16px Roboto,sans-serif}
.tx.liq{background-size:cover;background-position:center;opacity:var(--s,.35);transition:opacity .15s}
.soft .tx.liq{mix-blend-mode:soft-light}
.lum .tx.liq{mix-blend-mode:luminosity}
.tx.veil{background:linear-gradient(270deg,rgba(30,52,170,.3) 0%,rgba(30,52,170,0) 60%);opacity:var(--s,.35)}
</style>
</head>
<body>
<main class="wrap" id="list"></main>
<template id="tpl">
  <div class="nl">
    <div><h2>הצטרפו לניוזלטר של <span class="en" lang="en" dir="ltr">AntarTrade</span></h2><p class="sub">עדכונים מחברות המימון, טיפים במסחר, מבצעים והגרלות על מבחנים</p></div>
    <div class="box">
      <form class="form" novalidate>
        <div class="row"><input class="in" name="first_name" type="text" placeholder="שם פרטי" aria-label="שם פרטי"><input class="in" name="email" type="email" placeholder="מייל" aria-label="מייל">
          <button class="btn" type="submit"><span>אני רוצה להצטרף</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button></div>
        <p class="fine">בלחיצה אני מאשר/ת לקבל דיוור מ-<span class="en">AntarTrade</span>. אפשר להסיר את עצמכם בכל רגע.</p>
      </form>
      <div class="ok" role="status"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.4l2.7 2.6L16 9.6"/></svg><span>נרשמת! בדקו את המייל, הודעת הפתיחה כבר בדרך.</span></div>
    </div>
  </div>
</template>
<script>
const list=document.getElementById("list"),tpl=document.getElementById("tpl");
list.insertAdjacentHTML("beforebegin",`<div class="wrap ctl" id="ctl">
 <div class="grp"><span>מצב הבאנר</span><button data-st="idle" class="on">רגיל</button><button data-st="hov">עכבר על הכפתור</button><button data-st="done">אחרי הרשמה</button></div>
 <div class="grp"><span>חוזק הטקסטורה</span><input type="range" id="str" min="0" max="100" value="41"><output id="strV" class="en">41%</output></div>
 <div class="grp"><span>גרסת הנוזל</span><button data-v="7">1</button><button data-v="8" class="on">2</button><button data-v="9">3</button></div>
 <div class="grp"><span>איך הטקסטורה יושבת על הצבע</span><button data-b="">רגיל</button><button data-b="soft" class="on">רך, רק אור וצל</button><button data-b="lum">שומר על צבעי הלוגו</button></div>
</div>`);
const c=tpl.content.firstElementChild.cloneNode(true);
c.insertAdjacentHTML("afterbegin",'<div class="tx liq" id="liq" style="background-image:url(tex/t8.jpg)"></div><div class="tx veil"></div>');
c.querySelector(".btn").classList.add("m4");c.classList.add("soft");list.appendChild(c);
const set=v=>{c.style.setProperty("--s",v/100);document.getElementById("strV").textContent=v+"%";};set(41);
document.getElementById("str").addEventListener("input",e=>set(+e.target.value));
document.addEventListener("click",e=>{const v=e.target.closest("[data-v]"),b=e.target.closest("[data-b]");
  if(v){document.querySelectorAll("[data-v]").forEach(x=>x.classList.toggle("on",x===v));document.getElementById("liq").style.backgroundImage=`url(tex/t${v.dataset.v}.jpg)`;}
  const st=e.target.closest("[data-st]");if(st){document.querySelectorAll("[data-st]").forEach(x=>x.classList.toggle("on",x===st));const bt=c.querySelector(".btn");bt.classList.toggle("hov",st.dataset.st==="hov");c.classList.toggle("done",st.dataset.st==="done");}
  if(b){document.querySelectorAll("[data-b]").forEach(x=>x.classList.toggle("on",x===b));c.classList.remove("soft","lum");if(b.dataset.b)c.classList.add(b.dataset.b);}});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target,n=f.elements.first_name,m=f.elements.email;
  if(!n.value.trim()){n.focus();return;}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m.value.trim())){m.focus();return;}f.closest(".nl").classList.add("done");});
</script>
</body>
</html>

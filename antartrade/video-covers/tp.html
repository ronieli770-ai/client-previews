<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>AntarTrade - קאבר טייק פרופיט</title>
<style>
  @font-face { font-family: "Reforma Cover"; src: url("file:///Users/ronieliyahu/Library/Fonts/FbReforma-Bold.otf"); font-weight: 700; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; font-family: "Reforma Cover", sans-serif; color: #fff; }
  :root { --pad: 56px; --grad: linear-gradient(90deg, #F261E6 0%, #A061F2 25%, #422ED8 50%, #6161F2 75%, #2B9DF9 100%); }
  .cv { position: relative; width: 1280px; height: 720px; overflow: hidden; isolation: isolate; display: none;
    background: radial-gradient(70% 80% at 75% 30%, #1a2440 0%, #101726 50%, #0a0e16 100%); }
  .cv.on { display: block; }
  .chart { position: absolute; inset: 0; z-index: 0; opacity: .45; filter: blur(1.5px); }
  .grid { position: absolute; left: -10%; right: -10%; bottom: -40px; height: 300px; z-index: 0; opacity: .3;
    background-image: linear-gradient(rgba(97,120,242,.5) 1px, transparent 1px), linear-gradient(90deg, rgba(97,120,242,.5) 1px, transparent 1px);
    background-size: 60px 40px; transform: perspective(500px) rotateX(62deg); transform-origin: bottom; -webkit-mask: linear-gradient(transparent, #000 70%); }

  /* background scenes for version B */
  .scene { position: absolute; inset: 0; z-index: 1; display: none; pointer-events: none; }
  .bg1 .scene.s1, .bg2 .scene.s2, .bg3 .scene.s3 { display: block; }
  .bg1 .chart, .bg2 .chart, .bg3 .chart, .bg3 .grid { display: none; }
  /* 1: a blurred monitor wall behind Noam */
  .s1 .mon { position: absolute; border-radius: 14px; background: #0b0f1a; box-shadow: inset 0 0 0 6px #262e40, 0 0 0 1px rgba(140,150,255,.25), 0 30px 60px -20px rgba(0,0,0,.8); overflow: hidden; filter: blur(2.5px); opacity: .9;
    background: radial-gradient(80% 80% at 50% 0%, rgba(97,97,242,.18), transparent 70%), #0d1220; }
  .s1 .mon svg { position: absolute; inset: 6px; width: calc(100% - 12px); height: calc(100% - 12px); }
  .s1 .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,14,22,0) 45%, rgba(12,17,29,.9) 66%), linear-gradient(0deg, rgba(10,14,22,.9) 0%, rgba(10,14,22,0) 30%); }
  /* 2: one soft gradient ribbon, sweeping behind Noam and under the title */
  .s2 .ribbon { position: absolute; inset: 0; opacity: .5; filter: blur(50px); }
  .s2 .dots { position: absolute; inset: 0; opacity: .22; background-image: radial-gradient(rgba(170,160,255,.9) 1px, transparent 1.5px); background-size: 28px 28px;
    -webkit-mask: radial-gradient(60% 70% at 70% 40%, #000, transparent 75%); }
  /* 3: one big rising chart line across the whole cover */
  .s3 svg { position: absolute; inset: 0; }
  .s3 .guides { position: absolute; inset: 0; background-image: linear-gradient(rgba(140,150,255,.08) 1px, transparent 1px); background-size: 100% 90px; }

  /* Noam + the new laptop, drawn in the source photo's own coordinates (1280x720) */
  .person { position: absolute; top: 0; width: 1280px; height: 720px; z-index: 3; left: var(--px, -330px); }
  .person .flip { position: absolute; inset: 0; transform: scaleX(var(--fx, 1)); }
  .person img, .person svg { position: absolute; inset: 0; width: 1280px; height: 720px; }
  .person .lid-logo { position: absolute; inset: auto; height: auto; top: 478px; width: 250px; left: calc(var(--lx, 664px) - 125px); opacity: .9; mix-blend-mode: screen;
    filter: drop-shadow(0 1px 0 rgba(0,0,0,.6)); transform: perspective(900px) rotateY(var(--ry, 0deg)); }

  .logo { position: absolute; top: var(--pad); height: 34px; z-index: 6; }

  .title { position: absolute; top: calc(var(--pad) + 52px); z-index: 5; }
  .title div { font-size: 104px; font-weight: 700; line-height: .92; letter-spacing: -1px; }
  .title .w { color: #fff; filter: drop-shadow(0 5px 0 #05080f); }
  .title .g { font-size: 148px; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 5px 0 #05080f) drop-shadow(0 0 26px rgba(120,80,240,.45)); }

  .chips { position: absolute; z-index: 4; display: flex; gap: 14px; }
  .chip { position: relative; width: 144px; height: 140px; border-radius: 20px; display: grid; place-items: center; align-content: center; gap: 12px; text-align: center;
    background: linear-gradient(160deg, rgba(120,110,255,.22), rgba(11,14,20,.6) 60%); backdrop-filter: blur(8px);
    box-shadow: 0 0 26px rgba(97,97,242,.35), 0 20px 40px -10px rgba(0,0,0,.6); }
  .chip::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; background: var(--grad);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  .chip svg { width: 52px; height: 52px; color: #fff; filter: drop-shadow(0 0 8px rgba(160,97,242,.9)); }
  .chip span { font-size: 23px; font-weight: 700; line-height: 1.1; }

  /* A: Noam left, title and a straight row of chips on the right, one shared right edge */
  .a .title, .a .chips, .a .logo { right: var(--pad); }
  .a .title { text-align: right; }
  .a .chips { bottom: var(--pad); }

  /* B: same, chips stacked 2x2 under the title, bigger Noam */
  .b { --px: -300px; }
  .b .title, .b .chips, .b .logo { right: var(--pad); }
  .b .chips { bottom: var(--pad); display: grid; grid-template-columns: repeat(2, 240px); gap: 14px; }
  .b .chip { width: 240px; height: 76px; display: flex; justify-content: flex-start; gap: 14px; padding: 0 20px; }
  .b .chip svg { width: 40px; height: 40px; flex: none; }
  .b .chip span br { display: none; }
  .b .chip span { font-size: 23px; white-space: nowrap; }

  /* C: mirrored - Noam right, title and chips on the left */
  .c { --px: 360px; --fx: -1; --lx: 616px; }
  .c .title, .c .chips, .c .logo { left: var(--pad); }
  .c .title { text-align: left; direction: rtl; }
  .c .chips { bottom: var(--pad); flex-direction: row-reverse; }
</style>
</head>
<body>
<template id="tpl">
  <svg class="chart" viewBox="0 0 1280 720" preserveAspectRatio="none"></svg>
  <div class="grid"></div>
  <div class="scene s1">
    <div class="mon" style="left: -40px; top: 70px; width: 380px; height: 250px"><svg class="mc" viewBox="0 0 380 250" preserveAspectRatio="none"></svg></div>
    <div class="mon" style="left: 360px; top: 40px; width: 420px; height: 270px"><svg class="mc" viewBox="0 0 420 270" preserveAspectRatio="none"></svg></div>
    <div class="mon" style="left: -40px; top: 340px; width: 380px; height: 240px"><svg class="mc" viewBox="0 0 380 240" preserveAspectRatio="none"></svg></div>
    <div class="mon" style="left: 360px; top: 330px; width: 420px; height: 250px"><svg class="mc" viewBox="0 0 420 250" preserveAspectRatio="none"></svg></div>
    <div class="shade"></div>
  </div>
  <div class="scene s2">
    <svg class="ribbon" viewBox="0 0 1280 720"><defs><linearGradient id="rg" x1="0" x2="1"><stop offset="0" stop-color="#F261E6"/><stop offset=".25" stop-color="#A061F2"/><stop offset=".5" stop-color="#422ED8"/><stop offset=".75" stop-color="#6161F2"/><stop offset="1" stop-color="#2B9DF9"/></linearGradient></defs>
      <path d="M-80 640 C 200 520, 260 160, 560 180 S 1000 520, 1360 300" fill="none" stroke="url(#rg)" stroke-width="150" stroke-linecap="round"/></svg>
    <div class="dots"></div>
  </div>
  <div class="scene s3">
    <div class="guides"></div>
    <svg viewBox="0 0 1280 720"><defs>
      <linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#F261E6"/><stop offset=".25" stop-color="#A061F2"/><stop offset=".5" stop-color="#422ED8"/><stop offset=".75" stop-color="#6161F2"/><stop offset="1" stop-color="#2B9DF9"/></linearGradient>
      <linearGradient id="af" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6161F2" stop-opacity=".28"/><stop offset="1" stop-color="#6161F2" stop-opacity="0"/></linearGradient></defs>
      <path class="ln-a" fill="url(#af)"/><path class="ln" fill="none" stroke="url(#lg)" stroke-width="4" stroke-linejoin="round" style="filter: drop-shadow(0 0 10px rgba(97,97,242,.8))"/></svg>
  </div>
  <div class="person">
    <div class="flip">
      <img src="img/tp-noam.png" alt="">
      <svg viewBox="0 0 1280 720">
        <defs>
          <linearGradient id="al" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3f48"/><stop offset=".45" stop-color="#262a31"/><stop offset="1" stop-color="#1b1e24"/></linearGradient>
          <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
          <linearGradient id="base" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#15181d"/><stop offset="1" stop-color="#0b0d10"/></linearGradient>
        </defs>
        <rect x="444" y="366" width="440" height="282" rx="16" fill="url(#al)"/>
        <rect x="444" y="366" width="440" height="282" rx="16" fill="url(#sheen)"/>
        <rect x="444.75" y="366.75" width="438.5" height="280.5" rx="15.5" fill="none" stroke="#5b616c" stroke-opacity=".7" stroke-width="1.5"/>
        <rect x="452" y="640" width="424" height="40" rx="9" fill="url(#base)"/>
        <rect x="452" y="640" width="424" height="3" fill="#000" opacity=".6"/>
      </svg>
    </div>
    <img class="lid-logo" src="img/white-takeprofit.png" alt="">
    <div class="flip"><img src="img/tp-hands.png" alt=""></div>
  </div>
  <img class="logo" src="img/logo-new-white.png" alt="">
  <div class="title"><div class="w">החוקים של</div><div class="g">טייק פרופיט</div></div>
  <div class="chips">
    <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg><span>יעד רווח</span></div>
    <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><path d="M9 12h6"/></svg><span>הפסד יומי</span></div>
    <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l6 6 4-4 8 8"/><path d="M15 16h6v-6"/></svg><span>ירידה <br>מקסימלית</span></div>
    <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/><path d="M9 15l2 2 4-4"/></svg><span>משיכת <br>רווחים</span></div>
  </div>
</template>
<div class="cv a" id="a"></div>
<div class="cv b" id="b"></div>
<div class="cv c" id="c"></div>
<div class="cv b bg1" id="b1"></div>
<div class="cv b bg2" id="b2"></div>
<div class="cv b bg3" id="b3"></div>
<script>
  let s = 7; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  let y = 470, chart = '';
  for (let x = 20; x < 1280; x += 26) {
    const o = y, c = y + (rnd() - .58) * 46; y = c;
    const hi = Math.min(o, c) - rnd() * 24, lo = Math.max(o, c) + rnd() * 24, col = c < o ? '#6161F2' : '#2B9DF9', a = .2 + (x / 1280) * .5;
    chart += `<line x1="${x + 7}" x2="${x + 7}" y1="${hi}" y2="${lo}" stroke="${col}" stroke-opacity="${a}" stroke-width="2"/><rect x="${x}" y="${Math.min(o, c)}" width="14" height="${Math.max(3, Math.abs(c - o))}" rx="2" fill="${col}" fill-opacity="${a}"/>`;
  }
  const v = (location.hash || '#a').slice(1), el = document.getElementById(v);
  el.innerHTML = document.getElementById('tpl').innerHTML; el.classList.add('on');
  el.querySelector('.chart').innerHTML = chart;

  // monitor charts and the big line, same fixed seed every render
  el.querySelectorAll('.mc').forEach(m => { const [w, h] = m.getAttribute('viewBox').split(' ').slice(2).map(Number); let yy = h * .6, o2 = '';
    for (let x = 10; x < w; x += 14) { const o = yy, c = Math.max(20, Math.min(h - 20, yy + (rnd() - .55) * 24)); yy = c;
      const col = c < o ? '#6161F2' : '#2B9DF9'; o2 += `<line x1="${x + 4}" x2="${x + 4}" y1="${Math.min(o, c) - rnd() * 12}" y2="${Math.max(o, c) + rnd() * 12}" stroke="${col}" stroke-width="1.5"/><rect x="${x}" y="${Math.min(o, c)}" width="8" height="${Math.max(2, Math.abs(c - o))}" fill="${col}"/>`; }
    m.innerHTML = o2; });
  const ln = el.querySelector('.ln'); if (ln) { let yy = 640, d = 'M -10 640'; for (let x = 0; x <= 1300; x += 40) { yy = Math.max(110, yy - 14 + (rnd() - .5) * 70); d += ` L ${x} ${yy.toFixed(1)}`; }
    ln.setAttribute('d', d); el.querySelector('.ln-a').setAttribute('d', d + ' L 1300 760 L -10 760 Z'); }
  if (v === 'c') el.querySelector('.chart').style.transform = 'scaleX(-1)';
</script>
</body>
</html>

// a full-cover chart; opts: trend (drift per candle), vol (swing), side ('L' price scale on the left)
const MKT = (seed, { trend = -2, vol = 34, op = .55, mask = 'radial-gradient(90% 90% at 40% 50%, #000 40%, transparent 85%)', copy = false } = {}) => {
  let t = seed; const r = () => (t = (t * 9301 + 49297) % 233280) / 233280;
  let y = 470, o = '', ma = [], vols = '', pts = [];
  for (let x = 14, i = 0; x < 1280; x += 22, i++) {
    const a = y, b = Math.max(90, Math.min(600, y + trend + (r() - .5) * vol)); y = b; pts.push([x + 6, b]);
    const up = b < a, col = up ? '#3fd8c2' : '#ff5d7a';
    o += `<line x1="${x + 6}" x2="${x + 6}" y1="${Math.min(a, b) - r() * 18}" y2="${Math.max(a, b) + r() * 18}" stroke="${col}" stroke-width="1.6"/><rect x="${x}" y="${Math.min(a, b)}" width="12" height="${Math.max(2, Math.abs(b - a))}" rx="1.5" fill="${col}"/>`;
    vols += `<rect x="${x}" y="${720 - (h => h)(14 + r() * 60)}" width="12" height="80" fill="${col}" opacity=".35"/>`;
    ma.push([x + 6, (ma.length ? ma[ma.length - 1][1] * .8 + b * .2 : b)]);
  }
  const line = (arr, dy = 0) => 'M' + arr.map(([x, v]) => `${x} ${(v + dy).toFixed(1)}`).join(' L');

  for (let x = 10; x < w; x += 14) { const a = yy, b = Math.max(20, Math.min(h - 20, yy + (rnd() - .55) * 24)); yy = b; const col = b < a ? '#6161F2' : '#2B9DF9';
    o += `<line x1="${x + 4}" x2="${x + 4}" y1="${Math.min(a, b) - rnd() * 12}" y2="${Math.max(a, b) + rnd() * 12}" stroke="${col}" stroke-width="1.5"/><rect x="${x}" y="${Math.min(a, b)}" width="8" height="${Math.max(2, Math.abs(b - a))}" fill="${col}"/>`; }
  m.innerHTML = o; });
</script>
</body>
</html>

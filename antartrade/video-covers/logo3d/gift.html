<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script></head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
/* #variant : a gift box in the site's palette (a = closed, b = lid lifted with light inside) */
const v = location.hash.slice(1) || 'a'; const W = 900, H = 820;
const R = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); R.setPixelRatio(1); R.setSize(W, H); R.setClearColor(0, 0);
R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.05; document.body.appendChild(R.domElement);
const sc = new THREE.Scene(); sc.environment = new THREE.PMREMGenerator(R).fromScene(new RoomEnvironment(), 0.04).texture;
const k = new THREE.DirectionalLight(0xffffff, 2); k.position.set(-3, 5, 5); sc.add(k);
const rim = new THREE.DirectionalLight(0x7dc6ff, 4); rim.position.set(4, 2, -4); sc.add(rim);
const cam = new THREE.PerspectiveCamera(26, W / H, .1, 100); cam.position.set(6.2, 4.6, 9.6); cam.lookAt(0, 1.15, 0);
const g = new THREE.Group();
const boxMat = new THREE.MeshPhysicalMaterial({ color: '#2b5e96', metalness: .3, roughness: .2, clearcoat: 1, clearcoatRoughness: .08, envMapIntensity: 1.3 });
const ribMat = new THREE.MeshPhysicalMaterial({ color: '#dff0ff', metalness: .5, roughness: .18, clearcoat: 1, envMapIntensity: 1.8, sheen: .6, sheenColor: new THREE.Color('#9fd6ff') });
const body = new THREE.Mesh(new RoundedBoxGeometry(2, 1.5, 2, 6, .12), boxMat); body.position.y = .75; g.add(body);
const lidY = v === 'b' ? 2.25 : 1.62, lidTilt = v === 'b' ? -.38 : 0;
const lid = new THREE.Group(); lid.position.set(0, lidY, 0); lid.rotation.z = lidTilt; g.add(lid);
lid.add(new THREE.Mesh(new RoundedBoxGeometry(2.22, .38, 2.22, 6, .1), boxMat));
// ribbons around the body and the lid
const band = (w, h, d, y, parent) => { const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, .03), ribMat); m.position.y = y; parent.add(m); };
band(.36, 1.52, 2.04, .75, g); band(2.04, 1.52, .36, .75, g); band(.38, .4, 2.26, 0, lid); band(2.26, .4, .38, 0, lid);
// bow: two torus loops on top of the lid
for (const s of [-1, 1]) { const t = new THREE.Mesh(new THREE.TorusGeometry(.42, .11, 24, 64), ribMat); t.position.set(s * .36, .52, 0); t.rotation.set(0, Math.PI / 2, s * .55); t.scale.set(1, .75, 1); lid.add(t); }
const knot = new THREE.Mesh(new THREE.SphereGeometry(.16, 32, 32), ribMat); knot.position.y = .3; lid.add(knot);
if (v === 'b') { const glow = new THREE.PointLight(0x7dc6ff, 40, 7); glow.position.set(0, 1.7, 0); g.add(glow);
  for (const [x, y, z, r] of [[-.5, 2.7, .3, .2], [.6, 3.1, -.2, .14], [.1, 3.5, .5, .1], [-.2, 2.3, -.6, .12]]) { const st = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 24), new THREE.MeshBasicMaterial({ color: '#d6ecff' })); st.position.set(x, y, z); g.add(st); }
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(.9, .7, 1.4, 48, 1, true), new THREE.MeshBasicMaterial({ color: '#7dc6ff', transparent: true, opacity: .22, side: THREE.DoubleSide, depthWrite: false })); beam.position.y = 2.05; g.add(beam); }
g.rotation.y = -.55; sc.add(g); R.render(sc, cam); document.title = 'done';
</script></body></html>

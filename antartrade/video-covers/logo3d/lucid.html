<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script></head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
/* #variant : the Lucid sphere, in 3D material variations */
const v = location.hash.slice(1) || 'a'; const S = 800;
const R = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); R.setPixelRatio(1); R.setSize(S, S); R.setClearColor(0, 0);
R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.1; document.body.appendChild(R.domElement);
const sc = new THREE.Scene(); sc.environment = new THREE.PMREMGenerator(R).fromScene(new RoomEnvironment(), 0.04).texture;
const k = new THREE.DirectionalLight(0xffffff, 2.2); k.position.set(-3, 4, 5); sc.add(k); const rim = new THREE.DirectionalLight(0x7dc6ff, 3.5); rim.position.set(4, -1, -3); sc.add(rim);
const cam = new THREE.PerspectiveCamera(28, 1, .1, 100); cam.position.set(0, 0, 9);
const g = new THREE.Group();
const sg = new THREE.SphereGeometry(1.5, 160, 160);
const vgrad = (geo, top, bot) => { const p = geo.attributes.position, c = [], a = new THREE.Color(top), b = new THREE.Color(bot); for (let i = 0; i < p.count; i++) { const t = (p.getY(i) + 1.5) / 3; const x = b.clone().lerp(a, t); c.push(x.r, x.g, x.b); } geo.setAttribute('color', new THREE.Float32BufferAttribute(c, 3)); };
const ring = (col, glow, r = .045, tilt = Math.PI / 2.3) => { const t = new THREE.Mesh(new THREE.TorusGeometry(1.53, r, 32, 240), new THREE.MeshPhysicalMaterial({ color: col, emissive: glow, emissiveIntensity: 1.4, metalness: .2, roughness: .25 })); t.rotation.set(tilt, .35, 0); return t; };
const arc = (col, glow) => { /* the short inner arc of the Lucid mark, raised on the sphere surface */ const curve = new THREE.CatmullRomCurve3(Array.from({ length: 24 }, (_, i) => { const a = Math.PI * (.62 + i / 23 * .3); return new THREE.Vector3(Math.cos(a) * .95, Math.sin(a) * .95, 1.18).normalize().multiplyScalar(1.53); }));
  return new THREE.Mesh(new THREE.TubeGeometry(curve, 64, .11, 24), new THREE.MeshPhysicalMaterial({ color: col, emissive: glow, emissiveIntensity: .8, metalness: .2, roughness: .2, clearcoat: 1 })); };
let mat;
if (v === 'a') { mat = new THREE.MeshPhysicalMaterial({ color: '#16294a', metalness: .3, roughness: .08, clearcoat: 1, clearcoatRoughness: .02, envMapIntensity: 1.6 }); g.add(ring('#9fd8ff', '#55a9eb')); }
if (v === 'b') { vgrad(sg, '#9fd6ff', '#123a6e'); mat = new THREE.MeshPhysicalMaterial({ vertexColors: true, metalness: .1, roughness: .18, clearcoat: 1, clearcoatRoughness: .03, envMapIntensity: .7 }); }
if (v === 'c') { mat = new THREE.MeshPhysicalMaterial({ color: '#e9f3ff', metalness: .25, roughness: .1, clearcoat: 1, clearcoatRoughness: .03, iridescence: .45, envMapIntensity: 1.9 }); g.add(ring('#7dc6ff', '#3a8fd8', .06)); }
if (v === 'd') { mat = new THREE.MeshPhysicalMaterial({ color: '#cfe9ff', metalness: 0, roughness: .05, transparent: true, opacity: .38, clearcoat: 1, envMapIntensity: 2.2, side: THREE.DoubleSide, depthWrite: false });
  const core = new THREE.Mesh(new THREE.SphereGeometry(.85, 64, 64), new THREE.MeshPhysicalMaterial({ color: '#7dc6ff', emissive: '#3a8fd8', emissiveIntensity: .9, roughness: .3, clearcoat: 1 })); g.add(core); }
if (v === 'e') { mat = new THREE.MeshPhysicalMaterial({ color: '#f2f7ff', metalness: .9, roughness: .2, envMapIntensity: 3.2 }); }
if (v === 'f') { vgrad(sg, '#3d7fc4', '#0e1d38'); mat = new THREE.MeshPhysicalMaterial({ vertexColors: true, metalness: .3, roughness: .1, clearcoat: 1, clearcoatRoughness: .02, envMapIntensity: 1.5 }); g.add(arc('#bfe6ff', '#55a9eb')); g.add(ring('#ffffff', '#7dc6ff', .05, 0)); }
g.add(new THREE.Mesh(sg, mat));
g.rotation.set(THREE.MathUtils.degToRad(6), THREE.MathUtils.degToRad(-14), 0); sc.add(g); R.render(sc, cam); document.title = 'done';
</script></body></html>

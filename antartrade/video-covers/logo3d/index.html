<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>3D logo render</title>
<style>html, body { margin: 0; background: transparent; overflow: hidden; } canvas { display: block; }</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// #logo,rotateY,rotateX  e.g. #apex,-28,12
const [key, ry = -26, rx = 10] = location.hash.slice(1).split(',');
const SIZE = 1000;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(SIZE, SIZE); renderer.setClearColor(0, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const key1 = new THREE.DirectionalLight(0xffffff, 2.2); key1.position.set(-3, 4, 5); scene.add(key1);
const rim = new THREE.DirectionalLight(0x7dc6ff, 3); rim.position.set(4, 1, -3); scene.add(rim);
const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 100); camera.position.set(0, 0, 9);

const data = await (await fetch('traced.json')).json();
if (key === 'lucid') { // a glass sphere, the way Lucid draws its mark
  const g = new THREE.SphereGeometry(1.7, 128, 128);
  const m = new THREE.MeshPhysicalMaterial({ color: '#16233a', metalness: .45, roughness: .1, clearcoat: 1, clearcoatRoughness: .03, iridescence: .7, iridescenceIOR: 1.8, envMapIntensity: 2.6 });
  const sp = new THREE.Mesh(g, m); scene.add(sp);
  renderer.render(scene, camera); document.title = 'done'; throw 'done';
}
const group = new THREE.Group();
const parts = data[key];
// size everything to a common box
const all = [];
for (const p of parts) {
  const sp = new SVGLoader().parse(`<svg xmlns="http://www.w3.org/2000/svg"><path d="${p.d}"/></svg>`).paths[0];
  all.push([p, SVGLoader.createShapes(sp)]);
}
const tmp = new THREE.Box2(); all.forEach(([, shapes]) => shapes.forEach(s => s.getPoints().forEach(v => tmp.expandByPoint(v))));
const span = Math.max(tmp.max.x - tmp.min.x, tmp.max.y - tmp.min.y), k = 4 / span;

const grad = (geo, a, b) => { // left-to-right colour along the logo
  geo.computeBoundingBox(); const bb = geo.boundingBox, pos = geo.attributes.position, col = [], ca = new THREE.Color(a), cb = new THREE.Color(b);
  for (let i = 0; i < pos.count; i++) { const t = (pos.getX(i) - bb.min.x) / (bb.max.x - bb.min.x || 1); const c = ca.clone().lerp(cb, t); col.push(c.r, c.g, c.b); }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
};
for (const [p, shapes] of all) {
  const geo = new THREE.ExtrudeGeometry(shapes, { depth: span * 0.16, bevelEnabled: true, bevelThickness: span * 0.02, bevelSize: span * 0.012, bevelSegments: 6, curveSegments: 24 });
  let mat;
  if (p.color === 'apex') { grad(geo, '#20385e', '#5fb4f5'); mat = new THREE.MeshPhysicalMaterial({ vertexColors: true, metalness: .25, roughness: .22, clearcoat: 1, clearcoatRoughness: .08, envMapIntensity: 1.3 }); }
  else if (p.color === 'topstep') { grad(geo, '#2a3552', '#9ad4ff'); mat = new THREE.MeshPhysicalMaterial({ vertexColors: true, metalness: .35, roughness: .2, clearcoat: 1, clearcoatRoughness: .06, envMapIntensity: 1.4 }); }
  else if (p.color === 'atas') { grad(geo, '#1e6fa8', '#5fd0ff'); mat = new THREE.MeshPhysicalMaterial({ vertexColors: true, metalness: .2, roughness: .2, clearcoat: 1, clearcoatRoughness: .06, envMapIntensity: 1.4 }); }
  else if (p.color === 'chrome') mat = new THREE.MeshPhysicalMaterial({ color: '#f4f7fb', metalness: .85, roughness: .18, clearcoat: 1, clearcoatRoughness: .05, envMapIntensity: 2.4 });
  else mat = new THREE.MeshPhysicalMaterial({ color: p.color, metalness: .1, roughness: .25, clearcoat: 1, clearcoatRoughness: .08, envMapIntensity: 1.2 });
  const m = new THREE.Mesh(geo, mat); group.add(m);
}
group.scale.set(k, -k, k); // svg y points down
const box = new THREE.Box3().setFromObject(group), c = box.getCenter(new THREE.Vector3());
group.position.sub(c);
const pivot = new THREE.Group(); pivot.add(group); scene.add(pivot);
pivot.rotation.set(THREE.MathUtils.degToRad(+rx), THREE.MathUtils.degToRad(+ry), 0);
renderer.render(scene, camera);
document.title = 'done';
</script>
</body>
</html>

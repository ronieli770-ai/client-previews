<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AntarTrade - שאר הקאברים</title>
<style>
  @font-face { font-family: "Fb Reforma"; src: url("../../fonts/FbReforma-Regular.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Fb Reforma"; src: url("../../fonts/FbReforma-Medium.woff2") format("woff2"); font-weight: 500 700; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #12161f; color: #fff; font-family: "Fb Reforma", sans-serif; padding: 64px 24px 120px; }
  .wrap { max-width: 1280px; margin: 0 auto; }
  h1 { font-size: 40px; font-weight: 500; } h2 { margin-top: 64px; font-size: 28px; font-weight: 500; }
  .lead { margin-top: 10px; font-size: 18px; color: rgba(255,255,255,.6); }
  figure { margin-top: 28px; } figure img { width: 100%; display: block; border-radius: 14px; }
  figcaption { margin-top: 8px; font-size: 15px; color: rgba(255,255,255,.6); }
</style>
</head>
<body>
<div class="wrap">
  <h1>שאר הקאברים - סרטונים ומאמרים</h1>
  <p class="lead">כל התכנים שמופיעים בספריית הווידאו ובבלוג באתר החי, באותה שפה בלי תמונה.</p>
  <h2>סרטונים</h2><div id="v"></div>
  <h2>מאמרים</h2><div id="a"></div>
</div>
<script>
  const V = [['v-stats', 'איך להשתמש בסטטיסטיקה של היומן לשיפור תוצאות'], ['v-intraday', 'איך לסחור נכון עם סטופ תוך יומי'], ['v-footprint', 'מדריך על פוטפרינט'], ['v-lucid-withdraw', 'תהליך המשיכה מלוסיד טריידינג'], ['v-apex-plane', 'הגעתם למשיכה באפקס - מדריך ל-Plane'], ['v-lucid', 'מדריך ללוסיד'], ['v-atas', 'מדריך ל-ATAS'], ['v-daily-stop', 'איך מגדירים סטופ יומי במערכת'], ['v-ninja-screens', 'סידור מסכים בנינג׳ה'], ['v-tax', 'איך עובד המיסוי עם חברות הנוסטרו'], ['v-journal', 'הדרכה על יומן המסחר']];
  const A = [['a-stats', 'איך לשפר את הרווחיות בעזרת יומן מסחר: סטטיסטיקה מ-1:1'], ['a-export-tradovate', 'איך מייצאים עסקאות מטריידובייט ליומן'], ['a-export-ninja', 'איך מייצאים עסקאות מנינג׳ה טריידר (ריתמיק)'], ['a-journal', 'יומן מסחר חינמי - המדריך המלא'], ['a-wise', 'משיכה מטייק פרופיט לאינטראקטיב דרך Wise'], ['a-lucid', 'Lucid Trading - המדריך המלא']];
  const f = ([k, t]) => `<figure><img src="out6/${k}.png?v=7" alt=""><figcaption>${t}</figcaption></figure>`;
  document.getElementById('v').innerHTML = V.map(f).join(''); document.getElementById('a').innerHTML = A.map(f).join('');
</script>
</body>
</html>

<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>אייקוני הפרסים</title>
<link rel="icon" href="assets/bulb.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/challenge.css">
<style>
/* one row per prize: today's icon and the new options side by side, each as the real prize chip and as a big tile */
@font-face{font-family:"Fb Reforma";src:url("assets/FbReforma-Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Fb Reforma";src:url("assets/FbReforma-Medium.woff2") format("woff2");font-weight:500}
:root{--page:#10151e;--block:#1a212d;--block2:#252e3d;--fg:#f4f7fc;--fg-rgb:244,247,252;--muted:rgba(244,247,252,.78);--faint:rgba(244,247,252,.58);--sky:#7DC6FF;
  --he:"Fb Reforma",Heebo,system-ui,sans-serif;--en:"Roboto","Fb Reforma",sans-serif;color-scheme:dark;
  --c-sky:#61b1f2;--c-mint:#3fd8c2;--c-violet:#8c7bff;--c-orchid:#d17bff;--c-sun:#f7c65a}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--fg);font-family:var(--he);-webkit-font-smoothing:antialiased}
.num{font-family:var(--en);unicode-bidi:isolate;direction:ltr}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1100px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-left,0px)) 64px max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1{margin:0;font-size:30px;font-weight:500;line-height:1.1}
.lead{margin:0;color:var(--muted);font-size:15px;max-width:70ch}
.pz{background:var(--block);border-radius:22px;padding:20px;display:grid;gap:14px}
.pz .hd{display:grid;gap:2px}
.pz h2{margin:0;font-size:18px;font-weight:500}
.pz .hd p{margin:0;color:var(--muted);font-size:14px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.op{background:var(--block2);border-radius:18px;padding:16px;display:grid;justify-items:start;gap:12px}
.op .lb{font-size:13px;color:var(--faint)}
.op.now .lb{color:var(--c-sun)}
.op .big{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent)}
.op .big .i{width:30px;height:30px;color:var(--c)}
.op .c9-prz{background:#1a212d}
.cx2{position:relative;display:inline-grid;place-items:center;width:24px;height:24px;flex:none}.cx2 img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}.cx2 b{position:absolute;bottom:-4px;left:-6px;font-size:9px;font-weight:600;line-height:1;padding:2px 3px;border-radius:6px;background:var(--c-mint);color:#12161f}
.op .big .cx2{width:34px;height:34px}.op .big .cx2 b{font-size:12px;padding:2px 4px;bottom:-6px;left:-9px}
.op small{font-size:13px;color:var(--muted);line-height:1.45}
</style>
</head>
<body>
<main class="wrap">
  <h1>אייקוני הפרסים</h1>
  <p class="lead">כל פרס שיוצא מתיבה או מכרטיס גירוד, עם האייקון שלו היום ואפשרויות ברורות יותר. כל אפשרות מוצגת גם כמו שהיא בצ'יפ של הפרס, וגם בגדול. כל האייקונים בקו חלול ומעוגל, כמו בשאר היומן.</p>
  <div id="list" style="display:grid;gap:16px"></div>
</main>
<script>
const SV=p=>p==="COINX2"?`<span class="cx2"><img alt="" src="assets/game/coin.webp"><b class="num">x2</b></span>`:`<svg class="i" viewBox="0 0 24 24">${p}</svg>`;
/* today's icons, from challenge.js */
const NOW={
  dbl:'<path d="M4.5 9.5l5 5M9.5 9.5l-5 5"/><path d="M13.5 10.6a2.6 2.6 0 1 1 4.7 1.5L13.5 16h5.2"/>',
  disc:'<path d="M18 6L6 18"/><circle cx="7.5" cy="7.5" r="2.2"/><circle cx="16.5" cy="16.5" r="2.2"/>',
  rep:'<path d="M5 19V9M10 19V5M15 19v-7M20 19v-4"/>',
  cert:'<rect x="4" y="4.5" width="16" height="11" rx="2"/><path d="M9.5 15.5l-1.5 4 2.5-1 1.5 1.5 1.5-1.5 2.5 1-1.5-4"/><path d="M8 8.5h8M8 11.5h5"/>',
  tix:'<path d="M4 8.5V7a1.5 1.5 0 0 1 1.5-1.5h13A1.5 1.5 0 0 1 20 7v1.5a2.5 2.5 0 0 0 0 5V17a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17v-3.5a2.5 2.5 0 0 0 0-5z"/><path d="M14.5 6v2M14.5 11v2M14.5 16v2"/>',
  saver:'<path d="M12 3.5l7 2.6v5.2c0 4.3-2.9 7.6-7 9.2-4.1-1.6-7-4.9-7-9.2V6.1z"/><path d="M12 15.6s-3-1.8-3-3.9c0-1.1.8-2 1.8-2 .5 0 .9.2 1.2.6.3-.4.7-.6 1.2-.6 1 0 1.8.9 1.8 2 0 2.1-3 3.9-3 3.9z"/>'};
/* the new options */
const X2='<path d="M4.5 9.5l5 5M9.5 9.5l-5 5"/><path d="M13.5 10.6a2.6 2.6 0 1 1 4.7 1.5L13.5 16h5.2"/>';
const COINS2='<circle cx="9.5" cy="12" r="5.5"/><path d="M13.6 6.8a5.5 5.5 0 1 1 0 10.4"/><path d="M8.2 14.2l1.3-4.4 1.3 4.4M8.6 12.9h1.8"/>';
const CALX2='<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4"/><path d="M7.2 12l3.2 3.6M10.4 12l-3.2 3.6"/><path d="M13 12.6a1.8 1.8 0 1 1 3.3 1L13 16.2h3.6"/>';
const TAGPCT='<path d="M3.5 12.5V5a1.5 1.5 0 0 1 1.5-1.5h7.5l8 8-9 9z"/><path d="M14.4 9.6l-4.8 4.8"/><circle cx="9.6" cy="9.8" r=".9"/><circle cx="14.2" cy="14.2" r=".9"/>';
const BADGEPCT='<circle cx="12" cy="12" r="8.5"/><path d="M15 9l-6 6"/><circle cx="9.3" cy="9.3" r="1.1"/><circle cx="14.7" cy="14.7" r="1.1"/>';
const DOCBARS='<rect x="5" y="3" width="14" height="18" rx="2.6"/><path d="M9 17v-3M12 17v-6M15 17v-4"/>';
const TREND='<path d="M4 17l5-5 4 3 7-8"/><path d="M15 7h5v5"/>';
const MEDAL='<circle cx="12" cy="9" r="5.5"/><path d="M9.3 13.8L8 21l4-2 4 2-1.3-7.2"/><path d="M12 6.6l.8 1.6 1.7.2-1.2 1.2.3 1.7-1.6-.8-1.6.8.3-1.7-1.2-1.2 1.7-.2z"/>';
const SCROLL='<path d="M7 4h11a2 2 0 0 1 2 2v1H9"/><path d="M9 7v11a2 2 0 0 1-4 0v-2h3"/><path d="M9 20h8a2 2 0 0 0 2-2V7"/><path d="M12 11h4M12 14h3"/>';
const ROWS=[
  {k:"dbl",c:"mint",t:"מטבעות כפולים ביעד הבא",w:"בתיבה של יעד 10. כל המטבעות של היעד הבא שווים פי 2.",opts:[["היום",NOW.dbl,"האות D עם איקס. לא ברור שזה פי 2."],["א",X2,"x2 כתוב בקו. הכי ישיר."],["ב","COINX2","המטבע מהארנק עם תג x2. מתחבר למטבעות שכבר רואים בכל מקום."]]},
  {k:"dblday",c:"mint",t:"יום של מטבעות כפולים",w:"בכרטיס הגירוד של יום 75. ביום אחד כל המטבעות שווים פי 2.",opts:[["היום",NOW.dbl,"אותו אייקון כמו ביעד, ולא ברור."],["א",X2,"אותו x2, כי זו אותה משמעות: מטבעות כפולים."],["ב","COINX2","אותו מטבע עם x2, כמו ביעד."],["ג",CALX2,"לוח שנה עם x2, כדי להראות שזה ליום אחד."]]},
  {k:"disc",c:"sun",t:"15% הנחה על הקורס ל-7 ימים",w:"בתיבה של יעד 30.",opts:[["היום",NOW.disc,"סימן אחוז לבד."],["א",TAGPCT,"תווית מחיר עם אחוז, כמו של מבצע."],["ב",BADGEPCT,"עיגול עם אחוז, כמו תג הנחה."]]},
  {k:"rep",c:"sky",t:"הדוח: מה הנתונים שלך אומרים",w:"בתיבה של יעד 30. התובנה של 30 יום.",opts:[["היום",NOW.rep,"עמודות בלי מסגרת. נראה כמו גרף ולא כמו דוח."],["א",DOCBARS,"דף עם עמודות. ברור שזה דוח."],["ב",TREND,"קו עולה. אומר התקדמות יותר מדוח."]]},
  {k:"cert",c:"sun",t:"תעודת סיום",w:"בתיבה של יעד 90.",opts:[["היום",NOW.cert,"מסגרת עם סרט. קטן ועמוס."],["א",MEDAL,"מדליה עם כוכב. ברורה גם בקטן."],["ב",SCROLL,"מגילה. תעודה במובן הקלאסי."]]},
  {k:"tix",c:"sky",t:"כרטיס הגרלה",w:"ביעדים 20, 60 ו-90, וביום 45. נשאר כמו שהוא?",opts:[["היום",NOW.tix,"כרטיס עם קו מנוקב. נראה לי ברור."]]},
  {k:"saver",c:"mint",t:"שומר רצף",w:"בארנק ובפס העליון. נשאר כמו שהוא?",opts:[["היום",NOW.saver,"מגן עם לב. נראה לי ברור."]]}];
document.getElementById("list").innerHTML=ROWS.map(r=>`<section class="pz"><div class="hd"><h2>${r.t}</h2><p>${r.w}</p></div><div class="opts">${r.opts.map(([l,ic,d])=>`<div class="op${l==="היום"?" now":""}" style="--c:var(--c-${r.c})"><span class="lb">${l==="היום"?"היום":"אפשרות "+l}</span><span class="big">${SV(ic)}</span><span class="c9-prz" style="--c:var(--c-${r.c})">${SV(ic)}<span>${r.t}</span></span><small>${d}</small></div>`).join("")}</div></section>`).join("");
</script>
</body>
</html>

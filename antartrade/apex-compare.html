<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>אפקס - לפני ואחרי</title>
<style>
  body { margin: 0; min-height: 100vh; background: #e9edf2; font-family: system-ui, sans-serif; color: #12161f; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 24px; flex-wrap: wrap; }
  .top h1 { margin: 0; font-size: 18px; font-weight: 600; }
  .tg { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: #fff; box-shadow: 0 1px 4px rgba(18,22,31,.08); }
  .tg button { border: 0; background: none; padding: 8px 16px; border-radius: 999px; font: inherit; cursor: pointer; color: #5b6676; }
  .tg button.on { background: #12161f; color: #fff; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 0 24px 24px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .col b { font-size: 15px; }
  .col small { color: #5b6676; font-size: 13px; }
  .frame { width: 100%; height: calc(100vh - 120px); border: 0; border-radius: 18px; background: #12161f; box-shadow: 0 20px 50px rgba(18,22,31,.2); }
  body.phone .frame { width: 390px; height: min(844px, calc(100vh - 120px)); border-radius: 40px; border: 10px solid #0b0e14; }
</style></head>
<body>
  <div class="top">
    <h1>אפקס, אזור החשבונות: לפני ואחרי</h1>
    <div class="tg"><button type="button" data-v="desk" class="on">מחשב</button><button type="button" data-v="phone">טלפון</button></div>
  </div>
  <div class="cols">
    <div class="col"><b>לפני</b><small>אזור כהה, הכרטיס כהה משני הצדדים</small><iframe class="frame" src="apex-before/apex-new/#accounts" title="לפני"></iframe></div>
    <div class="col"><b>אחרי</b><small>אזור לבן, כרטיס לבן שמתהפך לצד כהה של החשבון הממומן</small><iframe class="frame" src="apex/apex-new/#accounts" title="אחרי"></iframe></div>
  </div>
  <script>
    document.querySelector('.tg').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      document.querySelectorAll('.tg button').forEach(function (x) { x.classList.toggle('on', x === b); });
      document.body.classList.toggle('phone', b.dataset.v === 'phone');
    });
  </script>
</body>
</html>

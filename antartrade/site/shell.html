<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AntarTrade - דף הבית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=IBM+Plex+Sans+Hebrew:wght@400&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: "Fb Reforma"; src: url("../../fonts/FbReforma-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Fb Reforma"; src: url("../../fonts/FbReforma-Medium.woff2") format("woff2"); font-weight: 500 700; font-display: swap; }
  /* Hebrew letters inside anything set in Roboto (code chips, numbers, "הועתק" swaps) render in Reforma, never in a default font */
  @font-face { font-family: "Roboto"; font-style: normal; font-weight: 400; src: url("../../fonts/FbReforma-Regular.woff2") format("woff2"); unicode-range: U+0590-05FF, U+FB1D-FB4F; font-display: swap; }
  @font-face { font-family: "Roboto"; font-style: normal; font-weight: 500; src: url("../../fonts/FbReforma-Medium.woff2") format("woff2"); unicode-range: U+0590-05FF, U+FB1D-FB4F; font-display: swap; }
  @font-face { font-family: "Roboto"; font-style: normal; font-weight: 600; src: url("../../fonts/FbReforma-Medium.woff2") format("woff2"); unicode-range: U+0590-05FF, U+FB1D-FB4F; font-display: swap; }
  @font-face { font-family: "Roboto"; font-style: normal; font-weight: 700; src: url("../../fonts/FbReforma-Medium.woff2") format("woff2"); unicode-range: U+0590-05FF, U+FB1D-FB4F; font-display: swap; }
  @property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  @property --sx { syntax: "<length>"; inherits: true; initial-value: 0px; }
  @property --sy { syntax: "<length>"; inherits: true; initial-value: 0px; }
  @property --ga { syntax: "<number>"; inherits: true; initial-value: 0; }
  :root { --navy: #12161f; --card: #0b0e14; --sky: #7dc6ff; --sky2: #61b1f2; --ice: #d6ecff; --blue: #2e8bd8; --fade: .55s cubic-bezier(.22,.61,.36,1); --ease: cubic-bezier(.22,.61,.36,1); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html.lenis, html.lenis body { height: auto; }
  .lenis.lenis-smooth { scroll-behavior: auto !important; }
  html, body { overflow-x: clip; }
  body { position: relative; font-family: "Fb Reforma", sans-serif; background: #fff; color: var(--navy); -webkit-font-smoothing: antialiased; }
  img { max-width: 100%; }
  input, textarea { font-family: "IBM Plex Sans Hebrew", sans-serif; }
  .lat { font-family: "Roboto", sans-serif; }

  /* ---------- header: full width, takes the colour of the section under it once scrolling starts ---------- */
  .hdr { --bg: rgba(18,22,31,0); --fg: #fff; --deal: #d6ecff; --ring: rgba(255,255,255,.14); --ringbg: rgba(85,169,235,.05); --pill: #fff; --pillfg: #000;
    position: fixed; inset: 0 0 auto 0; z-index: 50; background: var(--bg); color: var(--fg); transition: background-color var(--fade), color var(--fade); }
  .hdr.on.dark  { --bg: #12161f; }
  .hdr.on.light { --bg: #fff; --fg: #12161f; --deal: #2e8bd8; --ring: rgba(18,22,31,.10); --ringbg: rgba(18,22,31,.03); --pill: #12161f; --pillfg: #fff; }
  .hdr .wrap { max-width: 1460px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 40px; }
  /* white logo over dark sections, the full-colour main logo over light ones */
  .hdr .logo { position: relative; width: 195px; height: 51px; flex: 0 0 auto; }
  .hdr .logo::before, .hdr .logo::after { content: ""; position: absolute; inset: 0; background: url(img/logo-white.png) right center / contain no-repeat; transition: opacity var(--fade); }
  .hdr .logo::after { background-image: url(img/logo-main.png); opacity: 0; }
  .hdr.on.light .logo::before { opacity: 0; }
  .hdr.on.light .logo::after { opacity: 1; }
  .hdr nav { display: flex; align-items: center; gap: 25px; font-size: 18px; }
  .hdr nav a { padding: 10px; color: var(--fg); text-decoration: none; white-space: nowrap; transition: color var(--fade); display: inline-flex; align-items: center; gap: 6px; }
  .hdr nav a.cur { font-weight: 500; }
  .hdr nav a.deal { font-weight: 500; color: var(--deal); }
  .hdr nav svg { width: 16px; height: 16px; }
  .hdr .halo { flex: 0 0 auto; padding: 6px; border-radius: 999px; background: var(--ringbg); box-shadow: inset 0 0 0 1px var(--ring); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); transition: background-color var(--fade), box-shadow var(--fade); }
  .hdr .halo a { display: inline-flex; align-items: center; gap: 7px; height: 50px; padding: 0 25px; border-radius: 90px; background: var(--pill); color: var(--pillfg); font: 500 20px "Fb Reforma", sans-serif; text-decoration: none; transition: background-color var(--fade), color var(--fade); }
  .hdr .halo svg { width: 16px; height: 16px; }
  @media (max-width: 1180px) { .hdr nav { display: none; } }
  @media (max-width: 620px) { .hdr .logo { width: 150px; height: 39px; } .hdr .halo a { height: 42px; padding: 0 18px; font-size: 17px; } }

  /* ---------- shared halo buttons: sky on dark sections, dark on white sections ---------- */
  /* global halo button, 1:1 with Figma "Button / halo" (לכל המבצעים): ring 6px, 8% sky fill, 12% white stroke, 12px background blur;
     pill 50 high, padding 25, gap 7, sky fill with two inner shadows, white 20px Medium label and a 10px white arrow */
  .btn-halo.btn-halo { display: inline-flex; padding: 6px; border-radius: 999px; text-decoration: none; background: rgba(125,198,255,.08); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  .btn-halo.btn-halo > span { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 50px; padding: 0 25px; border-radius: 90px; font: 500 20px/.915 "Fb Reforma", sans-serif; white-space: nowrap; color: #fff; transition: filter .25s ease; }
  .btn-halo.sky > span { background: #7dc6ff; box-shadow: inset 0 -8px 26.4px rgba(0,0,0,.25), inset 0 -4px 17.6px #fff; }
  .btn-halo.dark { background: rgba(18,22,31,.03); box-shadow: inset 0 0 0 1px rgba(18,22,31,.10); }
  .btn-halo.dark > span { background: #2b4d6a; box-shadow: inset 0 -4px 17.6px rgba(18,22,31,.25), inset 0 -8px 26.4px #12161f; }
  /* hover from the steel-blue hero: the inner glow follows the cursor inside the pill */
  .btn-halo > span, .s-hero .s-hero__halo-in { transition: --sx .35s ease-out, --sy .35s ease-out, --ga .35s ease-out, background-color .25s ease; }
  html body .btn-halo.sky > span, html body .s-hero .s-hero__halo--primary .s-hero__halo-in { box-shadow: inset var(--sx) calc(-4px + var(--sy)) 17.6px #fff, inset 0 -8px 26.4px rgba(0,0,0,.25); }
  html body .s-hero .s-hero__halo:not(.s-hero__halo--primary) .s-hero__halo-in { box-shadow: inset var(--sx) var(--sy) 14px rgba(97,177,242,calc(var(--ga) * .55)); }
  html body .s-duel .s-duel__halo-in { transition: --sx .35s ease-out, --sy .35s ease-out, --ga .35s ease-out; box-shadow: inset var(--sx) var(--sy) 14px rgba(125,198,255,calc(var(--ga) * .45)), inset 0 -4px 17.6px rgba(18,22,31,.25), inset 0 -8px 26.4px #12161f; }
  html body .btn-halo.dark > span { box-shadow: inset var(--sx) var(--sy) 14px rgba(125,198,255,calc(var(--ga) * .45)), inset 0 -4px 17.6px rgba(18,22,31,.25), inset 0 -8px 26.4px #12161f; }
  html body .s-hero .s-hero__halo:hover .s-hero__halo-in { background-color: transparent; }
  html body .s-hero .s-hero__halo--primary:hover .s-hero__halo-in { background-color: #7dc6ff; }
  .btn-halo, .s-duel .s-duel__halo { transition: transform .25s ease, border-color .25s ease; }
  .btn-halo:hover, .s-duel .s-duel__halo:hover { transform: translateY(-2px); }
  .btn-halo svg { width: 12px; height: 8px; flex: none; transition: transform .4s var(--ease); }
  .btn-halo:hover svg { transform: translateX(-4px); }

  /* ---------- bot button (from antartrade.co.il, no shadow): white on dark sections, navy on light ones, switches like the header ---------- */
  .bot-fab { position: fixed; right: 24px; bottom: 24px; z-index: 60; width: 46px; height: 58px; border: 0; padding: 0; cursor: pointer; background: #fff;
    -webkit-mask: url(img/icon-new-white.png) center / contain no-repeat; mask: url(img/icon-new-white.png) center / contain no-repeat;
    transition: background-color .55s cubic-bezier(.22,.61,.36,1), transform .3s ease; animation: bot-float 3s ease-in-out infinite; }
  .bot-fab.light { background: #12161f; }
  /* on phones the bot waits until the visitor starts scrolling, so the first screen stays clean */
  .bot-fab.away { opacity: 0; pointer-events: none; scale: .6; }
  .bot-fab { transition: background-color .55s cubic-bezier(.22,.61,.36,1), transform .3s ease, opacity .35s ease, scale .35s ease; }
  .bot-fab:hover { transform: scale(1.08); }
  @keyframes bot-float { 0%, 100% { translate: 0 0; } 50% { translate: 0 -6px; } }
  .bot-panel { position: fixed; right: 24px; bottom: 88px; z-index: 61; width: min(380px, calc(100vw - 32px)); border-radius: 24px; overflow: hidden; color: #12161f; background: #fff;
    box-shadow: 0 0 0 1px rgba(18,22,31,.08), 0 30px 60px -20px rgba(18,22,31,.35); opacity: 0; translate: 0 12px; pointer-events: none; transition: opacity .3s, translate .35s cubic-bezier(.22,.61,.36,1); }
  .bot-panel.open { opacity: 1; translate: 0 0; pointer-events: auto; }
  .bot-panel header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; background: #12161f; color: #fff; font: 500 16px "Fb Reforma", sans-serif; }
  .bot-panel header button { background: none; border: 0; color: #fff; cursor: pointer; width: 28px; height: 28px; }
  .bot-panel .msgs { padding: 18px; display: grid; gap: 10px; max-height: 320px; overflow: auto; }
  .bot-panel .m { padding: 10px 14px; border-radius: 16px; font: 400 15px/1.45 "Fb Reforma", sans-serif; max-width: 85%; }
  .bot-panel .m.bot { background: #f2f6fb; justify-self: start; }
  .bot-panel .m.me { background: #7dc6ff; color: #12161f; justify-self: end; font-family: "IBM Plex Sans Hebrew", sans-serif; }
  .bot-panel .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 18px 12px; }
  .bot-panel .chips button { border: 1px solid #dcebf7; background: #fff; border-radius: 999px; padding: 7px 12px; font: 400 14px "Fb Reforma", sans-serif; cursor: pointer; }
  .bot-panel form { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid #eef2f6; }
  .bot-panel input { flex: 1; border: 1px solid #dcebf7; border-radius: 12px; padding: 10px 12px; font: 400 15px "IBM Plex Sans Hebrew", sans-serif; outline: none; }
  .bot-panel input:focus { border-color: #7dc6ff; }
  .bot-panel form button { border: 0; border-radius: 12px; background: #12161f; color: #fff; padding: 0 16px; font: 500 15px "Fb Reforma", sans-serif; cursor: pointer; }

  /* ---------- global typography: small RT = card descriptions (Reforma Regular 16) ---------- */
  :root { --small-rt: 400 16px/1.35 "Fb Reforma", sans-serif; --tag: 500 16px/1.2 "Fb Reforma", sans-serif; --btn-card: 500 16px/1.2 "Fb Reforma", sans-serif; }
  html body .small-rt.small-rt { font: var(--small-rt); }

  /* ---------- global tag size: every tag, pill and badge outside the tables is 16px ---------- */
  html body .s-duel .s-duel__pill, html body .s-duel .s-duel__side, html body .s-duel .s-duel__badge,
  html body .s-deals .eyebrow, html body .s-deals .hot,
  html body .s-academy .pill, html body .s-academy .tag, html body .s-academy .dur,
  html body .s-platforms .pill, html body .s-platforms .card .deal span,
  html body .s-about .pill, html body .s-next .pill, html body .s-community .pill { font: var(--tag); }
  /* card buttons ("לפרטים", "לפרטי המבצע") use the global card button type */
  html body .s-platforms .btn-more, html body .s-deals .btn-gray { font: var(--btn-card); padding: 10px 18px; }
  html body .s-duel .s-duel__badge svg { width: 16px; height: 16px; }

  /* ---------- one title gradient for the whole site, the same as the hero headline: #61B1F2 on the left to white at 78% ---------- */
  .g-title.g-title, .g-title.g-title * { background: linear-gradient(90deg, #61B1F2 0%, #fff 78.365%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
  .g-title.g-title * { background: none; -webkit-text-fill-color: inherit; }
  .g-title.g-title { width: fit-content; max-width: 100%; }
  .g-title.g-center { margin-inline: auto; }

  /* ---------- light motion (inspired by React Bits: fade-in on scroll, word-by-word title, magnet buttons) ---------- */
  /* scroll-linked motion (Enigma style): containers rise through --ry so their own hover transforms keep working */
  .rise { translate: 0 var(--ry, 0); }
  .split .word { display: inline-block; }
</style>
<!--PART-STYLES-->

<body>
<!--PARTS-->
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
<script>
(function () {
  { const mh = new URLSearchParams(location.search).get('mh'); if (mh) document.documentElement.classList.add('mh-' + mh); }
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches || /[?&]static/.test(location.search);   // ?static = no motion (used for review captures)

  // ---------- scroll-linked motion, after Enigma (GSAP ScrollTrigger + SplitText, scrubbed to the scroll) ----------
  const G = window.gsap && window.ScrollTrigger && !reduce;
  if (G) {
    gsap.registerPlugin(ScrollTrigger, window.SplitText ? SplitText : undefined);
    const isGrad = el => [el, ...el.querySelectorAll('*')].some(n => { const c = getComputedStyle(n); return (c.webkitBackgroundClip || c.backgroundClip) === 'text'; });
    const skip = el => el.closest('.s-hero, .s-logos, .s-about');   // hero and logos are visible on arrival; "נעים להכיר" has its own scroll
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
      // titles (option B, linear with the scroll): every word rises out of its own mask line.
      // Gradient titles keep one continuous gradient: each word carries a slice of it, sized to the whole title.
      // titles: no animation, they show at once so a visitor sees what each section is before scrolling (Noam, 2026-10-20)
      // containers: rise from 5em below while going from blurred to sharp, one after another
      // containers rise in only at a few moments (Noam: not in every section) - the academy cards and the closing next-step cards;
      // the journal panel has its own rise (data-scroll-rise)
      const groups = [
        ['.s-academy .grid', '.s-academy .card'],
        ['.s-next__cards', '.s-next__card'],
      ];
      groups.forEach(([wrap, items, start = 'top 90%', end = 'top 35%']) => {
        const w = document.querySelector(wrap), els = [...document.querySelectorAll(items)];
        if (!w || !els.length) return;
        els.forEach(el => el.classList.add('rise'));
        gsap.fromTo(els, { '--ry': '2.5em', filter: 'blur(2px)', opacity: .6 }, { '--ry': '0em', filter: 'blur(0px)', opacity: 1, stagger: .1, ease: 'none',
          scrollTrigger: { trigger: w, start, end, scrub: 1 }, onComplete: () => els.forEach(el => el.style.filter = '') });
      });
      ScrollTrigger.refresh();
    });
  }
  // anything still marked for the old one-shot reveal simply shows
  document.querySelectorAll('[data-reveal]').forEach(el => el.classList.add('in'));

  // header takes the colour of the section under it
  const hdr = document.getElementById('hdr');
  const sections = [...document.querySelectorAll('[data-theme]')].filter(s => s !== hdr);
  let last = '';
  function header() {
    const y = scrollY, probe = hdr.offsetHeight / 2;
    const under = sections.find(s => { const b = s.getBoundingClientRect(); return b.top <= probe && b.bottom > probe; }) || sections[0];
    const theme = under ? under.dataset.theme : 'dark', state = (y > 8 ? 'on ' : '') + theme;
    if (state !== last) { hdr.classList.toggle('on', y > 8); hdr.classList.toggle('dark', theme === 'dark'); hdr.classList.toggle('light', theme === 'light'); last = state; }
  }


  let frame = function () { header(); };
  if (window.Lenis && !reduce) { const lenis = new Lenis({ lerp: 0.08 }); window.__lenis = lenis; lenis.on('scroll', () => { frame(); if (window.ScrollTrigger) ScrollTrigger.update(); }); (function raf(t) { lenis.raf(t); requestAnimationFrame(raf); })(performance.now()); }
  else addEventListener('scroll', () => frame(), { passive: true });
  addEventListener('resize', () => frame()); frame();



  // ---------- 3D rings from the Figma page: placed by section, they turn a little and play with blur while scrolling ----------
  // [image, anchor, centre x on the 1728 frame, centre y from the anchor top, w, h, base rotation, base blur]
  const RINGS = [
    // Noam's brain mark and a big WhatsApp mark replace the rings (Figma, 2026-10-20); size, rotation and blur are the Figma values
    ['bg-brain-light.svg', '.s-duel__head', 1679, 193, 375, 468, 8, 21],
    ['bg-brain-light.svg', '.s-duel__head', 90, 745, 261, 325, -13, 25.6],
    ['bg-brain-dark.svg', '.s-academy', 1725, 396, 394, 491, 32, 13.6],
    ['bg-brain-dark.svg', '.s-academy', 49, 1138, 266, 331, -18, 24],
    ['bg-wa.svg', '.s-community .banner', 225, 62, 392, 400, 0, 7.8],
  ];
  const layer = document.createElement('div');
  layer.className = 'rings'; layer.setAttribute('aria-hidden', 'true');
  layer.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:0;z-index:0;pointer-events:none;overflow-x:clip';   // behind: first in the page at level 0, so every positioned container paints over the rings   // rings hang off the edge without a side scroll
  document.body.prepend(layer);
  // the community ring hangs above its banner into the section before it, so it gets its own layer one level up
  // (over the previous section, which otherwise cut its top while scrolling) and the community content is lifted above it
  const upper = layer.cloneNode(); upper.style.zIndex = '3'; document.body.prepend(upper);   // the journal section above sits at level 2
  const cw = document.querySelector('.s-community .wrap'); if (cw) { cw.style.position = 'relative'; cw.style.zIndex = '4'; }
  const rings = RINGS.map(([src, a, cx, cy, w, h, rot, blur]) => {
    const el = document.createElement('img'); el.src = 'img/' + src; el.alt = '';
    el.style.cssText = `position:absolute;width:${w}px;height:${h}px;object-fit:contain;will-change:transform,filter`;
    (src === 'bg-wa.svg' ? upper : layer).appendChild(el); return { el, src, a: document.querySelector(a), cx, cy, w, h, rot, blur, y: 0 };
  }).filter(r => r.a);
  function placeRings() {
    const vw = document.documentElement.clientWidth, off = Math.max(0, (vw - 1728) / 2), k = vw < 760 ? .42 : 1;   // phones get the same rings, smaller
    rings.forEach(r => {
      // rings on the right half stick to the right edge, the rest to the left edge
      const kk = k < 1 && r.src === 'bg-wa.svg' ? .72 : k;   // phones: the WhatsApp mark stays big and on screen
      const w = r.w * kk, h = r.h * kk, out = k < 1 && r.src !== 'bg-wa.svg' ? w * .3 : 0;   // on phones they hang further off the edge, clear of the text
      const x = r.cx > 864 ? vw - off - (1728 - r.cx) * kk + out : off + r.cx * kk - out;
      r.y = r.a.getBoundingClientRect().top + scrollY + r.cy * k; r.k = k;
      r.el.style.width = w + 'px'; r.el.style.height = h + 'px';
      r.el.style.left = (x - w / 2) + 'px'; r.el.style.top = (r.y - h / 2) + 'px';
    });
  }
  function spinRings() {
    rings.forEach(r => {
      const p = Math.max(-1, Math.min(1, (r.y - scrollY - innerHeight / 2) / innerHeight));
      r.el.style.transform = `translateY(${(p * 45 * r.k).toFixed(1)}px) rotate(${(r.rot - p * 10).toFixed(2)}deg) scale(${(1 - Math.abs(p) * .03).toFixed(3)})`;
      r.el.style.filter = `blur(${(r.blur * .5 * r.k * (.85 + Math.abs(p) * .25)).toFixed(2)}px)`;   // Figma's layer blur reads about twice a css blur
    });
  }

  // ---------- "נעים להכיר": the text rises in from below, then lifts away with a blur after passing the middle of the screen ----------
  const aboutText = document.querySelector('[data-scroll-text]');
  function aboutScroll() {
    if (!aboutText) return;
    const b = aboutText.getBoundingClientRect(), p = (b.top + b.height / 2 - innerHeight / 2) / innerHeight;
    let y, o, bl;
    if (innerWidth <= 760) {
      // phones: timed by where the block's top sits without its own lift (taken from the photo, which never moves):
      // it rises in while that top comes up from 95% to 62% of the screen, so the motion happens in view,
      // and goes out only once the block's bottom (the button) passes 30% from the top
      const ph = document.querySelector('.s-about .portrait');
      const top0 = ph ? ph.getBoundingClientRect().top + (aboutText.offsetTop - ph.offsetTop) : b.top;
      // once in place, scrolling on lifts it slowly and blurs it: from when its top passes 45% of the screen, over most of a screen height
      const enter = Math.min(1, Math.max(0, (top0 / innerHeight - .62) / .33)), lift = Math.min(1, Math.max(0, (.45 - top0 / innerHeight) / .8));
      if (enter > 0) { y = enter * 110; o = 1 - enter * .9; bl = enter * 3; }
      else if (lift > 0) { const late = Math.max(0, lift - .6) / .4; y = -lift * 70; o = 1 - late * .7; bl = late * 7; }   // blur and fade only in the last stretch, as it goes
      else { y = 0; o = 1; bl = 0; }
    } else { y = p > 0 ? p * 90 : p * 50; o = p > 0 ? 1 - p * 1.6 : 1 + p * 1.4; bl = p > 0 ? p * 3 : -p * 6; }
    // at rest nothing is left on the block: on iPhone a filter or opacity on it (even blur(0)) delays painting the button's backdrop blur,
    // so phones get no blur at all and every style is cleared once the block is in place
    const op = Math.max(0, Math.min(1, o));
    aboutText.style.transform = Math.abs(y) < .5 ? '' : `translateY(${y.toFixed(1)}px)`;
    aboutText.style.opacity = op > .995 ? '' : op.toFixed(3);
    aboutText.style.filter = bl > .05 && (innerWidth > 760 || y < 0) ? `blur(${bl.toFixed(2)}px)` : '';   // phones blur only on the way out
    aboutText.classList.add('in');
  }

    // desktop: over the text or the button, or close to them, the trail turns faint so it never gets in the way of reading
    const nearText = (cx, cy) => { const tr = aboutText ? aboutText.getBoundingClientRect() : null; if (!tr) return 1;
      const dx = Math.max(tr.left - cx, 0, cx - tr.right), dy = Math.max(tr.top - cy, 0, cy - tr.bottom), d = Math.hypot(dx, dy);

    const LIFE = fine ? 1800 : 20000;   // touch: a long tail, two thirds of the loop
    // touch: an invisible point drifts on a slow random path (mixed sine waves with random phases), painting while the section is on screen
    // touch: the point traces one large, slow infinity sign (∞) across the section behind noam, a full loop every 30s, so the motion is calm and never jumps
    let lastPush = 0; const t0 = performance.now() - Math.random() * 30000;
    // iPhone Safari ignores the canvas blur filter, so on touch the whole canvas is blurred with css instead (heavy, like the Figma lines),
    // and the strokes skip noam's figure so they never show through the clear parts of the cut-out photo
    const photo = about.querySelector('.portrait');
    if (!fine) cv.style.filter = 'blur(30px)';   // enough to soften, light enough that the strokes still read as lines
    (function draw() {
      const now = performance.now(); pts = pts.filter(p => now - p.t < LIFE);

        const a = (now - t0) / 30000 * 6.2832;

      }

      ctx.clearRect(0, 0, cv.width, cv.height);

        ctx.save();

        }

          ctx.globalCompositeOperation = 'destination-out'; ctx.drawImage(photo, (r.left - ar.left) * K, (r.top - ar.top) * K, r.width * K, r.height * K); ctx.globalCompositeOperation = 'source-over'; }
      }

  }

  document.querySelectorAll('a[href="#"], a:not([href]):not([data-pair])').forEach(a => {

    + '<div class="msgs"><div class="m bot">היי! אני כאן כדי לעזור לבחור חברת מימון, להבין חוקים ולמצוא מבצעים. מה תרצו לדעת?</div></div>'

  // weight balance, as set in Figma, everywhere (also in the bot): Latin inside Hebrew is set in Roboto at the weight of the Hebrew around it (Regular stays Regular, Medium stays Medium); only SemiBold and bolder Hebrew drops one step
  (function balanceLatin() {
    const HEB = /[֐-׿]/, LAT = /[A-Za-z0-9$%][A-Za-z0-9$%.,:\/\-]*(?:\s+[A-Za-z0-9$%][A-Za-z0-9$%.,:\/\-]*)*/g;
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT), todo = [];
    while (walker.nextNode()) {
      const n = walker.currentNode, el = n.parentElement;
      if (!el || el.closest('script,style,svg,.lat,.pct,.price,.name,.code,.vs,.chip,.n,.dur,[dir=ltr]')) continue;
      const block = el.closest('h1,h2,h3,p,span,button,a,div,small,b,bdi') || el;
      if (!HEB.test(block.textContent) || !/[A-Za-z0-9]/.test(n.nodeValue)) continue;
      const w = parseInt(getComputedStyle(el).fontWeight, 10);
      todo.push([n, w]);
    }
    todo.forEach(([n, w]) => {
      const frag = document.createDocumentFragment(); let lastI = 0, m; const t = n.nodeValue; LAT.lastIndex = 0;
      while ((m = LAT.exec(t))) { if (m.index > lastI) frag.appendChild(document.createTextNode(t.slice(lastI, m.index))); const sp = document.createElement('span'); sp.className = 'lat'; sp.style.fontFamily = '"Roboto", sans-serif'; sp.style.fontWeight = w >= 600 ? w - 100 : w; sp.textContent = m[0]; frag.appendChild(sp); lastI = m.index + m[0].length; }
      if (lastI < t.length) frag.appendChild(document.createTextNode(t.slice(lastI)));
      n.replaceWith(frag);
    });
  })();

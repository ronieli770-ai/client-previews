<!doctype html>
<html lang="he" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AntarTrade wide screen</title>
<style>
  body { margin: 0; background: #0b0e14; color: #fff; font: 500 15px system-ui, sans-serif; }
  .bar { position: sticky; top: 0; z-index: 2; display: flex; gap: 8px; justify-content: center; align-items: center; padding: 12px; background: #0b0e14; flex-wrap: wrap; }
  .bar button { border: 1px solid rgba(255,255,255,.2); background: transparent; color: #fff; border-radius: 999px; padding: 8px 16px; font: inherit; cursor: pointer; }
  .bar button.on { background: #7dc6ff; color: #12161f; border-color: #7dc6ff; }
  .bar small { opacity: .6; font-weight: 400; }
  img { display: block; width: min(100%, 1600px); margin: 0 auto 40px; }
</style></head><body>
<div class="bar"><span>כל דף הבית ברוחב:</span>
  <button data-s="wide-shots/full-2560.jpg" class="on">2560</button><button data-s="wide-shots/full-1920.jpg">1920</button>
  <small>צילום של כל הדף, מוקטן לרוחב החלון</small></div>
<img id="shot" src="wide-shots/full-2560.jpg" alt="דף הבית במסך רחב">
<script>
  document.querySelectorAll('.bar button').forEach(b => b.onclick = () => { document.querySelectorAll('.bar button').forEach(x => x.classList.toggle('on', x === b)); document.getElementById('shot').src = b.dataset.s; });
</script>
</body></html>

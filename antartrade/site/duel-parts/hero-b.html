<style>
/* B: an arena. The two firms' 3D logos stand under spotlights on the grid floor and charge at each other; a spark where they meet */
.hb { padding-top:140px; }
.hb .beam { position:absolute; top:-40px; width:520px; height:760px; pointer-events:none; background:linear-gradient(rgba(125,198,255,.22), rgba(125,198,255,0) 80%); clip-path:polygon(44% 0, 56% 0, 100% 100%, 0 100%); filter:blur(14px); opacity:0; animation:hbBeam 1.4s ease-out .2s forwards; }
.hb .beam.r { right:calc(50% - 620px); } .hb .beam.l { left:calc(50% - 620px); }
@keyframes hbBeam { to { opacity:1; } }
.hb .stage { position:relative; height:360px; margin-bottom:24px; z-index:1; }
.hb .logo3d { position:absolute; top:10px; width:300px; filter:drop-shadow(0 40px 50px rgba(0,0,0,.5)); }
.hb .logo3d img { width:100%; display:block; }
.hb .logo3d.r { right:calc(50% - 470px); } .hb .logo3d.l { left:calc(50% - 470px); }
.hb .logo3d.r img { animation:hbR 1.3s cubic-bezier(.2,.9,.25,1) both, hbFloat 6s ease-in-out 1.4s infinite; }
.hb .logo3d.l img { animation:hbL 1.3s cubic-bezier(.2,.9,.25,1) .06s both, hbFloat 6s ease-in-out 1.8s infinite reverse; }
@keyframes hbR { 0% { transform:translateX(60%) scale(.7); opacity:0; } 50% { transform:translateX(-40%) scale(1.05); opacity:1; } 100% { transform:none; } }
@keyframes hbL { 0% { transform:translateX(-60%) scale(.7); opacity:0; } 50% { transform:translateX(40%) scale(1.05); opacity:1; } 100% { transform:none; } }
@keyframes hbFloat { 50% { transform:translateY(-12px); } }
.hb .shadow { position:absolute; bottom:6px; width:240px; height:30px; border-radius:50%; background:radial-gradient(closest-side, rgba(0,0,0,.55), transparent); }
.hb .shadow.r { right:calc(50% - 440px); } .hb .shadow.l { left:calc(50% - 440px); }
.hb .spark { position:absolute; left:50%; top:120px; translate:-50% 0; width:110px; height:110px; display:grid; place-items:center; }
.hb .spark::before { content:""; position:absolute; inset:-60px; border-radius:50%; background:radial-gradient(closest-side, rgba(214,236,255,.9), rgba(125,198,255,.35) 40%, transparent); opacity:0; animation:hbSpark 1.1s ease-out .6s both; }
.hb .spark b { position:relative; z-index:2; font:700 54px "Roboto"; color:#fff; letter-spacing:.02em; text-shadow:0 0 30px rgba(125,198,255,.9); opacity:0; animation:hbVs .5s ease-out .75s both; }
@keyframes hbSpark { 0% { opacity:0; scale:.2; } 30% { opacity:1; scale:1.15; } 100% { opacity:.3; scale:1; } }
@keyframes hbVs { from { opacity:0; scale:1.6; } to { opacity:1; scale:1; } }
.hb .tag { position:absolute; bottom:-6px; font:700 18px "Roboto"; color:rgba(255,255,255,.7); }
.hb .tag.r { right:calc(50% - 400px); } .hb .tag.l { left:calc(50% - 410px); }
@media (max-width:760px) {
  .hb { padding-top:110px; } .hb .stage { height:190px; }
  .hb .logo3d { width:150px; } .hb .logo3d.r { right:calc(50% - 175px); } .hb .logo3d.l { left:calc(50% - 175px); }
  .hb .shadow { width:130px; } .hb .shadow.r { right:calc(50% - 165px); } .hb .shadow.l { left:calc(50% - 165px); }
  .hb .spark { top:50px; } .hb .spark b { font-size:34px; } .hb .tag { display:none; }
  .hb .beam { width:260px; height:420px; } .hb .beam.r { right:calc(50% - 200px); } .hb .beam.l { left:calc(50% - 200px); }
}
@media (prefers-reduced-motion:reduce) { .hb * { animation:none !important; opacity:1 !important; } }
</style>
<section class="dq-hero hb" data-theme="dark"><div class="floor"></div><span class="beam r"></span><span class="beam l"></span><div class="w">
  <div class="stage">
    <span class="shadow r"></span><span class="shadow l"></span>
    <span class="logo3d r"><img src="img/firm3d-takeprofit.webp" alt="Take Profit"></span>
    <span class="logo3d l"><img src="img/firm3d-lucid.webp" alt="Lucid Trading"></span>
    <span class="spark"><b>VS</b></span>
    <span class="tag r">Take Profit</span><span class="tag l">Lucid Trading</span>
  </div>
  <div class="head">
    <h1 class="grad">דו קרב חברות מימון</h1>
    <p class="lead">בחרו שתי חברות ומסלול לכל צד והשוו ביניהן נתון מול נתון.</p>
  </div>
  <!--CHIPS-->
  <!--FIGHTERS-->
</div></section>

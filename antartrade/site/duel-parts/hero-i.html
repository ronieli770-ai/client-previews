<style>
/* I: the two picker cards fly in from the sides and collide in the middle; a shock ring runs out of the VS and the floor grid shudders. Every new pairing knocks them together again */
.hi { padding-top:140px; }
.hi h1 { font-size:56px; }
.hi .dq-chips { margin-top:20px; }
.hi .dq-ring { margin-top:44px; }
.hi .dq-vs { z-index:3; }
.hi .dq-vs::before { display:none; }
.hi .dq-f[data-side="0"] { animation:hiA 1s cubic-bezier(.3,.7,.3,1) both; }
.hi .dq-f[data-side="1"] { animation:hiB 1s cubic-bezier(.3,.7,.3,1) both; }
@keyframes hiA { 0% { transform:translateX(70%) rotate(4deg); opacity:0; } 45% { transform:translateX(-46px) rotate(-1.5deg); opacity:1; } 62% { transform:translateX(10px); } 100% { transform:none; } }
@keyframes hiB { 0% { transform:translateX(-70%) rotate(-4deg); opacity:0; } 45% { transform:translateX(46px) rotate(1.5deg); opacity:1; } 62% { transform:translateX(-10px); } 100% { transform:none; } }
.hi .dq-vs i { animation:hiVs .5s cubic-bezier(.2,.9,.25,1.5) .45s both; }
@keyframes hiVs { from { scale:2.2; opacity:0; } to { scale:1; opacity:1; } }
.hi .ring { position:absolute; left:50%; top:50%; width:120px; height:120px; translate:-50% -50%; border-radius:50%; pointer-events:none; border:2px solid rgba(125,198,255,.85); box-shadow:0 0 30px rgba(125,198,255,.6), inset 0 0 30px rgba(125,198,255,.4); opacity:0; }
.hi .ring.a { animation:hiRing 1.1s ease-out .45s both; } .hi .ring.b { animation:hiRing 1.3s ease-out .55s both; }
@keyframes hiRing { 0% { opacity:1; scale:.3; } 100% { opacity:0; scale:7; } }
.hi .floor { animation:hiShake .5s ease-out .45s both; }
@keyframes hiShake { 0%, 100% { translate:0 0; } 20% { translate:0 6px; } 45% { translate:0 -4px; } 70% { translate:0 2px; } }
@media (max-width:979px) {
  @keyframes hiA { 0% { transform:translateY(-40%); opacity:0; } 45% { transform:translateY(24px); opacity:1; } 100% { transform:none; } }
  @keyframes hiB { 0% { transform:translateY(40%); opacity:0; } 45% { transform:translateY(-24px); opacity:1; } 100% { transform:none; } }
}
@media (max-width:760px) { .hi { padding-top:110px; } .hi h1 { font-size:40px; } }
@media (prefers-reduced-motion:reduce) { .hi .dq-f, .hi .dq-vs i, .hi .ring, .hi .floor { animation:none !important; } }
</style>
<section class="dq-hero hi" data-theme="dark"><div class="floor"></div><div class="w">
  <div class="head">
    <h1 class="grad">דו קרב חברות מימון</h1>
    <p class="lead">בחרו שתי חברות ומסלול לכל צד והשוו ביניהן נתון מול נתון.</p>
  </div>
  <!--CHIPS-->
  <!--FIGHTERS-->
</div></section>
<script>
addEventListener('DOMContentLoaded', () => {
  const vs = document.querySelector('.hi .dq-vs'); if (!vs) return;
  vs.insertAdjacentHTML('afterbegin', '<span class="ring a"></span><span class="ring b"></span>');
  const hit = () => document.querySelectorAll('.hi .dq-f, .hi .dq-vs i, .hi .ring, .hi .floor').forEach(el => { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; });
  document.querySelector('.hi').addEventListener('click', e => { if (e.target.closest('.dq-chip, .sizes button, .swap')) hit(); });
});
</script>

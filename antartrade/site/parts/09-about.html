<style>
.s-about{position:relative;overflow:hidden;background:#12161F;color:#fff;font-family:"Fb Reforma",sans-serif;direction:rtl}
.s-about *{box-sizing:border-box}
.s-about .en{font-family:"Roboto",sans-serif;font-weight:400;font-variation-settings:"wdth" 100}
.s-about .wrap{position:relative;width:min(1171px,calc(100% - 48px));margin-inline:auto;min-height:934px;padding:300px 0 204px}

/* text - Frame 33 (268:2161), left side of the grid */
.s-about .text{position:relative;z-index:2;width:min(433px,100%);margin-right:auto;margin-left:0;display:flex;flex-direction:column;align-items:flex-start;gap:20px}
.s-about .pill{display:inline-flex;padding:6px 14px;border-radius:999px;background:rgba(97,177,242,.14);color:#7DC6FF;font-weight:500;font-size:13px;line-height:1.2;white-space:nowrap}
.s-about h2{margin:0;font-weight:500;font-size:45px;line-height:43px;text-align:right;white-space:nowrap;
  background:linear-gradient(to right,#61B1F2 0%,#fff 78.365%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.s-about .copy{margin:0;font-weight:400;font-size:20px;line-height:1.2;color:rgba(255,255,255,.7);text-align:right}

/* primary sky halo button */
.s-about .halo{display:inline-flex;padding:6px;border-radius:999px;background:rgba(125,198,255,.08);border:1px solid rgba(255,255,255,.12);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);text-decoration:none}
.s-about .halo-in{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:50px;padding:0 25px;border-radius:90px;background:#7DC6FF;color:#fff;font-weight:500;font-size:20px;line-height:1;white-space:nowrap;
  box-shadow:inset 0 -4px 17.6px 0 #fff,inset 0 -8px 26.4px 0 rgba(0,0,0,.25);transition:filter .25s ease}
.s-about .halo:hover .halo-in{filter:brightness(1.06)}
.s-about .halo-in svg{width:11px;height:8px;display:block}

/* portrait (305:633), right side, bottom fades into navy */
.s-about .portrait{position:absolute;z-index:1;top:7px;right:-3.672%;width:60.547%;max-width:709px;height:auto;display:block;pointer-events:none}

@media (max-width:1180px){
  .s-about .wrap{padding-top:clamp(200px,25.6vw,300px)}
}
@media (max-width:980px){
  .s-about .wrap{min-height:0;padding:96px 0 0;display:flex;flex-direction:column}
  .s-about .text{width:100%;max-width:560px;margin-inline:auto}
  .s-about h2{font-size:40px;line-height:40px}
  .s-about .portrait{position:relative;top:auto;right:auto;width:min(560px,100%);margin:40px auto -12%}
}
@media (max-width:620px){
  .s-about .wrap{width:calc(100% - 32px);padding-top:72px}
  .s-about h2{font-size:34px;line-height:36px;white-space:normal}
  .s-about .copy{font-size:18px}
  .s-about .halo-in{font-size:18px;padding:0 22px}
  .s-about .portrait{margin-top:32px}
}

/* text sizes as now set in Figma (frame 268:2161): 20px gaps, title 45/43, copy 28/1.2 at 70% white, first line Medium */
.s-about .text { gap: 20px; }
.s-about .text h2 { font-size: 45px; line-height: 43px; margin: 0; }
.s-about .copy { margin: 0; color: rgba(255,255,255,.7); font-size: 28px; line-height: 1.2; text-align: right; }
.s-about .copy p { margin: 0; font-weight: 400; }
.s-about .copy p.lead { font-weight: 500; }
.s-about .copy .en { font-family: "Roboto", sans-serif; font-weight: 500; }
@media (max-width: 980px) { .s-about .copy { font-size: 22px; } .s-about .text h2 { font-size: 38px; line-height: 1.1; } }
@media (max-width: 620px) { .s-about .copy { font-size: 18px; } .s-about .text h2 { font-size: 32px; } }

/* the background lines now come from the cursor only; a soft fade at the bottom melts into the next section */
.s-about::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 260px; background: linear-gradient(rgba(18,22,31,0), #12161f 85%); pointer-events: none; z-index: 3; }
</style>
<section class="s-about" id="about" data-theme="dark">
  <div class="wrap">
    <div class="text" data-scroll-text>
      <span class="pill">קצת עליי</span>
      <h2 class="split g-title">נעים להכיר,<br>אני נועם ענתר</h2>
      <div class="copy"><p class="lead">סוחר חוזים עתידיים ומייסד <span class="en" lang="en" dir="ltr">AntarTrade</span>.</p><p>בניתי כאן מקום אחד שמרכז את החוקים, המחירים והכלים של חברות המימון - בצורה עניינית ומעודכנת, כדי שתוכלו לבחור ולהתקדם בלי לנחש.</p></div>
      <a class="btn-halo sky" href="#"><span>עוד עליי<svg viewBox="0 0 12 8" fill="none" aria-hidden="true"><path d="M11 4H1M4 1L1 4L4 7" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>
    </div>
    <img class="portrait" src="img/noam.png" alt="נועם ענתר" width="709" height="1060">
  </div>
</section>

<style>
.s-community{position:relative;background:#fff;color:#12161F;font-family:"Fb Reforma",sans-serif;direction:rtl;padding:200px 0 140px;overflow:hidden}
/* the soft sky circle on the right edge (Figma Ellipse 8): inside the section, so it never spills into the next one */
.s-community::before{content:"";position:absolute;z-index:0;right:-260px;bottom:110px;width:520px;height:520px;background:url("img/bg-glow.svg") center/contain no-repeat;filter:blur(48px);pointer-events:none}
.s-community *{box-sizing:border-box}
.s-community .wrap{width:min(1171px,calc(100% - 48px));margin-inline:auto}
.s-community .en{font-family:"Roboto",sans-serif;font-weight:500;font-variation-settings:"wdth" 100}

/* banner - Rectangle 74 (268:1890) + Frame 32 (268:2073) */
.s-community .banner{background:#12161F;border-radius:172px;min-height:128px;padding:32px 72px;display:flex;align-items:center;justify-content:space-between;gap:32px;
  box-shadow:0 362px 101px 0 rgba(18,22,31,0),0 232px 93px 0 rgba(18,22,31,.01),0 130px 78px 0 rgba(18,22,31,.05),0 58px 58px 0 rgba(18,22,31,.09),0 14px 32px 0 rgba(18,22,31,.1)}
.s-community .banner-text{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.s-community h2{margin:0;font-weight:500;font-size:28px;line-height:1.2;color:#fff;text-align:right}
.s-community .sub{margin:0;font-weight:400;font-size:20px;line-height:1.2;color:rgba(255,255,255,.7);text-align:right}

/* primary sky halo button (sits on the dark banner) */
.s-community .halo{flex-shrink:0;display:inline-flex;padding:6px;border-radius:999px;background:rgba(125,198,255,.08);border:1px solid rgba(255,255,255,.12);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);text-decoration:none}
.s-community .halo-in{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:50px;padding:0 25px;border-radius:90px;background:#7DC6FF;color:#fff;font-weight:500;font-size:20px;line-height:1;white-space:nowrap;
  box-shadow:inset 0 -4px 17.6px 0 #fff,inset 0 -8px 26.4px 0 rgba(0,0,0,.25);transition:filter .25s ease}
.s-community .halo:hover .halo-in{filter:brightness(1.06)}
.s-community .halo-in img{width:16.9186px;height:17px;display:block}

/* benefit cards - 268:2081 / 268:2078 / 268:2034 */
.s-community .cards{margin-top:133px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.s-community .item{position:relative}
.s-community .icon{position:absolute;top:-31.5px;left:50%;transform:translateX(-50%);width:63px;height:63px;z-index:2;display:block}
.s-community .card{position:relative;height:100%;min-height:193px;border-radius:32px;padding:56px 36px 39px;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:
    radial-gradient(55% 55% at 100% 0,rgba(214,236,255,.55) 0%,rgba(214,236,255,0) 100%),
    radial-gradient(70% 70% at 0 100%,rgba(97,177,242,.4) 0%,rgba(125,198,255,.15) 40%,rgba(214,236,255,0) 100%),
    #fff;
  box-shadow:0 24px 60px 0 rgba(85,169,235,.09)}
.s-community .card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(45deg,#2E8BD8 0%,#7DC6FF 50%,#D6ECFF 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.s-community .card p{margin:0;max-width:260px;font-weight:500;font-size:28px;line-height:1.2;text-align:center;color:#12161F}

@media (max-width:980px){
  .s-community{padding:64px 0 112px}
  .s-community .banner{flex-direction:column;justify-content:center;text-align:center;border-radius:40px;padding:40px 32px;gap:28px}
  .s-community .banner-text{align-items:center}
  .s-community h2,.s-community .sub{text-align:center}
  .s-community h2{font-size:26px}
  .s-community .sub{font-size:18px;margin-top:8px}
  .s-community .cards{margin-top:88px;grid-template-columns:1fr;gap:64px;max-width:480px;margin-inline:auto}
}
@media (max-width:760px){.s-community::before{width:300px;height:300px;right:-150px;top:auto;bottom:120px;filter:blur(30px)}}
@media (max-width:620px){
  .s-community{padding:48px 0 88px}
  .s-community .wrap{width:calc(100% - 32px)}
  .s-community .banner{border-radius:32px;padding:32px 20px}
  .s-community h2{font-size:24px}
  .s-community .sub{font-size:16px}
  .s-community .halo-in{font-size:18px;padding:0 22px}
  .s-community .card{min-height:160px;padding:52px 24px 32px}
  .s-community .card p{font-size:22px}
}
</style>
<section class="s-community" id="community" data-theme="light">
  <div class="wrap">
    <div class="banner" data-reveal>
      <div class="banner-text">
        <h2 class="split">הצטרפו לקהילת הסוחרים החינמית של <span class="en" lang="en" dir="ltr">AntarTrade</span></h2>
        <p class="sub">מקום אחד לסוחרים בחברות מימון - להתעדכן, לשאול ולהתייעץ.</p>
      </div>
      <a class="btn-halo sky" href="#"><span>הצטרפו לקהילה<img src="img/icon-whatsapp.svg" alt="" width="16.9186" height="17"></span></a>
    </div>

    <div class="cards" data-reveal>
      <div class="item">
        <img class="icon" src="img/community-icon-bell.svg" alt="" width="63" height="63">
        <div class="card"><p>עדכונים על מבצעים ושינויי חוקים בזמן אמת</p></div>
      </div>
      <div class="item">
        <img class="icon" src="img/community-icon-chat.svg" alt="" width="63" height="63">
        <div class="card"><p>שאלות ותשובות עם סוחרים אחרים</p></div>
      </div>
      <div class="item">
        <img class="icon" src="img/community-icon-book.svg" alt="" width="63" height="63">
        <div class="card"><p>תכנים ומדריכים חדשים מהאתר</p></div>
      </div>
    </div>
  </div>
</section>

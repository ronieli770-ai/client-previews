<style>
.s-duel{--navy:#12161F;--sky:#7DC6FF;--sky2:#61B1F2;--ice:#D6ECFF;--blue:#2E8BD8;--muted:rgba(18,22,31,.55);background:#fff;color:var(--navy);direction:rtl;padding:clamp(72px,9vw,120px) 16px;font-family:"Fb Reforma",sans-serif;overflow-x:clip}
.s-duel *,.s-duel *::before,.s-duel *::after{box-sizing:border-box}
.s-duel .lat{font-family:"Roboto",sans-serif}
.s-duel__wrap{max-width:1171px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:clamp(36px,4.5vw,50px)}

/* title */
.s-duel__head{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;width:100%}
.s-duel__pill{display:inline-flex;padding:6px 14px;border-radius:999px;background:rgba(97,177,242,.14);color:var(--blue);font-size:13px;font-weight:500;line-height:1.2}
.s-duel__title{margin:0;font-size:clamp(32px,4.2vw,45px);line-height:1.1;font-weight:500;color:var(--navy)}
.s-duel__sub{margin:0;font-size:clamp(17px,1.7vw,20px);line-height:1.2;font-weight:400;color:rgba(18,22,31,.7)}

/* content */
.s-duel__content{display:flex;flex-direction:column;align-items:center;gap:30px;width:100%}
.s-duel__chips{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px}
.s-duel__chips-label{font-size:14px;line-height:1.2;color:rgba(18,22,31,.6)}
.s-duel__chip{direction:ltr;display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:rgba(18,22,31,.04);border:1px solid rgba(18,22,31,.1);color:var(--navy);text-decoration:none;font-family:"Roboto",sans-serif;font-size:13px;font-weight:500;white-space:nowrap;transition:background .2s,border-color .2s}
.s-duel__chip b{color:var(--blue);font-size:12px;font-weight:700}
.s-duel__chip:hover{background:rgba(97,177,242,.1);border-color:rgba(46,139,216,.35)}

/* cards */
.s-duel__row{display:grid;grid-template-columns:minmax(0,1fr) 75px minmax(0,1fr);align-items:stretch;width:100%}
.s-duel__card{position:relative;display:flex;flex-direction:column;gap:20px;padding:32px 36px;border-radius:32px;border:2px solid transparent;
  background:
    radial-gradient(55% 55% at 100% 0,rgba(214,236,255,.55),rgba(214,236,255,0)) padding-box,
    radial-gradient(70% 70% at 0 100%,rgba(97,177,242,.4),rgba(125,198,255,.15) 40%,rgba(214,236,255,0)) padding-box,
    linear-gradient(#fff,#fff) padding-box,
    linear-gradient(225deg,#2E8BD8 0%,#7DC6FF 50%,#D6ECFF 100%) border-box;
  box-shadow:0 24px 60px rgba(85,169,235,.16)}
.s-duel__top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.s-duel__side{display:inline-flex;padding:5px 12px;border-radius:999px;background:rgba(97,177,242,.14);color:var(--blue);font-size:13px;font-weight:500;line-height:1.2}
.s-duel__swap{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:999px;border:1px solid rgba(18,22,31,.14);background:transparent;color:var(--navy);font-family:inherit;font-size:14px;font-weight:500;line-height:1.2;cursor:pointer;transition:background .2s}
.s-duel__swap:hover{background:rgba(18,22,31,.04)}
.s-duel__swap svg{width:16px;height:16px;flex:none}
.s-duel__co{display:flex;align-items:center;gap:14px}
.s-duel__co-name{font-family:"Roboto",sans-serif;font-weight:700;font-size:30px;line-height:1.17;direction:ltr}
.s-duel__logo{width:48px;height:48px;display:flex;align-items:center;justify-content:center;flex:none}
.s-duel__logo svg{width:36px;height:40px}
.s-duel__logo img{width:40px;height:40px;object-fit:contain}
.s-duel__route{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-radius:7px;background:#fff;border:1px solid #DCEAF7}
.s-duel__route-txt{display:flex;align-items:center;gap:10px;line-height:1.2}
.s-duel__lbl{font-size:13px;font-weight:500;color:var(--muted);line-height:1.2}
.s-duel__route-val{font-size:14px;color:var(--navy)}
.s-duel__route-val.lat{font-weight:500}
.s-duel__route svg{width:16px;height:16px;flex:none}
.s-duel__price{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.s-duel__size{display:flex;align-items:baseline;gap:4px;font-size:13px;color:var(--muted)}
.s-duel__size .t{font-weight:500;line-height:1.2}
.s-duel__size .lat{font-weight:400}
.s-duel__amt{display:flex;align-items:baseline;flex-wrap:wrap;gap:10px}
.s-duel__now{font-family:"Roboto",sans-serif;font-weight:700;font-size:40px;line-height:1.17;color:var(--navy);direction:ltr}
.s-duel__was{font-family:"Roboto",sans-serif;font-size:20px;color:rgba(18,22,31,.35);text-decoration:line-through;direction:ltr}
.s-duel__per{font-size:14px;line-height:1.2;color:var(--muted)}
.s-duel__hr{height:1px;background:#DCEAF7;border:0;margin:0}
.s-duel__data{display:flex;flex-direction:column;margin:0;padding:0}
.s-duel__dr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #EAF2FA}
.s-duel__dr:last-child{border-bottom:0}
.s-duel__dr dt{order:0}
.s-duel__dr dd{margin:0;font-size:20px;line-height:1.2;color:var(--navy);text-align:left}
.s-duel__dr dd .lat{font-weight:400}

.s-duel__vs-cell{position:relative;display:flex;align-items:center;justify-content:center}
.s-duel__vs{width:48px;height:48px;border-radius:999px;background:var(--navy);border:1.5px solid var(--sky2);box-shadow:0 8px 24px rgba(85,169,235,.3);display:flex;align-items:center;justify-content:center;color:#fff;font-family:"Roboto",sans-serif;font-weight:700;font-size:18px;position:relative;z-index:2}

/* halo button */
.s-duel__halo{display:inline-flex;padding:6px;border-radius:999px;background:rgba(85,169,235,.08);border:1px solid rgba(18,22,31,.1);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);text-decoration:none}
.s-duel__halo-in{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:50px;padding:0 25px;border-radius:90px;background:#2B4D6A;box-shadow:inset 0 -4px 17.6px rgba(18,22,31,.25),inset 0 -8px 26.4px #12161F;color:#fff;font-size:20px;font-weight:500;line-height:.915;white-space:nowrap;transition:filter .2s}

.s-duel__halo-in svg{width:12px;height:10px;flex:none}

@media (max-width:979px){
  .s-duel__row{grid-template-columns:minmax(0,1fr);max-width:560px;margin:0 auto}
  .s-duel__vs-cell{height:0}
  .s-duel__row > .s-duel__card:first-child{margin-bottom:12px}
  .s-duel__row > .s-duel__card:last-child{margin-top:12px}
}
@media (max-width:600px){
  .s-duel__card{padding:24px 20px;border-radius:24px;gap:16px}
  .s-duel__co-name{font-size:24px}
  .s-duel__now{font-size:34px}
  .s-duel__dr dd{font-size:17px}
  .s-duel__halo-in{font-size:18px}
}

/* plan dropdown */
.s-duel .s-duel__route{position:relative;cursor:pointer;transition:border-color .25s,box-shadow .25s;user-select:none}
.s-duel .s-duel__route:hover,.s-duel .s-duel__route.open{border-color:#7DC6FF;box-shadow:0 0 0 4px rgba(125,198,255,.18)}
.s-duel .s-duel__route > svg{transition:transform .3s}
.s-duel .s-duel__route.open > svg{transform:rotate(180deg)}
.s-duel .s-duel__menu{position:absolute;top:calc(100% + 8px);inset-inline:0;z-index:20;padding:6px;border-radius:14px;background:#fff;list-style:none;margin:0;
  box-shadow:0 0 0 1px #DCEAF7,0 24px 48px -12px rgba(18,22,31,.22);opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top;pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.22,.61,.36,1)}
.s-duel .open > .s-duel__menu{opacity:1;transform:none;pointer-events:auto}
.s-duel .s-duel__menu li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border-radius:9px;font-size:15px;cursor:pointer;transition:background .2s}
.s-duel .s-duel__menu li:hover{background:#F2F8FE}
.s-duel .s-duel__menu li.on{background:rgba(125,198,255,.16);font-weight:500}
.s-duel .s-duel__menu li small{font-family:"Roboto",sans-serif;font-size:13px;opacity:.6;direction:ltr}
.s-duel .s-duel__menu li img,.s-duel .s-duel__menu li svg{width:22px;height:22px}
.s-duel .s-duel__menu li .nm{display:flex;align-items:center;gap:10px}
.s-duel .s-duel__swapwrap{position:relative}
.s-duel .s-duel__swapwrap .s-duel__menu{inset-inline:auto 0;inset-inline-start:auto;left:0;right:auto;width:240px}
.s-duel .s-duel__swap:hover{background:rgba(18,22,31,.04)}
.s-duel .s-duel__chip{cursor:pointer}
.s-duel .s-duel__chip.on{background:rgba(125,198,255,.16);border-color:#7DC6FF}
/* winner: the side that wins more rows turns gold */
.s-duel .s-duel__card{transition:box-shadow .5s,background .5s}
.s-duel .s-duel__card.win{background:
    radial-gradient(55% 55% at 100% 0,rgba(255,236,190,.6),rgba(255,236,190,0)) padding-box,
    radial-gradient(70% 70% at 0 100%,rgba(247,198,90,.42),rgba(255,214,128,.16) 40%,rgba(255,236,190,0)) padding-box,
    linear-gradient(#fff,#fff) padding-box,
    linear-gradient(225deg,#E0A325 0%,#F7C65A 50%,#FFE7B0 100%) border-box;
  box-shadow:0 24px 60px rgba(231,170,48,.22)}
.s-duel .s-duel__badge{position:absolute;top:-15px;left:50%;translate:-50% 0;display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:500;color:#5a3d00;
  background:linear-gradient(180deg,#FFE29A,#F7C65A);box-shadow:0 8px 20px -6px rgba(231,170,48,.6);opacity:0;scale:.9;transition:opacity .4s,scale .4s;white-space:nowrap}
.s-duel .s-duel__card.win .s-duel__badge{opacity:1;scale:1}
.s-duel .s-duel__badge svg{width:14px;height:14px}
.s-duel .s-duel__dr dd.best{color:#B07A0C;font-weight:500}
.s-duel .s-duel__dr dd.best::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#F7C65A;margin-inline-start:8px;vertical-align:middle;box-shadow:0 0 0 3px rgba(247,198,90,.25)}
.s-duel .s-duel__card.win .s-duel__side{background:rgba(247,198,90,.2);color:#9a6a06}
.s-duel .s-duel__now,.s-duel .s-duel__dr dd{transition:color .3s}
.s-duel .s-duel__body{transition:opacity .25s}
.s-duel .s-duel__body.fade{opacity:0}

/* card as a fixed auto layout: header, body column with even 20px steps, rows of equal height on both sides */
.s-duel .s-duel__row{align-items:stretch}
.s-duel .s-duel__card{display:flex;flex-direction:column;gap:20px}
.s-duel .s-duel__body{display:flex;flex-direction:column;gap:20px;flex:1}
.s-duel .s-duel__co{min-height:48px}
.s-duel .s-duel__price{min-height:66px;justify-content:flex-end}
.s-duel .s-duel__dr{min-height:58px}
.s-duel .s-duel__dr dd{white-space:nowrap}
.s-duel .s-duel__badge{top:-14px;z-index:2}
/* paired entrance: each row slides in on both cards at the same moment, then the better value of that row lights up */
.s-duel .s-duel__price,.s-duel .s-duel__dr{opacity:0;transform:translateY(10px);transition:opacity .45s cubic-bezier(.22,.61,.36,1),transform .55s cubic-bezier(.22,.61,.36,1);transition-delay:calc(var(--r,0) * 260ms)}
.s-duel.play .s-duel__price,.s-duel.play .s-duel__dr{opacity:1;transform:none}
.s-duel .s-duel__dr dd.best,.s-duel .s-duel__now.best{transition:color .35s;transition-delay:calc(var(--r,0) * 260ms + 320ms)}
.s-duel:not(.play) .s-duel__dr dd.best{color:inherit;font-weight:inherit}
.s-duel:not(.play) .s-duel__dr dd.best::after{opacity:0}
.s-duel .s-duel__dr dd.best::after{transition:opacity .3s;transition-delay:calc(var(--r,0) * 260ms + 320ms)}
.s-duel .s-duel__now.best{color:#B07A0C}
.s-duel .s-duel__badge{transition-delay:1.25s}
.s-duel:not(.play) .s-duel__badge{opacity:0}
@media (prefers-reduced-motion:reduce){.s-duel .s-duel__price,.s-duel .s-duel__dr{opacity:1;transform:none;transition:none}}

.s-duel .s-duel__cmp{display:none}
</style>

<section class="s-duel" id="duel" data-theme="light">
  <div class="s-duel__wrap">

    <div class="s-duel__head" data-reveal>
      <span class="s-duel__pill">השוואה ראש בראש</span>
      <h2 class="s-duel__title split">דו קרב חברות מימון</h2>
      <p class="s-duel__sub">השווה בין שתי חברות ובחר את החשבון שמתאים לך</p>
    </div>

    <div class="s-duel__content">
      <div class="s-duel__chips">
        <span class="s-duel__chips-label">דו קרבים פופולריים:</span>
        <a class="s-duel__chip on" role="button" data-pair="tp,lucid">Take Profit Trader <b>vs</b> Lucid Trading</a>
        <a class="s-duel__chip" role="button" data-pair="apex,bulenox">Apex Trader Funding <b>vs</b> Bulenox</a>
        <a class="s-duel__chip" role="button" data-pair="fn,topstep">FundedNext Futures <b>vs</b> Topstep</a>
      </div>

      <div class="s-duel__row" data-reveal>

        <article class="s-duel__card" data-side="0"></article>
        <div class="s-duel__vs-cell"><span class="s-duel__vs">VS</span></div>
        <article class="s-duel__card" data-side="1"></article>

      </div>
      <div class="s-duel__cmp" aria-label="השוואה שורה מול שורה"></div>

      <a class="s-duel__halo" href="#">
        <span class="s-duel__halo-in">
          לדו קרב המלא
          <svg viewBox="0 0 12 10" fill="none" aria-hidden="true"><path d="M11 5H1M4.5 1.5L1 5l3.5 3.5" stroke="#fff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </a>
    </div>

  </div>
</section>

<script>
(function () {
  const S = document.querySelector('.s-duel');
  const TP = S.querySelector('#sduel-tp') ? null : null;
  const SWAP = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M9.5 1.5L13 5L9.5 8.5M12.4647 5H3M6.5 14.5L3 11L6.5 7.5M3.5625 11H13" stroke="#12161F" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const CHEV = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 6L8 10L12 6" stroke="#12161F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const STAR = '<svg viewBox="0 0 16 16" fill="none"><path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6 4.2 13.6l.7-4.3-3.1-3 4.3-.6L8 1.8z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>';
  // demo data for the prototype (rank: lower is better)
  const F = {
    tp: { n: 'Take Profit', logo: 'img/firm-takeprofit.svg', plans: [
      { p: 'מסלול יחיד', size: '50K', now: 102, was: 170, per: 'לחודש', stop: ['תוך יומי (<span class="lat">Intraday</span>)', 2], cons: ['אין', 0], cap: ['אין תקרת משיכה קבועה', 0] },
      { p: 'מסלול PRO', size: '100K', now: 150, was: 250, per: 'לחודש', stop: ['תוך יומי (<span class="lat">Intraday</span>)', 2], cons: ['אין', 0], cap: ['אין תקרת משיכה קבועה', 0] } ] },
    lucid: { n: 'Lucid Trading', logo: 'img/lucid-fig-light.png', plans: [
      { p: 'Pro', size: '50K', now: 140.4, was: 192, per: '', stop: ['סוף יום (<span class="lat">EOD</span>)', 0], cons: ['<span class="lat">40%</span>', 1], cap: ['משיכה <bdi class="lat" dir="ltr">1: 2,000$</bdi> · מדורגת', 1] },
      { p: 'Flex', size: '50K', now: 96, was: 120, per: '', stop: ['סוף יום (<span class="lat">EOD</span>)', 0], cons: ['<span class="lat">50%</span>', 2], cap: ['<bdi class="lat" dir="ltr">1,500$</bdi> למשיכה', 2] } ] },
    apex: { n: 'Apex', logo: 'img/firm-apex.svg', plans: [
      { p: 'EOD Trail', size: '50K', now: 16.7, was: 167, per: 'לחודש', stop: ['סוף יום (<span class="lat">EOD</span>)', 0], cons: ['<span class="lat">30%</span>', 1], cap: ['<bdi class="lat" dir="ltr">2,000$</bdi> לסבב', 1] },
      { p: 'Intraday Trail', size: '50K', now: 14.7, was: 147, per: 'לחודש', stop: ['תוך יומי (<span class="lat">Intraday</span>)', 2], cons: ['<span class="lat">30%</span>', 1], cap: ['<bdi class="lat" dir="ltr">2,000$</bdi> לסבב', 1] } ] },
    bulenox: { n: 'Bulenox', logo: 'img/firm-bulenox.svg', plans: [
      { p: 'Option 1', size: '50K', now: 13.05, was: 145, per: 'לחודש', stop: ['תוך יומי (<span class="lat">Intraday</span>)', 2], cons: ['<span class="lat">40%</span>', 1], cap: ['<bdi class="lat" dir="ltr">1,500$</bdi> בשבוע', 2] },
      { p: 'Option 2', size: '50K', now: 15.3, was: 170, per: 'לחודש', stop: ['סוף יום (<span class="lat">EOD</span>)', 0], cons: ['<span class="lat">40%</span>', 1], cap: ['<bdi class="lat" dir="ltr">1,500$</bdi> בשבוע', 2] } ] },
    fn: { n: 'FundedNext', logo: 'img/firm-fundednext.svg', plans: [
      { p: 'Rapid Pro', size: '50K', now: 71.01, was: 142, per: '', stop: ['סוף יום (<span class="lat">EOD</span>)', 0], cons: ['<span class="lat">40%</span>', 1], cap: ['אין תקרה', 0] },
      { p: 'Rapid Daily', size: '50K', now: 79, was: 158, per: '', stop: ['תוך יומי (<span class="lat">Intraday</span>)', 2], cons: ['אין', 0], cap: ['אין תקרה', 0] } ] },
    topstep: { n: 'Topstep', logo: 'img/firm-topstep.svg', plans: [
      { p: 'Trading Combine', size: '50K', now: 49, was: 49, per: 'לחודש', stop: ['סוף יום (<span class="lat">EOD</span>)', 0], cons: ['<span class="lat">50%</span>', 2], cap: ['<bdi class="lat" dir="ltr">5,000$</bdi> לסבב', 1] } ] },
  };
  const state = [{ f: 'tp', p: 0 }, { f: 'lucid', p: 0 }];
  const cards = [...S.querySelectorAll('.s-duel__card')];
  const money = v => (v % 1 ? v.toFixed(2) : v) + '$';

  function cardHTML(i) {
    const st = state[i], f = F[st.f], pl = f.plans[st.p];
    const plans = f.plans.map((x, k) => `<li class="${k === st.p ? 'on' : ''}" data-plan="${k}"><span>${x.p}</span><small>${x.size}</small></li>`).join('');
    const firms = Object.entries(F).map(([k, x]) => `<li class="${k === st.f ? 'on' : ''}" data-firm="${k}"><span class="nm"><img src="${x.logo}" alt="">${x.n}</span></li>`).join('');
    return `<span class="s-duel__badge">${STAR}מנצחת בדו קרב</span>
      <div class="s-duel__top"><span class="s-duel__side">${i ? 'צד ב׳' : 'צד א׳'}</span>
        <div class="s-duel__swapwrap"><button type="button" class="s-duel__swap" aria-haspopup="listbox">החלף חברה ${SWAP}</button><ul class="s-duel__menu" role="listbox">${firms}</ul></div></div>
      <div class="s-duel__body">
      <div class="s-duel__co"><span class="s-duel__logo"><img src="${f.logo}" alt="" width="40" height="40"></span><span class="s-duel__co-name">${f.n}</span></div>
      <div class="s-duel__route" role="button" tabindex="0" aria-haspopup="listbox"><span class="s-duel__route-txt"><span class="s-duel__lbl">מסלול</span><span class="s-duel__route-val">${pl.p}</span></span>${CHEV}<ul class="s-duel__menu" role="listbox">${plans}</ul></div>
      <div class="s-duel__price" style="--r:0"><div class="s-duel__size"><span class="t">החל מ-</span><span class="lat">·</span><span class="lat">${pl.size}</span></div>
        <div class="s-duel__amt"><span class="s-duel__now">${money(pl.now)}</span>${pl.was > pl.now ? `<span class="s-duel__was">${money(pl.was)}</span>` : ''}${pl.per ? `<span class="s-duel__per">${pl.per}</span>` : ''}</div></div>
      <hr class="s-duel__hr">
      <dl class="s-duel__data">
        <div class="s-duel__dr" style="--r:1"><dt class="s-duel__lbl">סוג הסטופ בממומן</dt><dd data-k="stop">${pl.stop[0]}</dd></div>
        <div class="s-duel__dr" style="--r:2"><dt class="s-duel__lbl">חוק עקביות בממומן</dt><dd data-k="cons">${pl.cons[0]}</dd></div>
        <div class="s-duel__dr" style="--r:3"><dt class="s-duel__lbl">תקרת משיכה</dt><dd data-k="cap">${pl.cap[0]}</dd></div>
      </dl></div>`;
  }
  // each row goes to the lower rank, price to the cheaper side; the side with more rows wins
  function judge() {
    const a = F[state[0].f].plans[state[0].p], b = F[state[1].f].plans[state[1].p];
    const score = [0, 0];
    const rows = [['now', a.now, b.now], ['stop', a.stop[1], b.stop[1]], ['cons', a.cons[1], b.cons[1]], ['cap', a.cap[1], b.cap[1]]];
    cards.forEach(c => c.querySelectorAll('.best').forEach(el => el.classList.remove('best')));
    rows.forEach(([k, x, y]) => {
      if (x === y) return; const w = x < y ? 0 : 1; score[w]++;
      const el = k === 'now' ? cards[w].querySelector('.s-duel__now') : cards[w].querySelector(`dd[data-k="${k}"]`);
      if (el) el.classList.add('best');
    });
    let w = score[0] === score[1] ? (a.now === b.now ? -1 : (a.now < b.now ? 0 : 1)) : (score[0] > score[1] ? 0 : 1);
    cards.forEach((c, i) => c.classList.toggle('win', i === w));
    // phones: the rows live in one shared list under the two short cards, value against value
    const cmp = S.querySelector('.s-duel__cmp');
    if (cmp) {
      const L = [['מחיר החל מ-', money(a.now), money(b.now), a.now === b.now ? -1 : (a.now < b.now ? 0 : 1)], ['סוג הסטופ בממומן', a.stop[0], b.stop[0], a.stop[1] === b.stop[1] ? -1 : (a.stop[1] < b.stop[1] ? 0 : 1)],
        ['חוק עקביות בממומן', a.cons[0], b.cons[0], a.cons[1] === b.cons[1] ? -1 : (a.cons[1] < b.cons[1] ? 0 : 1)], ['תקרת משיכה', a.cap[0], b.cap[0], a.cap[1] === b.cap[1] ? -1 : (a.cap[1] < b.cap[1] ? 0 : 1)]];
      cmp.innerHTML = L.map(([l, x, y, best], r) => `<div class="c-row" style="--r:${r}"><div class="c-lbl">${l}</div><div class="c-vals"><span class="${best === 0 ? 'best' : ''}">${x}</span><span class="${best === 1 ? 'best' : ''}">${y}</span></div><div class="c-bars"><i class="${best === 0 ? 'on' : ''}"></i><i class="${best === 1 ? 'on' : ''}"></i></div></div>`).join('');
    }
  }
  function render(i) { cards[i].innerHTML = cardHTML(i); }
  function replay() { S.classList.remove('play'); void S.offsetWidth; setTimeout(() => S.classList.add('play'), 40); }
  function renderAll() { render(0); render(1); judge(); if (seen) replay(); }
  let seen = false;
  new IntersectionObserver((es, o) => es.forEach(e => { if (e.isIntersecting) { seen = true; replay(); o.disconnect(); } }), { threshold: .35 }).observe(S.querySelector('.s-duel__row'));
  S.addEventListener('click', e => {
    const card = e.target.closest('.s-duel__card'), i = card ? +card.dataset.side : -1;
    const li = e.target.closest('.s-duel__menu li');
    if (li && card) {
      if (li.dataset.plan) state[i].p = +li.dataset.plan;
      if (li.dataset.firm) { state[i] = { f: li.dataset.firm, p: 0 }; S.querySelectorAll('.s-duel__chip').forEach(c => c.classList.remove('on')); }
      const body = card.querySelector('.s-duel__body'); body.classList.add('fade');
      setTimeout(() => { render(0); render(1); judge(); replay(); }, 180); return;
    }
    const opener = e.target.closest('.s-duel__route, .s-duel__swap');
    S.querySelectorAll('.open').forEach(o => { if (!opener || (o !== opener && o !== opener.parentElement)) o.classList.remove('open'); });
    if (opener) (opener.classList.contains('s-duel__swap') ? opener.parentElement : opener).classList.toggle('open');
    const chip = e.target.closest('.s-duel__chip');
    if (chip) { e.preventDefault(); const [a, b] = chip.dataset.pair.split(','); state[0] = { f: a, p: 0 }; state[1] = { f: b, p: 0 };
      S.querySelectorAll('.s-duel__chip').forEach(c => c.classList.toggle('on', c === chip)); renderAll(); }
  });
  document.addEventListener('click', e => { if (!e.target.closest('.s-duel')) S.querySelectorAll('.open').forEach(o => o.classList.remove('open')); });
  S.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('s-duel__route')) { e.preventDefault(); e.target.classList.toggle('open'); } if (e.key === 'Escape') S.querySelectorAll('.open').forEach(o => o.classList.remove('open')); });
  renderAll();
})();
</script>

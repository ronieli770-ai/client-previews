<style>
  /* dropdown menus: one dark box under the header that resizes and slides between menus */
  .hdr nav a .chev { width: 10px; height: 10px; opacity: .55; transition: transform .35s var(--ease), opacity .25s; }
  .hdr nav a.open .chev { transform: rotate(180deg); opacity: 1; }
  .hdr.menu-open { --bg: rgba(12,15,22,.94); --fg: #fff; --deal: #d6ecff; --ring: rgba(255,255,255,.14); --ringbg: rgba(85,169,235,.05); --pill: #fff; --pillfg: #000; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  .mega-dim { position: fixed; inset: 0; z-index: 49; background: rgba(6,9,14,.5); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity .35s var(--ease); }
  .mega-dim.on { opacity: 1; }
  .hdr .wrap { position: relative; }
  .mega { position: absolute; top: calc(100% - 2px); right: 50%; width: 0; height: 0; border-radius: 26px; overflow: hidden; pointer-events: none; opacity: 0; color: #fff;
    background: rgba(11,14,20,.97); box-shadow: inset 0 0 0 1px rgba(125,198,255,.18), 0 40px 80px -30px rgba(0,0,0,.8);
    transition: width .45s var(--ease), height .45s var(--ease), right .45s var(--ease), opacity .25s; }
  .mega.in { opacity: 1; pointer-events: auto; }
  .mega::before { content: ""; position: absolute; top: 0; right: var(--ax, 50%); width: 90px; height: 2px; transform: translateX(50%); background: linear-gradient(90deg, transparent, var(--sky), transparent); transition: right .45s var(--ease); }
  .mega .pane { position: absolute; top: 0; right: 0; width: max-content; padding: 16px; opacity: 0; transform: translateX(var(--from, 30px)); transition: opacity .3s, transform .45s var(--ease); pointer-events: none; }
  .mega .pane.on { opacity: 1; transform: none; pointer-events: auto; }
  .mega a { color: inherit; text-decoration: none; }
  .mega .tile { width: 40px; height: 40px; flex: none; border-radius: 12px; background: #fff; display: grid; place-items: center; box-shadow: 0 6px 16px -6px rgba(0,0,0,.6); }
  .mega .tile img { width: 26px; height: 26px; object-fit: contain; }
  .mega .lt { font-family: "Roboto", sans-serif; direction: ltr; unicode-bidi: isolate; }
  .mega .pct { font: 700 15px "Roboto", sans-serif; }
  .mega .code { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; font: 500 13px "Roboto", sans-serif; letter-spacing: 1px; cursor: pointer; white-space: nowrap;
    color: var(--ice); background: rgba(125,198,255,.1); box-shadow: inset 0 0 0 1px rgba(125,198,255,.35); transition: background-color .2s; }
  .mega .code:hover { background: rgba(125,198,255,.22); }
  .mega .code svg { width: 13px; height: 13px; }
  .mega .code.done { color: var(--navy); background: #3fd8c2; box-shadow: none; }
  .mega .sub { font-size: 14px; color: rgba(255,255,255,.55); }
  .mega .more { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; color: var(--sky); }
  .mega .more svg { width: 14px; height: 14px; transition: transform .3s var(--ease); }
  .mega .more:hover svg { transform: translateX(-4px); }
  /* firms: list with the coupon on every row, preview card beside it */
  .mega .firms { display: grid; grid-template-columns: 470px 300px; gap: 14px; }
  .mega .list { display: grid; gap: 2px; align-content: start; }
  .mega .it { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 14px; transition: background-color .2s; }
  .mega .it b { flex: 1; font-size: 16px; font-weight: 500; text-align: right; }
  .mega .it .pct { width: 44px; text-align: left; }
  .mega .it.on { background: rgba(125,198,255,.1); }
  .mega .list .more { margin: 8px 10px 2px; }
  .mega .prev { position: relative; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 10px;
    background: radial-gradient(90% 70% at 0% 100%, var(--g, rgba(46,139,216,.45)), transparent 62%), #0b0e14; box-shadow: inset 0 0 0 1px rgba(125,198,255,.18); transition: background .4s; }
  .mega .prev .eb { font: 500 13px "Roboto", sans-serif; color: var(--sky); direction: ltr; text-align: right; }
  .mega .prev .big { font: 700 64px/1 "Roboto", sans-serif; background: linear-gradient(90deg, var(--gc, #61b1f2), #fff); -webkit-background-clip: text; background-clip: text; color: transparent; direction: ltr; text-align: right; }
  .mega .prev h4 { font-size: 20px; font-weight: 500; line-height: 1.3; }
  .mega .prev p { font-size: 14px; color: rgba(255,255,255,.65); line-height: 1.5; }
  .mega .prev .act { margin-top: auto; display: flex; gap: 10px; align-items: center; }
  .mega .prev .btn { height: 40px; padding: 0 18px; border-radius: 999px; background: #fff; color: var(--navy); font-weight: 500; display: inline-flex; align-items: center; font-size: 15px; }
  .mega .swap { animation: mega-swap .35s var(--ease); } @keyframes mega-swap { from { opacity: 0; transform: translateY(8px); } }
  /* deals: mini deal cards in each deal's own colour */
  .mega .deals { display: grid; grid-template-columns: repeat(5, 150px); gap: 10px; }
  .mega .dc { border-radius: 18px; padding: 16px 12px; display: grid; gap: 6px; justify-items: center; text-align: center;
    background: radial-gradient(95% 95% at 0% 100%, color-mix(in srgb, var(--c) 40%, transparent), transparent 70%), #0b0e14; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 45%, transparent); transition: transform .3s var(--ease); }
  .mega .dc:hover { transform: translateY(-4px); }
  .mega .dc .n { font: 700 34px/1 "Roboto", sans-serif; background: linear-gradient(90deg, var(--c), #fff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .mega .dc b { font-size: 15px; font-weight: 500; }
  .mega .foot { display: flex; justify-content: space-between; align-items: center; padding: 14px 6px 2px; }
  /* academy: the new covers */
  .mega .acad { display: grid; grid-template-columns: repeat(3, 200px); gap: 12px; }
  .mega .acad a { border-radius: 16px; overflow: hidden; background: #0b0e14; box-shadow: inset 0 0 0 1px rgba(125,198,255,.14); transition: transform .35s var(--ease); }
  .mega .acad a:hover { transform: translateY(-4px); }
  .mega .acad img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block; }
  .mega .acad span { display: block; padding: 10px 12px 12px; font-size: 14px; font-weight: 500; line-height: 1.3; }
  @media (max-width: 1180px) { .mega, .mega-dim { display: none; } }
</style>
<header class="hdr" id="hdr">
  <div class="wrap">
    <a class="logo" href="#top" aria-label="AntarTrade"></a>
    <nav id="hdr-nav">
      <a class="cur" href="#top">דף הבית</a>
      <a data-m="firms" href="#compare">חברות מימון<svg class="chev" viewBox="0 0 10 10" fill="none"><path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <a href="#duel">השוואת חברות</a>
      <a data-m="deals" class="deal" href="#deals">מבצעים והגרלות<svg viewBox="0 0 16 16" fill="none"><path transform="translate(1.5 1.5)" d="M12.1 0H8.26C8.14 0 8.03.05 7.94.13L.26 7.81C.09 7.98 0 8.21 0 8.45s.09.47.26.64l3.66 3.66c.17.17.4.26.64.26s.47-.09.64-.26l7.67-7.68c.09-.08.13-.2.13-.32V.9A.9.9 0 0 0 12.1 0Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="4" r=".875" fill="currentColor"/></svg><svg class="chev" viewBox="0 0 10 10" fill="none"><path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <a data-m="academy" href="#academy">מרכז הידע<svg class="chev" viewBox="0 0 10 10" fill="none"><path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <a href="#journal">יומן מסחר</a>
      <a href="#about">אודות</a>
    </nav>
    <div class="halo"><a href="#academy">אקדמיה<svg viewBox="0 0 16 16" fill="none"><path transform="translate(1 2)" d="M0 4L7 0L14 4L7 8Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/><path transform="translate(3.5 6)" d="M0 1.5V5.5L4.5 8M4.5 8L9 5.5V1.5M4.5 8V4M11.5 5.5V0" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div>
    <div class="mega" id="mega"></div>
  </div>
</header>
<div class="mega-dim" id="mega-dim"></div>
<script>(function(){
  const IMG = 'img/';
  const COPY = '<svg viewBox="0 0 16 16" fill="none"><rect x="5.5" y="5.5" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 3.5C10.5 2.67 9.83 2 9 2H4C2.9 2 2 2.9 2 4V9C2 9.83 2.67 10.5 3.5 10.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
  const ARROW = '<svg viewBox="0 0 14 14" fill="none"><path d="M12 7H2M6 3L2 7L6 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  // same deals as the deals section
  const FIRMS = [
    { n: 'Apex Trader Funding', s: 'Apex', logo: 'brand-apex.png', pct: '90%', c: '#3fd8c2', h: 'אפקס EOD - 90% הנחה', p: 'קוד ANTAR מעניק 90% הנחה על מבחני EOD Trail.' },
    { n: 'Take Profit Trader', s: 'Take Profit', logo: 'brand-takeprofit.png', pct: '40%', c: '#8c7bff', h: 'חשבון PRO ללא עמלת הפעלה', p: 'ללא חוק עקביות בחשבון הממומן, אפשר למשוך בכל יום.' },
    { n: 'Lucid Trading', s: 'Lucid', logo: 'brand-lucid.png', pct: '30%', c: '#61b1f2', h: 'חדש: סטופ סוף יום במבחן ובממומן', p: 'Lucid Trading מציגה סטופ סוף יום (EOD) גם במבחן וגם בממומן.' },
    { n: 'FundedNext', s: 'FundedNext', logo: 'brand-fundednext.png', pct: '50%', c: '#4f6bff', h: 'מסלולי Rapid Pro ו-Rapid Daily', p: 'עד 50% הנחה על מסלולי Rapid Pro ו-Rapid Daily עם הקוד ANTAR.' },
    { n: 'Bulenox', s: 'Bulenox', logo: 'brand-bulenox.png', pct: '91%', c: '#d17bff', h: 'עד 91% הנחה עם הקוד ANTAR', p: '100% רווח עד 10K$, ומסחר בחדשות מותר.' },
  ];
  const ACAD = [['full.webp', 'המסלול המלא למסחר בחוזים'], ['intro.webp', 'קורס המבוא החינמי'], ['nostro.webp', 'קורס הנוסטרו החינמי'], ['v-apex.jpg', 'מדריך לאפקס'], ['v-tp.jpg', 'החוקים של טייק פרופיט'], ['a-footprint.jpg', 'מה זה פוטפרינט?']];
  const code = () => `<span class="code" data-copy>${COPY}<span class="lt">ANTAR</span></span>`;
  const prev = f => `<div class="swap" style="display:contents"><span class="eb">${f.n}</span><span class="big" style="--gc:${f.c}">${f.pct}</span><h4>${f.h}</h4><p>${f.p}</p><div class="act"><a class="btn" href="#compare">לביקורת המלאה</a>${code()}</div></div>`;
  const PANES = {
    firms: `<div class="firms"><div class="list">${FIRMS.map((f, i) => `<a class="it${i ? '' : ' on'}" data-f="${i}" href="#compare"><span class="tile"><img src="${IMG + f.logo}" alt=""></span><b class="lt">${f.n}</b><span class="pct" style="color:${f.c}">${f.pct}</span>${code()}</a>`).join('')}<a class="more" href="#compare">לכל חברות המימון ${ARROW}</a></div><div class="prev" id="mega-prev">${prev(FIRMS[0])}</div></div>`,
    deals: `<div class="deals">${FIRMS.map(f => `<a class="dc" href="#deals" style="--c:${f.c}"><span class="tile"><img src="${IMG + f.logo}" alt=""></span><span class="n">${f.pct}</span><b class="lt">${f.s}</b>${code()}</a>`).join('')}</div><div class="foot"><span class="sub">קוד אחד, <span class="lt">ANTAR</span>, עובד בכל החברות</span><a class="more" href="#deals">לכל המבצעים ${ARROW}</a></div>`,
    academy: `<div class="acad">${ACAD.map(([img, t]) => `<a href="#academy"><img src="${IMG + img}" alt=""><span>${t}</span></a>`).join('')}</div><div class="foot"><span class="sub">קורסים, סרטונים ומאמרים</span><a class="more" href="#academy">לכל האקדמיה ${ARROW}</a></div>`,
  };
  const hdr = document.getElementById('hdr'), nav = document.getElementById('hdr-nav'), mega = document.getElementById('mega'), dim = document.getElementById('mega-dim'), keys = Object.keys(PANES);
  mega.innerHTML = keys.map(k => `<div class="pane" data-p="${k}">${PANES[k]}</div>`).join('');
  let cur = null, t = null;
  function open(a) {
    clearTimeout(t); const m = a.dataset.m, pane = mega.querySelector(`[data-p="${m}"]`);
    const dir = cur && keys.indexOf(m) < keys.indexOf(cur) ? '-30px' : '30px'; cur = m;
    nav.querySelectorAll('a').forEach(x => x.classList.toggle('open', x === a));
    mega.querySelectorAll('.pane').forEach(p => { p.style.setProperty('--from', p === pane ? dir : (dir === '30px' ? '-30px' : '30px')); p.classList.toggle('on', p === pane); });
    const w = pane.offsetWidth, h = pane.offsetHeight, wrap = mega.parentElement.getBoundingClientRect(), ar = a.getBoundingClientRect();
    let center = ar.left + ar.width / 2 - wrap.left; center = Math.max(w / 2 + 16, Math.min(wrap.width - w / 2 - 16, center));
    mega.style.width = w + 'px'; mega.style.height = h + 'px'; mega.style.right = (wrap.width - center - w / 2) + 'px';
    mega.style.setProperty('--ax', (center + w / 2 - (ar.left + ar.width / 2 - wrap.left)) + 'px');
    mega.classList.add('in'); dim.classList.add('on'); hdr.classList.add('menu-open');
  }
  function close() {
    t = setTimeout(() => { cur = null; mega.classList.remove('in'); dim.classList.remove('on'); hdr.classList.remove('menu-open'); nav.querySelectorAll('a').forEach(x => x.classList.remove('open')); }, 180);
  }
  nav.querySelectorAll('a').forEach(a => a.addEventListener('mouseenter', () => a.dataset.m ? open(a) : close()));
  nav.addEventListener('mouseleave', close);
  mega.addEventListener('mouseenter', () => clearTimeout(t));
  mega.addEventListener('mouseleave', close);
  // hovering a firm swaps the preview card
  mega.addEventListener('mouseover', e => { const it = e.target.closest('.it'); if (!it || it.classList.contains('on')) return;
    it.parentElement.querySelectorAll('.it').forEach(x => x.classList.toggle('on', x === it));
    const f = FIRMS[+it.dataset.f], pv = document.getElementById('mega-prev'); pv.style.setProperty('--g', f.c + '73'); pv.innerHTML = prev(f); });
  // the coupon copies itself
  mega.addEventListener('click', e => { const c = e.target.closest('[data-copy]'); if (!c) return; e.preventDefault(); e.stopPropagation();
    navigator.clipboard && navigator.clipboard.writeText('ANTAR').catch(() => {});
    c.classList.add('done'); c.lastChild.textContent = 'הועתק'; setTimeout(() => { c.classList.remove('done'); c.lastChild.textContent = 'ANTAR'; }, 1400); });
  // ?menu=firms opens a menu directly (for checking)
  const q = new URLSearchParams(location.search).get('menu'); if (q) addEventListener('load', () => { mega.style.transition = 'none'; mega.querySelectorAll('.pane').forEach(p => p.style.transition = 'none'); open(nav.querySelector(`[data-m="${q}"]`)); });
})();</script>

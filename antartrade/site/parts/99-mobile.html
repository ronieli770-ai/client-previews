<style>
/* ================= mobile layer (≤ 760px): structure decisions approved by Roni ================= */
.hdr .burger { display: none; }
.m-menu { display: none; }
@media (max-width: 1180px) {
  /* header: logo, courses button and a hamburger that opens a full-screen menu */
  .hdr .burger { display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 50%; background: transparent; color: var(--fg); cursor: pointer; flex: 0 0 auto; transition: color var(--fade); }
  .hdr .burger svg { width: 24px; height: 24px; }
  .hdr .wrap { gap: 12px; }
  .hdr .halo { margin-inline-start: auto; }
  .m-menu { display: flex; position: fixed; inset: 0; z-index: 70; flex-direction: column; padding: 18px 20px 32px; background: #12161f; color: #fff;
    opacity: 0; visibility: hidden; transition: opacity .35s ease, visibility .35s; }
  .m-menu.open { opacity: 1; visibility: visible; }
  .m-menu .m-top { display: flex; align-items: center; justify-content: space-between; height: 56px; }
  .m-menu .m-top .logo { width: 150px; height: 33px; background: #fff; -webkit-mask: url(img/logo-mark.webp) right center / contain no-repeat; mask: url(img/logo-mark.webp) right center / contain no-repeat; }
  .m-menu .m-close { width: 44px; height: 44px; border: 0; background: none; color: #fff; cursor: pointer; }
  .m-menu nav { display: flex; flex-direction: column; margin-top: 28px; }
  .m-menu nav a { display: flex; align-items: center; justify-content: space-between; padding: 18px 4px; font: 500 24px "Fb Reforma", sans-serif; color: #fff; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,.08);
    opacity: 0; translate: 0 14px; transition: opacity .4s ease, translate .5s cubic-bezier(.22,.61,.36,1); transition-delay: calc(var(--i) * 45ms + 80ms); }
  .m-menu.open nav a { opacity: 1; translate: 0 0; }
  .m-menu nav a.deal { color: #7dc6ff; }
  .m-menu nav a svg { width: 14px; height: 10px; opacity: .5; }
  .m-menu .m-cta { margin-top: auto; display: flex; justify-content: center; }
  body.menu-open { overflow: hidden; }
}

@media (max-width: 760px) {
  /* ---------- header (after schooliner): round menu button at the right, the logo in a pill next to it, courses as a pill at the left ---------- */
  .hdr { --chip: rgba(255,255,255,.08); }
  .hdr.on.light { --chip: rgba(18,22,31,.06); }
  .hdr .wrap { padding: 12px 16px; gap: 8px; }
  .hdr .burger { order: -1; width: 48px; height: 48px; background: var(--chip); transition: background-color var(--fade), color var(--fade); }
  .hdr .logo { order: 0; width: 132px; height: 48px; border-radius: 999px; background: none; -webkit-mask: none; mask: none; position: relative; }
  .hdr .logo::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--chip); transition: background-color var(--fade); }
  .hdr .logo::after { content: ""; position: absolute; inset: 12px 16px; background: var(--fg); transition: background-color var(--fade);
    -webkit-mask: url(img/logo-mark.webp) center / contain no-repeat; mask: url(img/logo-mark.webp) center / contain no-repeat; }
  .hdr .halo { order: 1; margin-inline-start: auto; padding: 0; background: none; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
  .hdr .halo a { height: 48px; padding: 0 18px; font-size: 16px; background: var(--chip); color: var(--fg); gap: 8px; }
  .hdr .halo a svg { width: 18px; height: 18px; }
  /* ---------- section rhythm and titles ---------- */
  .s-duel, .s-deals, .s-academy, .s-platforms .p-inner, .s-next { padding-top: 72px !important; padding-bottom: 80px !important; }
  html body .split, html body .g-title { font-size: 32px !important; line-height: 1.15 !important; }
  /* ---------- hero: centred on the grid, photo fills the section under an overlay that opens at the bottom ---------- */
  .s-hero { padding: 118px 16px 100px !important; min-height: 0 !important; }
  .s-hero .s-hero__trader { top: 138px !important; left: 74px !important; right: 74px !important; bottom: 0 !important; width: auto !important; height: auto !important; opacity: 1 !important; transform: none !important; mix-blend-mode: normal; }
  .s-hero .s-hero__trader .in { translate: none !important; }
  .s-hero .s-hero__trader img { inset: 0; width: 100% !important; height: 100% !important; object-fit: cover; object-position: 72% 40%; filter: blur(1.2px); transform: scale(1.6); transform-origin: 72% 45%; }
  .s-hero .s-hero__trader::after { background: linear-gradient(180deg, rgba(18,22,31,.9) 0%, rgba(18,22,31,.72) 40%, rgba(18,22,31,.3) 72%, rgba(18,22,31,0) 100%) !important; }
  .s-hero .s-hero__glow { display: none; }
  .s-hero .s-hero__content { width: 100%; max-width: 100%; align-items: flex-start; text-align: right; margin: 0 auto; translate: none !important; gap: 22px; }
  .s-hero .s-hero__head + .s-hero__sub { margin-top: -10px; }
  .s-hero .s-hero__title { font-size: 28px; text-align: right; width: 100%; }
  .s-hero .s-hero__title .s-hero__l1 { font-size: 46px; line-height: 1.08; }
  .s-hero .s-hero__title .m-br { display: block; }
  .s-hero .s-hero__title .s-hero__l2 { font-size: 28px; line-height: 1.25; margin-top: 4px; }
  .s-hero .s-hero__sub { justify-content: flex-start; text-align: right; font-size: 16px; color: rgba(255,255,255,.88); }
  /* three equal tiles in one row (after schooliner): same width, label on two centred lines */
  .s-hero .s-hero__btns { display: grid !important; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; }
  .s-hero .s-hero__halo { padding: 0; border-radius: 16px; min-width: 0; display: flex; }
  .s-hero .s-hero__halo-in { flex: 1; width: 100% !important; height: 68px !important; padding: 0 16px !important; border-radius: 15px; font-size: 16px !important; font-weight: 500; line-height: 1.15 !important; white-space: normal !important; text-align: center; gap: 0; }
  .s-hero .s-hero__halo-in img { display: none; }
  .s-hero .s-hero__search { width: 100%; }
  /* hero photo options for review: ?mh=b|c|d (default = a) */
  .mh-b .s-hero .s-hero__trader { top: auto !important; height: 46% !important; }
  .mh-b .s-hero .s-hero__trader img { transform: scale(1.15); transform-origin: 70% 40%; filter: none; object-position: 70% 35%; }
  .mh-b .s-hero .s-hero__trader::after { background: linear-gradient(180deg, #12161f 0%, rgba(18,22,31,.4) 40%, rgba(18,22,31,0) 100%) !important; }
  .mh-c .s-hero .s-hero__trader img { transform: none; filter: none; object-position: 22% 30%; }
  .mh-c .s-hero .s-hero__trader::after { background: linear-gradient(180deg, rgba(18,22,31,.95) 0%, rgba(18,22,31,.8) 45%, rgba(18,22,31,.35) 75%, rgba(18,22,31,.15) 100%) !important; }
  .mh-d .s-hero .s-hero__trader img { transform: scale(1.3); transform-origin: 70% 45%; filter: blur(6px) saturate(1.2); opacity: .55; }
  .mh-d .s-hero .s-hero__trader::after { background: radial-gradient(70% 50% at 50% 85%, rgba(46,139,216,.35), transparent 70%), linear-gradient(180deg, rgba(18,22,31,.6), rgba(18,22,31,0)) !important; }
  /* ---------- hero, mobile layout after OpticOdds: short text on top, the trading screen below it in a tilted view, cut by the curve ---------- */
  .s-hero { padding: 100px 16px 262px !important; }
  .s-hero .s-hero__search { display: none !important; }
  .s-hero .s-hero__trader { top: auto !important; bottom: 0 !important; height: 312px !important; left: 74px !important; right: 74px !important; overflow: hidden; }
  .s-hero .s-hero__trader .in { position: absolute; inset: 0; perspective: 900px; }
  .s-hero .s-hero__trader img { inset: 0; width: 100% !important; height: 100% !important; object-fit: cover; object-position: 74% 38%; filter: none !important;
    transform: rotateX(16deg) rotateY(-14deg) rotateZ(-6deg) scale(1.55) !important; transform-origin: 70% 40% !important; border-radius: 18px; }
  .s-hero .s-hero__trader::after { background: linear-gradient(180deg, #12161f 0%, #12161f 6%, rgba(18,22,31,.55) 30%, rgba(18,22,31,0) 58%), linear-gradient(90deg, rgba(18,22,31,.55), rgba(18,22,31,0) 30%, rgba(18,22,31,0) 70%, rgba(18,22,31,.55)) !important; }
  /* logos: only the carousel, close under the hero so it shows before scrolling */
  .s-logos { padding: 12px 16px 40px !important; }
  .s-logos .s-logos__head { display: none; }
  .btn-halo.btn-halo > span { font-size: 18px; height: 46px; padding: 0 20px; }

  /* ---------- comparison table: the full table, swiped sideways (to the left) to see more columns; the firm column stays pinned ---------- */
  .s-table { padding: 40px 0 56px; }
  .s-table .t-wrap { padding: 0 16px; }
  .s-table .t-card { border-radius: 28px; }
  .s-table .t-frame { padding: 22px 0 14px !important; }
  .s-table .t-title { font-size: 24px !important; line-height: 1.2; padding: 0 16px 20px !important; border-bottom: 0 !important; }
  .s-table .t-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; scroll-snap-type: x proximity; overscroll-behavior-x: contain; scrollbar-width: none; position: relative; }
  .s-table .t-scroll::-webkit-scrollbar { display: none; }
  .s-table .t-grid { min-width: 1080px; padding-inline: 0 16px; }
  .s-table .t-row { grid-template-columns: 150px 70px 86px 200px 84px 190px 200px 230px; column-gap: 14px; }
  .s-table .t-row > :first-child { position: sticky; right: 0; z-index: 2; background: #fff; padding: 10px 16px 10px 10px; margin-block: -10px; transform: translateZ(0); }
  /* logos stay painted while the row scrolls (Safari drops absolutely placed images inside sticky cells) */
  .s-table .t-row > :first-child .logo { position: relative; flex: 0 0 32px; width: 32px; height: 32px; }
  .s-table .t-row > :first-child .logo img { position: static !important; width: 100% !important; height: 100% !important; object-fit: contain; inset: auto !important; }
  .s-table .t-head > :first-child { background: #fff; }
  .s-table .firm-name { font-size: 15px; }
  /* swipe hint under the table */
  .s-table .t-hint { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; font: 400 13px "Fb Reforma", sans-serif; color: rgba(18,22,31,.5); }
  .s-table .t-hint svg { width: 18px; height: 10px; animation: t-nudge 1.6s ease-in-out infinite; }
  @keyframes t-nudge { 0%, 100% { translate: 0 0; } 50% { translate: -6px 0; } }
  /* ---------- duel (after payless): two short cards side by side, the data in one shared list below, value against value ---------- */
  .s-duel__chips { gap: 8px; }
  .s-duel__chips-label { width: 100%; text-align: center; }
  html body .s-duel .s-duel__row { grid-template-columns: minmax(0,1fr) 0 minmax(0,1fr) !important; column-gap: 10px; max-width: none; margin: 0; }
  html body .s-duel .s-duel__row > .s-duel__card { margin: 0 !important; }
  .s-duel .s-duel__vs-cell { height: auto; z-index: 3; }
  .s-duel .s-duel__vs { width: 36px; height: 36px; font-size: 12px; position: absolute; top: 34px; left: 50%; translate: -50% 0; }
  .s-duel .s-duel__card { padding: 18px 12px 14px; border-radius: 22px; gap: 10px; text-align: center; }
  .s-duel .s-duel__body { gap: 10px; align-items: center; }
  .s-duel .s-duel__data, .s-duel .s-duel__hr { display: none !important; }
  .s-duel .s-duel__top { display: contents; }
  .s-duel .s-duel__side { display: none; }
  .s-duel .s-duel__swapwrap { order: 9; align-self: center; }
  .s-duel .s-duel__swap { border: 0; padding: 4px 6px; font-size: 13px; color: #2e8bd8; gap: 5px; background: none; }
  .s-duel .s-duel__swap svg path { stroke: #2e8bd8; }
  .s-duel .s-duel__swap svg { width: 13px; height: 13px; }
  .s-duel .s-duel__swapwrap .s-duel__menu { width: 200px; bottom: calc(100% + 6px); top: auto; }
  .s-duel .s-duel__card[data-side="1"] .s-duel__swapwrap .s-duel__menu { left: -6px; right: auto; }
  .s-duel .s-duel__card[data-side="0"] .s-duel__swapwrap .s-duel__menu { right: -6px; left: auto; }
  .s-duel .s-duel__co { flex-direction: column; align-items: center; gap: 6px; min-height: 0; }
  .s-duel .s-duel__logo img, .s-duel .s-duel__logo svg { width: 34px; height: 34px; }
  .s-duel .s-duel__co-name { font-size: 16px; line-height: 1.15; }
  .s-duel .s-duel__route { width: 100%; padding: 8px 10px; }
  .s-duel .s-duel__route-txt { gap: 4px; font-size: 13px; }
  .s-duel .s-duel__route .s-duel__lbl { display: none; }
  .s-duel .s-duel__price { min-height: 0; align-items: center; }
  .s-duel .s-duel__size { display: none; }
  .s-duel .s-duel__now { font-size: 22px; }
  .s-duel .s-duel__was { font-size: 12px; }
  .s-duel .s-duel__per { display: none; }
  .s-duel .s-duel__badge { font-size: 12px !important; padding: 4px 9px; top: -12px; }
  .s-duel .s-duel__badge svg { width: 12px !important; height: 12px !important; }
  /* the shared list */
  .s-duel .s-duel__cmp { display: block; width: 100%; margin-top: 14px; padding: 6px 16px; border-radius: 22px; background: #fff; box-shadow: 0 0 0 1px #e3eef9, 0 14px 34px rgba(85,169,235,.10); }
  .s-duel .c-row { padding: 14px 0; border-bottom: 1px solid #eef4fa; opacity: 0; translate: 0 8px; transition: opacity .4s, translate .5s; transition-delay: calc(var(--r) * 180ms); }
  .s-duel.play .c-row { opacity: 1; translate: 0 0; }
  .s-duel .c-row:last-child { border-bottom: 0; }
  .s-duel .c-lbl { text-align: center; font: 500 14px "Fb Reforma", sans-serif; color: #12161f; margin-bottom: 8px; }
  .s-duel .c-vals { display: flex; justify-content: space-between; gap: 12px; font: 400 15px "Fb Reforma", sans-serif; color: #12161f; }
  .s-duel .c-vals span { flex: 1; font-size: 15px !important; }
  .s-duel .c-vals span:last-child { text-align: left; }
  .s-duel .c-vals span.best { color: #B07A0C; font-weight: 500; }
  .s-duel .c-bars { display: flex; gap: 12px; margin-top: 8px; }
  .s-duel .c-bars i { flex: 1; height: 3px; border-radius: 3px; background: #eef1f5; transition: background .4s; transition-delay: calc(var(--r) * 180ms + 250ms); }
  .s-duel.play .c-bars i.on { background: linear-gradient(90deg, #F7C65A, #E0A325); }

  /* ---------- deals: swipe carousel with the tabs above it ---------- */
  .s-deals .fan-nav { flex-direction: column-reverse; gap: 18px; }
  .s-deals .tabs { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .s-deals .tabs::-webkit-scrollbar { display: none; }

  /* ---------- academy ---------- */
  .s-academy .card { padding: 18px; }
  .s-academy .tabs { width: 100%; }
  .s-academy .tabs button { flex: 1; width: auto; }

  /* ---------- platforms & tools: a sideways swipe row per group ---------- */
  .s-platforms .p-row, .s-platforms .p-row.five { display: flex !important; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; margin-inline: -16px; padding: 4px 16px 18px; scrollbar-width: none; }
  .s-platforms .p-row::-webkit-scrollbar { display: none; }
  .s-platforms .p-row > .card { flex: 0 0 78%; scroll-snap-align: start; min-height: 320px; }

  /* ---------- journal: no overlap with the platforms curve ---------- */
  .s-journal { margin-top: -60px; background: linear-gradient(transparent 60px, #fff 60px); padding-bottom: 80px; }
  .s-journal .panel { padding: 28px 18px !important; border-radius: 32px !important; gap: 24px; }
  .s-journal .copy h2 { font-size: 30px !important; line-height: 1.15 !important; }
  .s-journal .card { width: 100% !important; min-height: 0 !important; }

  /* ---------- community ---------- */
  .s-community .banner { border-radius: 28px !important; }

  /* ---------- about ---------- */
  .s-about .copy { font-size: 18px !important; }

  /* ---------- footer: link groups open and close ---------- */
  .s-footer .s-footer__cols { display: flex !important; flex-direction: column; gap: 0 !important; width: 100%; }
  .s-footer .s-footer__col { width: 100%; gap: 0; border-bottom: 1px solid rgba(255,255,255,.08); }
  .s-footer .s-footer__col h3 { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 16px 0; font-size: 16px; cursor: pointer; }
  .s-footer .s-footer__col h3::after { content: ""; width: 9px; height: 9px; border-left: 1.6px solid currentColor; border-bottom: 1.6px solid currentColor; rotate: -45deg; translate: 0 -3px; transition: rotate .3s, translate .3s; opacity: .7; }
  .s-footer .s-footer__col.open h3::after { rotate: 135deg; translate: 0 3px; }
  .s-footer .s-footer__col ul { display: grid; gap: 12px; max-height: 0; overflow: hidden; transition: max-height .4s ease, padding .4s ease; padding: 0; }
  .s-footer .s-footer__col.open ul { max-height: 320px; padding: 0 0 16px; }

  /* ---------- touch targets and the floating bot ---------- */
  .bot-fab { right: 14px; bottom: 14px; width: 60px; height: 40px; }
  .bot-panel { right: 12px; left: 12px; width: auto; bottom: 66px; }
}
</style>
<script>
(function () {
  // hamburger + full-screen menu built from the header's own links
  const hdr = document.getElementById('hdr'); if (!hdr) return;
  const wrap = hdr.querySelector('.wrap'), nav = hdr.querySelector('nav');
  const b = document.createElement('button'); b.className = 'burger'; b.type = 'button'; b.setAttribute('aria-label', 'פתיחת תפריט'); b.setAttribute('aria-expanded', 'false');
  b.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M4 7H20M4 12H20M10 17H20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
  wrap.appendChild(b);
  const m = document.createElement('div'); m.className = 'm-menu'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-label', 'תפריט');
  const ARROW = '<svg viewBox="0 0 12 8" fill="none"><path d="M11 4H1M4 1L1 4L4 7" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  m.innerHTML = '<div class="m-top"><span class="logo"></span><button class="m-close" type="button" aria-label="סגירת תפריט"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></div>'
    + '<nav>' + [...nav.querySelectorAll('a')].map((a, i) => `<a href="${a.getAttribute('href')}" class="${a.className}" style="--i:${i}">${a.textContent.trim()}${ARROW}</a>`).join('') + '</nav>'
    + '<div class="m-cta"><a class="btn-halo sky" href="#academy"><span>לכל הקורסים' + ARROW + '</span></a></div>';
  document.body.appendChild(m);
  const open = v => { m.classList.toggle('open', v); document.body.classList.toggle('menu-open', v); b.setAttribute('aria-expanded', v); };
  b.addEventListener('click', () => open(true));
  m.querySelector('.m-close').addEventListener('click', () => open(false));
  m.querySelectorAll('a').forEach(a => a.addEventListener('click', () => open(false)));
  addEventListener('keydown', e => { if (e.key === 'Escape') open(false); });

  // comparison table: swipe hint under the table, hidden once the visitor has scrolled it
  const ts = document.querySelector('.s-table .t-scroll');
  if (ts) { const h = document.createElement('div'); h.className = 't-hint'; h.innerHTML = '<svg viewBox="0 0 18 10" fill="none"><path d="M17 5H1M5 1L1 5L5 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>החליקו שמאלה לעוד נתונים';
    if (innerWidth <= 760) ts.after(h); ts.addEventListener('scroll', () => { if (Math.abs(ts.scrollLeft) > 30) h.style.opacity = 0; }, { passive: true }); h.style.transition = 'opacity .4s'; }

  // footer groups open and close on phones
  document.querySelectorAll('.s-footer__col h3').forEach(h => h.addEventListener('click', () => { if (innerWidth <= 760) h.parentElement.classList.toggle('open'); }));
})();
</script>

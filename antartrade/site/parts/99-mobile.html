@media (max-width: 760px) {
  /* ---------- header (after schooliner): round menu button at the right, the logo on its own next to it, courses as a pill at the left ---------- */

  .s-hero { padding: 118px 16px 100px !important; min-height: 0 !important; }

  .s-hero .s-hero__trader .in { translate: none !important; }
  .s-hero .s-hero__trader img { inset: 0; width: 100% !important; height: 100% !important; object-fit: cover; object-position: 72% 40%; filter: blur(1.2px); transform: scale(1.6); transform-origin: 72% 45%; }
  .s-hero .s-hero__trader::after { background: linear-gradient(180deg, rgba(18,22,31,.9) 0%, rgba(18,22,31,.72) 40%, rgba(18,22,31,.3) 72%, rgba(18,22,31,0) 100%) !important; }
  .s-hero .s-hero__glow { display: none; }
  .s-hero .s-hero__content { width: 100%; max-width: 100%; align-items: flex-start; text-align: right; margin: 0 auto; translate: none !important; gap: 22px; }
  .s-hero .s-hero__head + .s-hero__sub { margin-top: -10px; }
  .s-hero .s-hero__title { font-size: 28px; text-align: right; width: 100%; }
  .s-hero .s-hero__title .s-hero__l1 { font-size: 46px; line-height: 1; }
  .s-hero .s-hero__title .m-br { display: block; }
  .s-hero .s-hero__title .s-hero__l2 { font-size: 28px; line-height: 1.1; margin-top: 4px; }
  .s-hero .s-hero__sub { justify-content: flex-start; text-align: right; font-size: 16px; color: rgba(255,255,255,.88); }
  /* three equal tiles in one row (after schooliner): same width, label on two centred lines */
  .s-hero .s-hero__btns { display: grid !important; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; width: 100%; }
  .s-hero .s-hero__halo { padding: 5px; border-radius: 999px; min-width: 0; display: flex; }
  .s-hero .s-hero__halo-in { flex: 1; width: 100% !important; height: 46px !important; padding: 0 12px !important; border-radius: 999px; font-size: 16px !important; font-weight: 500; line-height: 1 !important; white-space: nowrap !important; text-align: center; gap: 0; }
  .s-hero .s-hero__halo-in img { display: none; }
  /* frames swapped: the outlined tiles take the full sky line, the search the softer one, so the buttons read first */
  .s-hero .s-hero__halo:not(.s-hero__halo--primary) .s-hero__halo-in { border-color: #61B1F2 !important; }
  .s-hero .s-hero__search { border-color: rgba(97,177,242,.5) !important; }
  .s-hero .s-hero__search { width: 100%; }
  /* hero photo options for review: ?mh=b|c|d (default = a) */

  .mh-d .s-hero .s-hero__trader img { transform: scale(1.3); transform-origin: 70% 45%; filter: blur(6px) saturate(1.2); opacity: .55; }
  .mh-d .s-hero .s-hero__trader::after { background: radial-gradient(70% 50% at 50% 85%, rgba(46,139,216,.35), transparent 70%), linear-gradient(180deg, rgba(18,22,31,.6), rgba(18,22,31,0)) !important; }
  /* ---------- hero, mobile layout after OpticOdds: short text on top, the trading screen below it in a tilted view, cut by the curve ---------- */
  .s-hero { padding: 92px 16px 222px !important; }
  /* the search field under the three tiles (it opens the bot); the hero gives back the room so the logos still show above the Safari bar */
  .s-hero .s-hero__search { position: relative; z-index: 2; height: 42px; margin-top: -12px !important; border-radius: 12px; background: rgba(255,255,255,.08) !important; -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3); }
  .s-hero .s-hero__trader { top: auto !important; bottom: 0 !important; height: 312px !important; left: 74px !important; right: 74px !important; overflow: hidden; }
  .s-hero .s-hero__trader .in { position: absolute; inset: 0; perspective: 900px; }
  html body .s-hero .s-hero__trader { opacity: .55 !important; }   /* phones: the trading screen behind the text a little quieter (was 1) */
  .s-hero .s-hero__trader img { inset: 0; width: 100% !important; height: 100% !important; object-fit: cover; object-position: 74% 38%; filter: none !important;
    transform: rotateX(16deg) rotateY(-14deg) rotateZ(-6deg) scale(1.55) !important; transform-origin: 70% 40% !important; border-radius: 18px; }
  .s-hero .s-hero__trader::after { background: linear-gradient(180deg, #12161f 0%, #12161f 6%, rgba(18,22,31,.55) 30%, rgba(18,22,31,0) 58%), linear-gradient(90deg, rgba(18,22,31,.55), rgba(18,22,31,0) 30%, rgba(18,22,31,0) 70%, rgba(18,22,31,.55)) !important; }
  /* logo carousel on iOS: a CSS mask on a moving track makes Safari drop the logos while scrolling; fade the edges with overlays instead and keep the track on its own layer */
  .s-logos .s-logos__carousel { -webkit-mask-image: none !important; mask-image: none !important; }
  .s-logos .s-logos__carousel::before, .s-logos .s-logos__carousel::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40px; z-index: 2; pointer-events: none; }

  .s-logos .s-logos__track { -webkit-backface-visibility: hidden; backface-visibility: hidden; transform: translate3d(0,0,0); animation-name: s-logos-loop-3d !important; }
  @keyframes s-logos-loop-3d { from { transform: translate3d(0,0,0); } to { transform: translate3d(-50%,0,0); } }
  .s-logos .s-logos__set { gap: 34px; padding-right: 34px; }

  .s-logos .lg-ic { width: 38px; height: 38px; }
  .s-logos .lg-nm { font-size: 13px; }
  .s-logos.drag .s-logos__track.row1 { animation: none !important; }   /* phones: the strip is moved by script, so a finger can drag it */
  .s-logos.drag .s-logos__carousel { touch-action: pan-y; cursor: grab; }
  /* logos: only the carousel, close under the hero so it shows before scrolling */
  .s-logos { padding: 12px 16px 40px !important; }
  .s-logos .s-logos__head { display: none; }
  .btn-halo.btn-halo > span { font-size: 18px; height: 46px; padding: 0 20px; }

  /* comparison: firm cards, styled in their own part */
  /* the firm column is not sticky: a copy of it sits beside the scroller and never moves (iOS blanks sticky cells while they scroll) */
  /* no white cover: the scroller itself is masked out under the column, so the card's own background shows through, and touches pass through the column to the scroller */
  /* swipe hint under the table */
  /* ---------- duel (after payless): two short cards side by side, the data in one shared list below, value against value ---------- */
  .s-duel__chips { gap: 8px; }
  .s-duel__chips-label { width: 100%; text-align: center; }

  html body .s-duel .s-duel__row > .s-duel__card { margin: 0 !important; }
  .s-duel .s-duel__vs-cell { height: auto !important; align-self: stretch !important; z-index: 3; }
  .s-duel .s-duel__vs { width: 36px; height: 36px; font-size: 12px; position: absolute; top: 50%; left: 50%; translate: -50% -50%; }   /* centred between the two cards, both ways */
  .s-duel .s-duel__card { padding: 18px 12px 14px; border-radius: 22px; gap: 10px; text-align: center; }

  .s-duel .s-duel__swapwrap .s-duel__menu { display: none !important; }   /* the firm list opens under the cards instead */

    const place = () => { const top = wrap.getBoundingClientRect().top; rows.forEach((r, i) => { const b = r.getBoundingClientRect(), s = cells[i].style; s.top = (b.top - top) + 'px'; s.height = b.height + 'px'; s.borderBottom = getComputedStyle(r).borderBottom; }); };
    place(); addEventListener('resize', place); addEventListener('load', place); if (document.fonts) document.fonts.ready.then(place);
  }

  // deals: the firm filter sits above the cards on phones
  const dTabs = document.getElementById('deal-tabs'), dFan = document.getElementById('fan');
  if (dTabs && dFan && innerWidth <= 760) { dFan.before(dTabs); dTabs.querySelectorAll('button').forEach(b => { b.textContent = b.textContent.replace(' Trading', ''); }); dispatchEvent(new Event('resize')); }

  // journal: the 300 x 210 mock is scaled to whatever width the stage has on this phone, with a margin for the moving parts
  const jStage = document.querySelector('.s-journal .stage');
  if (jStage) { const fit = () => { if (innerWidth <= 760) jStage.style.setProperty('--fit', Math.min((jStage.clientWidth - 28) / 300, (jStage.clientHeight - 28) / 210).toFixed(3)); }; fit(); addEventListener('resize', fit); }

  // comparison table: swipe hint under the table, hidden once the visitor has scrolled it
  const ts = document.querySelector('.s-table .t-scroll');
  if (ts) { const h = document.createElement('div'); h.className = 't-hint'; h.innerHTML = '<svg viewBox="0 0 18 10" fill="none"><path d="M17 5H1M5 1L1 5L5 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>החליקו שמאלה לעוד נתונים';
    if (innerWidth <= 760) ts.after(h); ts.addEventListener('scroll', () => { if (Math.abs(ts.scrollLeft) > 30) h.style.opacity = 0; }, { passive: true }); h.style.transition = 'opacity .4s'; }

  // logo strip: keeps gliding on its own, and a finger can drag it either way (with a little momentum on release)
  const lg = document.querySelector('.s-logos'), lc = lg && lg.querySelector('.s-logos__carousel'), lt = lg && lg.querySelector('.s-logos__track');
  if (lc && lt && innerWidth <= 760) {
    lg.classList.add('drag');
    const setW = () => lt.querySelector('.s-logos__set').offsetWidth;
    let x = 0, v = 0, drag = false, sx = 0, lastX = 0, lastT = 0, moved = 0, prev = performance.now();
    const auto = () => -setW() / 60000;   // calmer, one set a minute   // one set every 24s, leftwards like before
    (function tick(now) {
      const dt = Math.min(50, now - prev); prev = now;
      if (!drag) { v += (auto() - v) * .04; x += v * dt; }   // momentum eases back to the gliding speed
      const w = setW(); if (w) { while (x <= -w) x += w; while (x > 0) x -= w; }
      lt.style.transform = `translate3d(${x.toFixed(2)}px,0,0)`;
      requestAnimationFrame(tick);
    })(prev);
    lc.addEventListener('pointerdown', e => { drag = true; sx = lastX = e.clientX; lastT = performance.now(); moved = 0; lc.setPointerCapture(e.pointerId); });
    lc.addEventListener('pointermove', e => { if (!drag) return; const t = performance.now(), dx = e.clientX - lastX; x += dx; moved = Math.max(moved, Math.abs(e.clientX - sx));
      v = dx / Math.max(1, t - lastT); lastX = e.clientX; lastT = t; });
    const end = () => { drag = false; };
    lc.addEventListener('pointerup', end); lc.addEventListener('pointercancel', end);
    lc.addEventListener('click', e => { if (moved > 6) { e.preventDefault(); e.stopPropagation(); } }, true);   // a drag is not a tap on a logo
  }

  // footer groups open and close on phones
  document.querySelectorAll('.s-footer__col h3').forEach(h => h.addEventListener('click', () => { if (innerWidth <= 760) h.parentElement.classList.toggle('open'); }));
})();
</script>

<style>
  .s-academy { --navy: #12161f; --card: #0b0e14; --sky: #7dc6ff; --blue: #2e8bd8; --ice: #d6ecff; --mint: #3fd8c2; --ease: cubic-bezier(.22,.61,.36,1); }
  .s-academy * { box-sizing: border-box; margin: 0; padding: 0; }
  .s-academy { padding: 120px 16px 140px; background: var(--navy); }
  .s-academy .wrap { max-width: 1171px; margin: 0 auto; }
  .s-academy .head { text-align: center; }
  .s-academy .pill { display: inline-block; font-size: 13px; font-weight: 500; padding: 6px 14px; border-radius: 999px; background: rgba(125,198,255,.14); color: var(--sky); }
  .s-academy h2 { margin-top: 16px; font-size: 40px; font-weight: 500; line-height: 1.2; }
  .s-academy h2 b { font-weight: 500; color: var(--sky); }
  .s-academy .head p { margin-top: 12px; font-size: 20px; color: rgba(255,255,255,.6); }
  .s-academy 
  .tabs { margin: 40px auto 48px; width: max-content; max-width: 100%; display: flex; gap: 4px; padding: 5px; border-radius: 999px; background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); position: relative; }
  .s-academy .tabs button { position: relative; z-index: 1; border: 0; background: none; font: 500 15px "Fb Reforma", sans-serif; color: rgba(255,255,255,.6); padding: 10px 22px; border-radius: 999px; cursor: pointer; transition: color .3s; }
  .s-academy .tabs button.on { color: var(--navy); }
  .s-academy .tabs .ind { position: absolute; top: 5px; bottom: 5px; border-radius: 999px; background: var(--sky); transition: all .45s var(--ease); }
  .s-academy .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; align-items: stretch; }
  .s-academy .grid.four { grid-template-columns: repeat(4, 1fr); }
  .s-academy .grid.fade { animation: in .5s var(--ease); }
@keyframes in { from { opacity: 0; transform: translateY(12px); } }
  .s-academy 
  .card { position: relative; border-radius: 24px; text-decoration: none; color: inherit; display: flex; flex-direction: column; isolation: isolate;
    background: radial-gradient(90% 70% at 0% 100%, rgba(46,139,216,.22), transparent 60%), var(--card);
    box-shadow: inset 0 0 0 1px rgba(125,198,255,.12); transition: transform .5s var(--ease), box-shadow .5s var(--ease); }
  .s-academy 
  .card::before, .s-academy .card::after { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0; }
  .s-academy .card::before { z-index: 3; background: conic-gradient(from var(--a), transparent 0deg, var(--sky) 40deg, var(--blue) 100deg, transparent 150deg 360deg); transition: opacity .3s; }
  .s-academy .card::after { z-index: 2; background: linear-gradient(135deg, var(--blue), var(--sky) 50%, rgba(214,236,255,.6)); transition: opacity .4s .7s; }
  .s-academy .card:hover::before { opacity: 1; animation: ring 1.1s var(--ease) forwards; }
  .s-academy .card:hover::after { opacity: 1; }
@keyframes ring { from { --a: 0deg; } to { --a: 360deg; } }
  .s-academy .card:hover { transform: translateY(-6px); box-shadow: inset 0 0 0 1px rgba(125,198,255,0), 0 30px 60px -24px rgba(46,139,216,.25); }
  .s-academy 
  .media { position: relative; margin: 8px 8px 0; border-radius: 18px; overflow: hidden; background: #000; }
  .s-academy .course .media { aspect-ratio: 4 / 3; }
  .s-academy .video .media { aspect-ratio: 16 / 9; }
  .s-academy .article .media { aspect-ratio: 1920 / 1008; }
  .s-academy .media img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .8s var(--ease); }
  .s-academy .card:hover .media img { transform: scale(1.05); }
  .s-academy .veil { position: absolute; inset: 0; background: radial-gradient(70% 60% at 0% 100%, rgba(46,139,216,.6), transparent 70%), linear-gradient(0deg, rgba(11,14,20,.85), rgba(11,14,20,0) 60%);
    opacity: 0; transform: translateY(18%); transition: opacity .5s var(--ease), transform .6s var(--ease); }
  .s-academy .card:hover .veil { opacity: 1; transform: none; }
  .s-academy .go { position: absolute; left: 14px; bottom: 14px; display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 999px; background: #fff; color: var(--navy);
    font: 500 14px "Fb Reforma", sans-serif; opacity: 0; transform: translateY(10px); transition: opacity .4s .12s var(--ease), transform .5s .12s var(--ease); }
  .s-academy .go svg { width: 14px; height: 14px; transition: transform .4s var(--ease); }
  .s-academy .card:hover .go { opacity: 1; transform: none; }
  .s-academy .card:hover .go svg { transform: translateX(-4px); }
  .s-academy .dur { position: absolute; right: 12px; top: 12px; font: 500 12px "Roboto", sans-serif; color: #fff; background: rgba(11,14,20,.75); padding: 5px 10px; border-radius: 999px; }
  .s-academy .body { padding: 16px 20px 22px; display: grid; gap: 8px; }
  .s-academy .tag { justify-self: start; font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px; background: rgba(125,198,255,.14); color: var(--sky); }
  .s-academy .tag.free { background: rgba(63,216,194,.14); color: var(--mint); }
  .s-academy .tag.paid { background: rgba(255,255,255,.1); color: #fff; }
  .s-academy .card h3 { font-size: 19px; font-weight: 500; line-height: 1.35; }
  .s-academy .card p { font-size: 14px; line-height: 1.55; color: rgba(255,255,255,.62); }
  .s-academy 
  .card.flag::after { opacity: 1; transition: none; }
  .s-academy 
  .all { justify-content: center; align-items: center; text-align: center; gap: 10px; padding: 32px 20px; align-self: stretch;
    background: radial-gradient(80% 70% at 50% 100%, rgba(46,139,216,.3), transparent 70%), var(--card); }
  .s-academy .all .n { font: 700 54px "Roboto", sans-serif; color: var(--sky); line-height: 1; }
  .s-academy .all .t { font-size: 18px; font-weight: 500; }
  .s-academy .all .arrow { margin-top: 8px; width: 44px; height: 44px; border-radius: 50%; background: #fff; color: var(--navy); display: grid; place-items: center; transition: transform .4s var(--ease); }
  .s-academy .all .arrow svg { width: 16px; height: 16px; }
  .s-academy .all:hover .arrow { transform: translateX(-6px); }
  .s-academy .more { margin-top: 48px; text-align: center; }
  .s-academy .halo { display: inline-block; padding: 6px; border-radius: 999px; background: rgba(85,169,235,.05); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  .s-academy .halo a { display: inline-flex; align-items: center; gap: 8px; height: 50px; padding: 0 26px; border-radius: 999px; background: linear-gradient(180deg, #a8d8ff, var(--sky)); color: var(--navy); text-decoration: none; font: 500 18px "Fb Reforma", sans-serif; }
@media (max-width: 980px) {  .s-academy .grid, .s-academy .grid.four { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 620px) {  .s-academy .grid, .s-academy .grid.four { grid-template-columns: 1fr; }
  .s-academy h2 { font-size: 32px; }
  .s-academy .tabs button { padding: 10px 14px; }
}
@media (prefers-reduced-motion: reduce) {  .s-academy .card, .s-academy .card *, .s-academy .card::before, .s-academy .card::after, .s-academy .grid { transition: none !important; animation: none !important; }
}
  .s-academy { color: #fff; }
  .s-academy .body { padding: 16px 12px 14px 12px; }
  .s-academy .tag { font-size: 13px; }
  .s-academy .card h3 { font-size: 28px; line-height: 1.2; }
  .s-academy .card p { font-size: 20px; line-height: 1.2; }
@media (max-width: 620px) {  .s-academy .card h3 { font-size: 22px; }
  .s-academy .card p { font-size: 16px; }
}
  .s-academy .tabs { padding: 0; gap: 0; background: rgba(255,255,255,.05); box-shadow: none; margin: 40px auto 48px; }
  .s-academy .tabs button { width: 132px; height: 40px; padding: 0; font: 400 14px "Fb Reforma", sans-serif; color: #fff; }
  .s-academy .tabs button.on { color: #12161f; font-weight: 500; }
  .s-academy .tabs .ind { top: 0; bottom: 0; background: #fff; }
  .s-academy h2 { font-size: 45px; line-height: 53px; }
  .s-academy h2 b { background: linear-gradient(90deg, #61b1f2, #d6ecff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .s-academy .head p { opacity: 1; color: rgba(255,255,255,.7); }
@media (max-width: 620px) {  .s-academy .tabs button { width: 84px; }
  .s-academy h2 { font-size: 34px; line-height: 1.15; }
}
  /* cards: 20px padding all round, the image sits inside it */
  .s-academy .card { padding: 28px; }
  .s-academy .media { margin: 0; }
  .s-academy .body { padding: 20px 0 0; }
</style>
<section class="s-academy" id="academy" data-theme="dark">
  <div class="wrap">
    <div class="head" data-reveal>
      <span class="pill">האקדמיה של AntarTrade</span>
      <h2 class="split g-title g-center">טעימה מהאקדמיה</h2>
      <p>קורסים, סרטונים ומדריכים - כל מה שצריך כדי לסחור חכם יותר.</p>
    </div>
    <div class="tabs" id="ac-tabs">
      <span class="ind"></span>
      <button class="on" data-f="pick">נבחרים</button>
      <button data-f="course">קורסים</button>
      <button data-f="video">סרטונים</button>
      <button data-f="article">מאמרים</button>
    </div>
    <div class="grid" id="ac-grid"></div>
    <div class="more"><a class="btn-halo sky" href="#"><span>לכל האקדמיה<svg viewBox="0 0 12 8" fill="none" aria-hidden="true"><path d="M11 4H1M4 1L1 4L4 7" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a></div>
  </div>
</section>
<script>(function(){
  const ARROW = '<svg viewBox="0 0 14 14" fill="none"><path d="M12 7H2M6 3L2 7L6 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  // site hierarchy: flagship course > free courses > paid course > videos > articles
  const C = [
    { t: 'course', img: 'full.webp', tag: ['paid', 'הקורס המלא'], h: 'המסלול המלא למסחר בחוזים עתידיים', p: 'מהיסודות ועד לתכנים המתקדמים של קורס Order Flow.', flag: 1 },
    { t: 'course', img: 'nostro.webp', tag: ['free', 'חינם'], h: 'קורס הנוסטרו החינמי', p: 'מה זה מסחר ממומן, איך עובדים המבחנים והחשבונות.' },
    { t: 'course', img: 'intro.webp', tag: ['free', 'חינם'], h: 'קורס המבוא החינמי', p: 'יסודות שוק ההון, פקודות מסחר ונרות יפנים.' },
    { t: 'course', img: 'orderflow.webp', tag: ['paid', 'בתשלום'], h: 'קורס Order Flow', p: 'קריאת זרימת פקודות ועומק שוק לסוחרים מנוסים.' },
  ];
  const V = [
    { t: 'video', img: 'v-apex.jpg', dur: '35 דק׳', h: 'מדריך לאפקס - איך קונים ומתקינים' },
    { t: 'video', img: 'v-tp.jpg', dur: '25 דק׳', h: 'מדריך לחוקים של טייק פרופיט' },
    { t: 'video', img: 'v-topstep.jpg', dur: '20 דק׳', h: 'מדריך לטופסטפ - TopStep' },
    { t: 'video', img: 'v-ninja.jpg', dur: '25 דק׳', h: 'מדריך לתוכנת המסחר נינג׳ה טריידר' },
    { t: 'video', img: 'v-replikanto.jpg', dur: '20 דק׳', h: 'מדריך לקופי טריידינג - Replikanto' },
  ];
  const A = [
    { t: 'article', img: 'a-footprint.jpg', h: 'מה זה פוטפרינט? המדריך המלא' },
    { t: 'article', img: 'a-apex.jpg', h: 'המדריך המלא לאפקס טריידר פאנדינג' },
    { t: 'article', img: 'a-topstep.jpg', h: 'Topstep - המדריך המלא לטופסטפ' },
    { t: 'article', img: 'a-tradovate.jpg', h: 'סטופ יומי וניהול סיכונים ב-Tradovate' },
    { t: 'article', img: 'a-rithmic.jpg', h: 'המדריך המלא להגדרת סטופ יומי ב-Rithmic' },
  ];
  // totals on the live site, so the closing tile tells the truth (update when content grows)
  const TOTAL = { video: 20, article: 7, academy: 31 };
  const LABEL = { video: ['סרטון', 'לצפייה', 'סרטונים נוספים בספריית הווידאו'], article: ['מאמר', 'לקריאה', 'מאמרים נוספים'], course: ['', 'לעמוד הקורס'] };
  const card = d => `<a class="card ${d.t}${d.flag ? ' flag' : ''}" href="#"><div class="media"><img src="img/${d.img}" alt="">${d.dur ? `<span class="dur">${d.dur}</span>` : ''}<span class="veil"></span><span class="go">${LABEL[d.t][1]} ${ARROW}</span></div>
    <div class="body"><span class="tag ${d.tag ? d.tag[0] : ''}">${d.tag ? d.tag[1] : LABEL[d.t][0]}</span><h3>${d.h}</h3>${d.p ? `<p>${d.p}</p>` : ''}</div></a>`;
  const tile = (n, t) => `<a class="card all" href="#"><span class="n">+${n}</span><span class="t">${t}</span><span class="arrow">${ARROW}</span></a>`;
  const VIEWS = {
    // curated pick: a row of courses (4:3), then a video and an article (both wide) and the way into the library
    pick: { cls: '', html: () => C.slice(0, 3).map(card).join('') + card(V[0]) + card(V[1]) + card(A[0]) },
    course: { cls: 'four', html: () => C.map(card).join('') },
    video: { cls: '', html: () => V.map(card).join('') + tile(TOTAL.video - V.length, LABEL.video[2]) },
    article: { cls: '', html: () => A.map(card).join('') + tile(TOTAL.article - A.length, LABEL.article[2]) },
  };
  const grid = document.getElementById('ac-grid'), tabs = document.getElementById('ac-tabs'), ind = tabs.querySelector('.ind');
  function show(f) { grid.className = 'grid fade ' + VIEWS[f].cls; grid.innerHTML = VIEWS[f].html(); }
  function place(b) { ind.style.right = 'auto'; ind.style.left = b.offsetLeft + 'px'; ind.style.width = b.offsetWidth + 'px'; }   // the base rule pins it right; clear that so left can move it
  function pick(b) { tabs.querySelector('.on').classList.remove('on'); b.classList.add('on'); place(b); show(b.dataset.f); }
  tabs.querySelectorAll('button').forEach(b => b.onclick = () => pick(b));
  // ?tab=video opens a tab directly (used for checking)
  pick(tabs.querySelector(`[data-f="${new URLSearchParams(location.search).get('actab') || 'pick'}"]`) || tabs.querySelector('.on'));
  addEventListener('load', () => place(tabs.querySelector('.on')));
})();</script>

<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>דו קרב חברות מימון · AntarTrade</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: "Reforma"; font-weight: 400; src: url("fonts/FbReforma-Regular.woff2") format("woff2"), local("FbReforma-Regular"); }
  @font-face { font-family: "Reforma"; font-weight: 500; src: url("fonts/FbReforma-Medium.woff2") format("woff2"), local("FbReforma-Medium"); }
  :root { --A: #7dc6ff; --B: #e9f4ff; --ease: cubic-bezier(.2,.7,.2,1); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  html, body { background: #0b0e14; color: #fff; font-family: "Reforma", "Roboto", sans-serif; -webkit-font-smoothing: antialiased; }
  .lat { font-family: "Roboto", sans-serif; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  .hdr { position: absolute; inset: 0 0 auto 0; z-index: 30; }
  .hdr .wrap { max-width: 1460px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 40px; }
  .hdr .logo { width: 195px; height: 51px; background: url("logo-white.png") right center / contain no-repeat; }
  .hdr nav { display: flex; gap: 25px; font-size: 18px; } .hdr nav a { padding: 10px; color: #fff; text-decoration: none; }
  .hdr .halo { padding: 6px; border-radius: 999px; background: rgba(85,169,235,.05); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  .hdr .halo a { display: inline-flex; align-items: center; height: 50px; padding: 0 25px; border-radius: 90px; background: #fff; color: #000; font-weight: 500; font-size: 20px; text-decoration: none; }

  .hero { position: relative; isolation: isolate; padding: 128px 0 64px; }
  .grid { position: absolute; inset: 0; z-index: -2; overflow: hidden; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 72px 72px;
    -webkit-mask-image: radial-gradient(80% 70% at 50% 60%, #000 30%, transparent 85%); mask-image: radial-gradient(80% 70% at 50% 60%, #000 30%, transparent 85%); }
  .head { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
  .pill { padding: 6px 14px; border-radius: 999px; background: rgba(125,198,255,.12); color: var(--A); font-size: 16px; font-weight: 500; }
  .head h1 { font-size: 64px; font-weight: 500; line-height: 1.05; background: linear-gradient(90deg, #61b1f2 0%, #fff 78%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .head p { font-size: 20px; color: rgba(255,255,255,.6); }
  .pop { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-size: 15px; color: rgba(255,255,255,.5); }
  .pop button { height: 32px; padding: 0 14px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.06); font-family: "Roboto"; font-weight: 500; font-size: 14px; direction: ltr; }
  .pop button:hover { background: rgba(255,255,255,.1); }
  .pop button i { font-style: normal; color: var(--A); font-size: 12px; }

  /* ---------- the arena: two full contender cards, the score between them ---------- */
  .arena { position: relative; width: min(1200px, calc(100% - 48px)); margin: 54px auto 0; display: grid; grid-template-columns: 1fr 300px 1fr; align-items: stretch; }
  .card { position: relative; z-index: 2; padding: 22px 24px 20px; border-radius: 24px; display: flex; flex-direction: column; gap: 14px;
    background: radial-gradient(70% 60% at 100% 0, rgba(46,139,216,.2), rgba(46,139,216,0) 70%), #0b0e14; box-shadow: inset 0 0 0 1px rgba(125,198,255,.14), 0 30px 60px rgba(0,0,0,.45); transition: box-shadow .8s ease; }
  /* the winner: the highlighted level (gradient frame and glow), a tag on its top edge with a passing shine */
  /* winner, as in the homepage duel (gold there, the site's orchid pink here): a gradient frame, a warm corner light and a light badge on the top edge */
  .card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 2px; pointer-events: none; opacity: 0; transition: opacity .6s ease;
    background: linear-gradient(225deg, #9b45d6 0%, #d17bff 50%, #f3dcff 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  .card.win { background: radial-gradient(55% 55% at 100% 0, rgba(243,220,255,.2), rgba(243,220,255,0)), radial-gradient(70% 70% at 0 100%, rgba(209,123,255,.42), rgba(209,123,255,.16) 40%, rgba(209,123,255,0)), #0b0e14;
    box-shadow: 0 20px 60px rgba(209,123,255,.18), 0 30px 60px rgba(0,0,0,.45); }
  .card.win::before { opacity: 1; }
  .card .glowbg { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none; opacity: 0; transition: opacity .6s ease;
    background: radial-gradient(55% 55% at 100% 0, rgba(243,220,255,.16), rgba(243,220,255,0)), radial-gradient(70% 70% at 0 100%, rgba(209,123,255,.24), rgba(209,123,255,.08) 40%, rgba(209,123,255,0)); }
  .card.win .glowbg { opacity: 0; }
  .card.win .side, .card.b.win .side { background: rgba(209,123,255,.2); color: #ecc8ff; }
  .wtag { position: absolute; z-index: 3; top: -15px; left: 50%; translate: -50% 0; display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; white-space: nowrap;
    font: 500 16px/1.2 "Reforma", "Roboto", sans-serif; color: #4f1773; background: linear-gradient(180deg, #f6e4ff, #e3b5fb); box-shadow: 0 8px 20px -6px rgba(209,123,255,.6);
    opacity: 0; scale: .9; transition: opacity .4s, scale .4s; }
  .card.win .wtag { opacity: 1; scale: 1; }
  .wtag svg { width: 14px; height: 14px; flex: none; }

  .top { position: relative; display: flex; align-items: center; justify-content: space-between; }
  .side { height: 28px; padding: 0 12px; border-radius: 999px; display: inline-flex; align-items: center; font-size: 14px; font-weight: 500; background: rgba(125,198,255,.12); color: var(--A); }
  .card.b .side { background: rgba(255,255,255,.08); color: rgba(255,255,255,.85); }
  .swap { height: 32px; padding: 0 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.07); font-size: 14px; font-weight: 500; }
  .swap svg, .copy svg, .plain svg { width: 14px; height: 14px; }
  .who { position: relative; display: flex; align-items: center; gap: 14px; }
  .who img { width: 56px; height: 56px; object-fit: contain; filter: drop-shadow(0 10px 18px rgba(0,0,0,.45)); }
  .who b { font: 600 26px/1.1 "Roboto", sans-serif; }

  /* the plan dropdown in the site's language: a capsule that opens a dark list, the chosen option as the light pill */
  .dd { position: relative; }
  .dd-btn { width: 100%; height: 46px; padding: 0 16px; border-radius: 15px; background: rgba(255,255,255,.05); display: flex; align-items: center; gap: 10px; text-align: right; transition: background .2s; }
  .dd-btn:hover, .dd.open .dd-btn { background: rgba(255,255,255,.08); }
  .dd-btn span { font-size: 14px; color: rgba(255,255,255,.5); }
  .dd-btn b { flex: 1; font: 500 16px "Reforma", "Roboto"; }
  .dd-btn svg { width: 12px; height: 12px; opacity: .75; transition: transform .25s ease; }
  .dd.open .dd-btn svg { transform: rotate(180deg); }
  .dd-menu { position: absolute; z-index: 25; top: calc(100% + 6px); inset-inline: 0; padding: 6px; border-radius: 18px; display: flex; flex-direction: column; gap: 4px;
    background: #0b0e14; box-shadow: inset 0 0 0 1px rgba(125,198,255,.2), 0 30px 60px rgba(0,0,0,.6); opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity .2s, transform .25s var(--ease); }
  .dd.open .dd-menu { opacity: 1; transform: none; pointer-events: auto; }
  .dd-menu button { height: 42px; padding: 0 14px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; font: 500 15px "Reforma", "Roboto"; color: rgba(255,255,255,.8); text-align: right; }
  .dd-menu button:hover { background: rgba(255,255,255,.06); }
  .dd-menu button[aria-selected="true"] { background: #e8e8ed; color: #12161f; }
  .dd-menu button svg { width: 16px; height: 16px; }

  .seg { display: flex; padding: 4px; border-radius: 999px; background: rgba(255,255,255,.07); direction: ltr; }
  .seg button { flex: 1; height: 36px; border-radius: 999px; font: 500 14px "Roboto"; color: rgba(255,255,255,.72); transition: background .2s, color .2s; }
  .seg button[aria-pressed="true"] { background: #e8e8ed; color: #12161f; }
  .seg.he { direction: rtl; } .seg.he button { font-family: "Reforma"; font-size: 14px; }
  .lbl { font-size: 13px; color: rgba(255,255,255,.5); }
  .price { display: flex; flex-direction: column; gap: 2px; }
  .price .from { font-size: 13px; color: rgba(255,255,255,.5); }
  .price .row { display: flex; align-items: baseline; gap: 10px; }
  .price .now { font: 700 44px/1 "Roboto", sans-serif; direction: ltr; }
  .price .was { font: 400 16px "Roboto"; color: rgba(255,255,255,.4); text-decoration: line-through; direction: ltr; }
  .price .per { font-size: 14px; color: rgba(255,255,255,.55); }
  /* coupon row: even air on both ends, the code right after its label, the copy button at the far end */
  .code { height: 52px; padding: 0 18px 0 6px; border-radius: 999px; background: rgba(255,255,255,.05); display: flex; align-items: center; gap: 12px; }
  .code span { font-size: 14px; color: rgba(255,255,255,.55); }
  .code b { font: 600 17px "Roboto"; letter-spacing: 1.5px; color: var(--A); }
  .copy { margin-inline-start: auto; height: 40px; padding: 0 16px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; background: #eef1f5; color: #12161f; font-size: 15px; font-weight: 500; }
  .face { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .face.back { display: none; height: 100%; overflow: auto; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.2) transparent; }
  .card.flipped .front { display: none; } .card.flipped .back { display: flex; }
  .card.turning { animation: turn .52s cubic-bezier(.45,0,.2,1); }
  @keyframes turn { 45%, 55% { transform: perspective(1400px) rotateY(88deg); } }
  .bt { font-size: 20px; font-weight: 500; }
  .facts { list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .facts li { display: flex; align-items: flex-start; gap: 10px; font-size: 15px; line-height: 1.45; color: rgba(255,255,255,.85); }
  .facts li svg { width: 18px; height: 18px; flex: none; margin-top: 1px; color: var(--A); }
  .facts li.div { margin: 4px 0 2px; font-size: 13px; color: var(--A); font-weight: 500; }
  .facts li.div span { padding: 3px 12px; border-radius: 999px; background: rgba(125,198,255,.12); }
  .sh { font-size: 14px; font-weight: 500; color: rgba(255,255,255,.55); margin-top: 4px; }
  .steps { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .steps li { display: flex; align-items: flex-start; gap: 10px; font-size: 15px; line-height: 1.4; color: rgba(255,255,255,.85); }
  .steps li b { width: 24px; height: 24px; flex: none; border-radius: 50%; background: #fff; color: #12161f; display: grid; place-items: center; font-size: 13px; font-weight: 600; }
  .bn { font-size: 13px; line-height: 1.5; color: rgba(255,255,255,.5); }
  .bfoot { position: sticky; bottom: -1px; margin-top: auto; padding: 22px 0 2px; background: linear-gradient(rgba(11,14,20,0), #0b0e14 45%); }
  .plain { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: var(--A); }

  /* score between the cards */
  .mid { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .sc { display: flex; align-items: center; gap: 18px; direction: ltr; }
  .digits { display: inline-block; font: 700 104px/1 "Roboto", sans-serif; font-variant-numeric: tabular-nums; }
  .digits { color: #fff; transition: color .5s, text-shadow .5s; }
  .digits.lead { color: #d17bff; text-shadow: 0 0 40px rgba(209,123,255,.45); }
  .vs { width: 42px; height: 42px; display: grid; place-items: center; transform: rotate(45deg); border-radius: 10px; background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
  .vs span { transform: rotate(-45deg); font: 600 13px "Roboto"; color: rgba(255,255,255,.8); }

  /* ---------- the meeting moment ---------- */
  .fx { position: absolute; inset: -80px -40px; z-index: 4; pointer-events: none; width: calc(100% + 80px); height: calc(100% + 160px); }
  .flashbar { position: absolute; left: 50%; top: 50%; width: 4px; height: 0; transform: translate(-50%, -50%); background: #fff; box-shadow: 0 0 40px 12px rgba(190,228,255,.95); opacity: 0; z-index: 5; pointer-events: none; }
  .ringfx { position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; box-shadow: 0 0 0 3px rgba(190,228,255,.8), 0 0 40px rgba(125,198,255,.6); opacity: 0; z-index: 5; pointer-events: none; }
  .whiteout { position: fixed; inset: 0; z-index: 40; background: radial-gradient(60% 60% at 50% 55%, rgba(230,244,255,.5), rgba(125,198,255,.12) 50%, transparent 80%); opacity: 0; pointer-events: none; }
  .impact .flashbar { animation: bar .75s ease-out both; }
  @keyframes bar { 0% { height: 0; opacity: 1; } 25% { height: 520px; opacity: 1; } 100% { height: 600px; opacity: 0; } }
  .impact .ringfx { animation: ring 1s cubic-bezier(.1,.6,.3,1) both; }
  @keyframes ring { 0% { transform: scale(.3); opacity: 1; } 100% { transform: scale(11); opacity: 0; } }
  .impact ~ .whiteout, .whiteout.on { animation: wo .45s ease-out both; }
  @keyframes wo { 0% { opacity: 1; } 100% { opacity: 0; } }
  .impact { animation: shake .4s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes shake { 15% { transform: translate(-6px, 2px) rotate(-.3deg); } 30% { transform: translate(5px, -2px) rotate(.3deg); } 50% { transform: translate(-3px, 1px); } 70% { transform: translate(2px, -1px); } }
  /* arrival: the cards rush in with motion blur, their facing edges trailing light */
  .arena.first .card.a { animation: inA 1.2s var(--ease) both; } .arena.first .card.b { animation: inB 1.2s var(--ease) both; }
  @keyframes inA { 0% { transform: translateX(760px) skewX(-10deg); filter: blur(8px); opacity: 0; } 34% { transform: translateX(-152px) skewX(0); filter: blur(0); opacity: 1; }
    42% { transform: translateX(-140px) scaleX(.97); } 100% { transform: none; } }
  @keyframes inB { 0% { transform: translateX(-760px) skewX(10deg); filter: blur(8px); opacity: 0; } 34% { transform: translateX(152px) skewX(0); filter: blur(0); opacity: 1; }
    42% { transform: translateX(140px) scaleX(.97); } 100% { transform: none; } }
  /* a new contender: both draw back, then slam */
  .arena.meet .card.a { animation: hitA 1.25s var(--ease) both; } .arena.meet .card.b { animation: hitB 1.25s var(--ease) both; }
  @keyframes hitA { 0% { transform: none; } 30% { transform: translateX(50px) scale(.98); } 46% { transform: translateX(-152px); } 54% { transform: translateX(-140px) scaleX(.97); } 100% { transform: none; } }
  @keyframes hitB { 0% { transform: none; } 30% { transform: translateX(-50px) scale(.98); } 46% { transform: translateX(152px); } 54% { transform: translateX(140px) scaleX(.97); } 100% { transform: none; } }
  .card .trail { position: absolute; top: 10%; bottom: 10%; width: 120px; pointer-events: none; opacity: 0; }
  .card.a .trail { left: -2px; background: linear-gradient(270deg, rgba(125,198,255,0), rgba(125,198,255,.0) 20%, rgba(190,228,255,.55)); filter: blur(6px); }
  .card.b .trail { right: -2px; background: linear-gradient(90deg, rgba(233,244,255,0), rgba(233,244,255,0) 20%, rgba(233,244,255,.5)); filter: blur(6px); }
  .arena.first .card .trail { animation: trail .55s ease-out both; } .arena.meet .card .trail { animation: trail .5s ease-out .3s both; }
  @keyframes trail { 0% { opacity: 1; } 100% { opacity: 0; } }
  /* the score slams down after the hit */
  .mid .sc, .mid .vs { transition: none; }
  .slam .digits { animation: slam .55s cubic-bezier(.2,1.6,.4,1) both; }
  .slam .digits.da { animation-delay: .08s; }
  @keyframes slam { 0% { transform: scale(2.2); filter: blur(10px); opacity: 0; } 60% { filter: blur(0); opacity: 1; } 100% { transform: none; } }
  .slam .vs { animation: spin .6s var(--ease) both; }
  @keyframes spin { from { transform: rotate(-135deg) scale(.4); opacity: 0; } to { transform: rotate(45deg); opacity: 1; } }

  /* picker under the card that opened it; the close button on the side of the button that opened it */
  .pick { position: absolute; z-index: 20; top: 64px; inset-inline: 0; padding: 18px; border-radius: 20px; display: flex; flex-direction: column; gap: 12px;
    background: #0b0e14; box-shadow: inset 0 0 0 1px rgba(125,198,255,.22), 0 40px 90px rgba(0,0,0,.6); }
  .pick[hidden] { display: none; }
  .pick .ph { display: flex; align-items: center; gap: 10px; } .pick .ph h3 { flex: 1; font-size: 16px; font-weight: 500; }
  .pick .x { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); } .pick .x svg { width: 12px; height: 12px; }
  .firms { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .fchip { height: 46px; padding: 0 12px; border-radius: 15px; display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.05); font: 500 15px "Roboto"; text-align: right; transition: background .2s; }
  .fchip img { width: 26px; height: 26px; object-fit: contain; }
  .fchip:hover { background: rgba(255,255,255,.09); } .fchip[aria-pressed="true"] { background: #e8e8ed; color: #12161f; } .fchip:disabled { opacity: .35; cursor: default; }

  /* rounds: shortcuts into the full table */
  .rounds { width: min(1200px, calc(100% - 48px)); margin: 26px auto 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .rd { padding: 12px 10px; border-radius: 15px; background: rgba(255,255,255,.05); text-align: center; display: flex; flex-direction: column; gap: 4px; position: relative; overflow: hidden; color: inherit; text-decoration: none; transition: background .2s, transform .2s; }
  .rd:hover { background: rgba(255,255,255,.09); transform: translateY(-2px); }
  .rd small { font-size: 12px; color: rgba(255,255,255,.5); } .rd strong { font-size: 16px; font-weight: 500; } .rd .s { font: 600 17px "Roboto"; direction: ltr; }
  .rd .go { font-size: 12px; color: var(--A); }
  .rd::after { content: ""; position: absolute; inset: auto 0 0 0; height: 3px; }
  .rd::after { background: var(--bar); }

  /* ---------- the full table (light section, the homepage light language) ---------- */
  .full { background: #fff; color: #12161f; padding: 96px 0 120px; margin-top: 72px; }
  .full .w { width: min(1080px, calc(100% - 48px)); margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .fhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 10px; }
  .fhead .t { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
  .lpill { padding: 6px 14px; border-radius: 999px; background: rgba(97,177,242,.14); color: #2e8bd8; font-size: 15px; font-weight: 500; }
  .full h2 { font-size: 44px; font-weight: 500; line-height: 1.15; color: #12161f; }
  .full .sub { font-size: 18px; color: rgba(18,22,31,.7); }
  .tgl { display: flex; padding: 4px; border-radius: 999px; background: #f3f7fb; }
  .tgl button { height: 40px; padding: 0 18px; border-radius: 999px; font-size: 15px; color: rgba(18,22,31,.7); }
  .tgl button.on { background: #12161f; color: #fff; font-weight: 500; }
  .vsbar { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: 1fr 160px 1fr; align-items: center; padding: 12px 26px; border-radius: 15px; background: rgba(243,247,251,.94); backdrop-filter: blur(10px); }
  .vsbar .f { display: flex; align-items: center; gap: 10px; font: 600 16px "Roboto"; }
  .vsbar .f img { width: 30px; height: 30px; object-fit: contain; }
  .vsbar .f small { font: 500 14px "Roboto"; color: rgba(18,22,31,.55); }
  .vsbar .f.b { flex-direction: row-reverse; justify-self: end; }
  .vsbar .m { text-align: center; font-size: 14px; color: rgba(18,22,31,.55); }
  .grp { scroll-margin-top: 80px; border-radius: 24px; padding: 6px 26px 10px; position: relative;
    background: radial-gradient(55% 55% at 100% 0, rgba(214,236,255,.55) 0%, rgba(214,236,255,0) 100%), radial-gradient(70% 70% at 0 100%, rgba(97,177,242,.4) 0%, rgba(125,198,255,.15) 40%, rgba(214,236,255,0) 100%), #fff;
    box-shadow: 0 24px 60px rgba(85,169,235,.09); transition: box-shadow .6s; }
  .grp::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; background: linear-gradient(45deg, #2e8bd8 0%, #7dc6ff 50%, #d6ecff 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  .grp.hit { box-shadow: 0 0 0 3px rgba(46,139,216,.35), 0 24px 60px rgba(85,169,235,.2); }
  .gh { display: grid; grid-template-columns: 1fr 160px 1fr; align-items: center; padding: 16px 0 10px; }
  .gh .n { font: 500 14px "Roboto"; color: rgba(18,22,31,.55); } .gh .n.b { text-align: left; }
  .gh h3 { text-align: center; font-size: 22px; font-weight: 500; }
  .gh h3 small { display: block; margin-top: 2px; font: 600 14px "Roboto"; color: rgba(18,22,31,.55); direction: ltr; }
  .r { display: grid; grid-template-columns: 1fr 160px 1fr; align-items: center; gap: 12px; padding: 13px 0; border-top: 1px solid #eaf2fa; }
  .r .k { text-align: center; font-size: 15px; color: rgba(18,22,31,.55); }
  .r .v { display: flex; flex-direction: column; gap: 4px; }
  .r .v.b { align-items: flex-end; text-align: left; }
  .r .val { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 500; color: #12161f; }
  .r .val .lat { font-weight: 600; }
  .r .note { font-size: 13px; line-height: 1.45; color: rgba(18,22,31,.55); max-width: 380px; }
  .adv { flex: none; font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 999px; background: rgba(97,177,242,.14); color: #2e8bd8; }
  .r.same { display: none; } .showall .r.same { display: grid; }
  #groups { display: flex; flex-direction: column; gap: 16px; }
  .nodata { padding: 40px; border-radius: 24px; background: #f3f7fb; text-align: center; color: rgba(18,22,31,.7); font-size: 17px; }

  /* ---------- other entrances (chosen in the switcher at the bottom) ---------- */
  .fxel { position: absolute; pointer-events: none; opacity: 0; z-index: 4; }
  /* 2. seam reveal: a line of light opens the arena from the middle out */
  .seamline { left: 50%; top: -30px; bottom: -30px; width: 3px; margin-left: -1.5px; background: linear-gradient(180deg, transparent, #fff 20%, #fff 80%, transparent); box-shadow: 0 0 30px 8px rgba(190,228,255,.8); transform: scaleY(0); }
  .arena[data-anim="seam"].intro .seamline { animation: sl 1.5s var(--ease) both; }
  @keyframes sl { 0% { opacity: 1; transform: scaleY(0); } 25% { opacity: 1; transform: scaleY(1); } 70% { opacity: 1; } 100% { opacity: 0; transform: scaleY(1); } }
  .arena[data-anim="seam"].intro .card.a { animation: rvA .95s cubic-bezier(.6,0,.2,1) .3s both; }
  .arena[data-anim="seam"].intro .card.b { animation: rvB .95s cubic-bezier(.6,0,.2,1) .3s both; }
  @keyframes rvA { from { clip-path: inset(0 100% 0 0 round 24px); filter: brightness(2.2); } 60% { filter: brightness(1.3); } to { clip-path: inset(0 0 0 0 round 24px); filter: none; } }
  @keyframes rvB { from { clip-path: inset(0 0 0 100% round 24px); filter: brightness(2.2); } 60% { filter: brightness(1.3); } to { clip-path: inset(0 0 0 0 round 24px); filter: none; } }
  /* 3. spotlights: the arena is dark, a light swings onto each contender, then the house lights come up */
  .dim { inset: -60px -80px; background: radial-gradient(70% 80% at 50% 50%, rgba(5,7,11,.9), rgba(5,7,11,.97)); z-index: 3; }
  .spot { left: 50%; top: -340px; width: 420px; height: 980px; margin-left: -210px; transform-origin: 50% 0; filter: blur(14px); z-index: 4;
    clip-path: polygon(46% 0, 54% 0, 100% 100%, 0 100%); background: linear-gradient(180deg, rgba(220,240,255,.55), rgba(125,198,255,.12) 70%, rgba(125,198,255,0)); }
  .arena[data-anim="spot"].intro .dim { animation: dim 2s ease both; }
  @keyframes dim { 0%, 60% { opacity: 1; } 100% { opacity: 0; } }
  .arena[data-anim="spot"].intro .spot.a { animation: spA 2s cubic-bezier(.5,0,.2,1) both; }
  .arena[data-anim="spot"].intro .spot.b { animation: spB 2s cubic-bezier(.5,0,.2,1) .25s both; }
  @keyframes spA { 0% { opacity: 0; transform: rotate(10deg); } 15% { opacity: 1; } 45% { transform: rotate(-27deg); } 55% { transform: rotate(-24deg); } 75% { opacity: 1; } 100% { opacity: 0; transform: rotate(-24deg); } }
  @keyframes spB { 0% { opacity: 0; transform: rotate(-10deg); } 15% { opacity: 1; } 45% { transform: rotate(27deg); } 55% { transform: rotate(24deg); } 75% { opacity: 1; } 100% { opacity: 0; transform: rotate(24deg); } }
  .arena[data-anim="spot"].intro .card { z-index: 5; }
  .arena[data-anim="spot"].intro .card.a { animation: lit 1.2s ease .55s both; } .arena[data-anim="spot"].intro .card.b { animation: lit 1.2s ease .8s both; }
  @keyframes lit { 0% { opacity: 0; filter: brightness(.3); transform: scale(.97); } 35% { opacity: 1; filter: brightness(1.6); } 100% { opacity: 1; filter: none; transform: none; } }
  /* 4. rise: the cards stand up from the floor grid while a pulse runs through it */
  .arena[data-anim="rise"] { perspective: 1400px; }
  .floorfx { left: 50%; bottom: -120px; width: 1400px; height: 420px; margin-left: -700px; z-index: 0; transform: perspective(700px) rotateX(70deg);
    background-image: linear-gradient(rgba(125,198,255,.5) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(125,198,255,.5) 1.5px, transparent 1.5px); background-size: 60px 60px;
    -webkit-mask-image: radial-gradient(closest-side, #000, transparent); mask-image: radial-gradient(closest-side, #000, transparent); }
  .arena[data-anim="rise"].intro .floorfx { animation: floor 1.8s ease both; }
  @keyframes floor { 0% { opacity: 0; -webkit-mask-size: 0% 0%; } 20% { opacity: 1; } 100% { opacity: 0; } }
  .arena[data-anim="rise"].intro .card { transform-origin: 50% 100%; }
  .arena[data-anim="rise"].intro .card.a { animation: rise 1.1s cubic-bezier(.2,.9,.3,1.15) .2s both; } .arena[data-anim="rise"].intro .card.b { animation: rise 1.1s cubic-bezier(.2,.9,.3,1.15) .38s both; }
  @keyframes rise { from { opacity: 0; transform: translateY(140px) rotateX(78deg); filter: brightness(1.8); } 60% { opacity: 1; } to { transform: none; filter: none; } }
  .arena[data-anim="rise"].intro .slam .digits { animation-name: drop; }
  @keyframes drop { 0% { transform: translateY(-120px); opacity: 0; } 70% { transform: translateY(8px); opacity: 1; } 100% { transform: none; } }

  .switch { position: fixed; z-index: 50; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; border-radius: 999px; background: rgba(11,14,20,.92); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14), 0 20px 40px rgba(0,0,0,.45); backdrop-filter: blur(12px); }
  .switch button { height: 42px; padding: 0 18px; border-radius: 999px; font-size: 16px; color: rgba(255,255,255,.72); }
  .switch button.on { background: #e8e8ed; color: #12161f; font-weight: 500; }
  .switch .rp { color: var(--A); }

  /* ---------- clash variations: same meeting, calmer and more grown-up ---------- */
  .bloom { left: 50%; top: 50%; width: 520px; height: 520px; margin: -260px 0 0 -260px; border-radius: 50%; background: radial-gradient(closest-side, rgba(190,228,255,.45), rgba(125,198,255,.12) 45%, rgba(125,198,255,0)); }
  .thin { left: 50%; top: -20px; bottom: -20px; width: 1.5px; margin-left: -.75px; background: linear-gradient(180deg, transparent, rgba(255,255,255,.95) 30%, rgba(255,255,255,.95) 70%, transparent); box-shadow: 0 0 14px 2px rgba(190,228,255,.6); }
  .wave { left: 50%; top: 50%; width: 200px; height: 200px; margin: -100px 0 0 -100px; border-radius: 50%; box-shadow: 0 0 0 1.5px rgba(125,198,255,.7); }
  .wgrid { inset: -120px -200px; background-image: linear-gradient(rgba(125,198,255,.35) 1px, transparent 1px), linear-gradient(90deg, rgba(125,198,255,.35) 1px, transparent 1px); background-size: 72px 72px; z-index: 0;
    -webkit-mask-image: radial-gradient(circle at 50% 50%, transparent 0, #000 6%, transparent 14%); mask-image: radial-gradient(circle at 50% 50%, transparent 0, #000 6%, transparent 14%); -webkit-mask-size: 100% 100%; }
  .vign { inset: -200px; background: radial-gradient(60% 60% at 50% 50%, rgba(0,0,0,0), rgba(0,0,0,.55)); z-index: 1; }
  .arc { left: 50%; top: 18%; width: 80px; height: 64%; margin-left: -40px; overflow: visible; }
  .arc path { fill: none; stroke: #fff; stroke-width: 1.6; stroke-linejoin: round; filter: drop-shadow(0 0 4px rgba(190,228,255,.9)) drop-shadow(0 0 10px rgba(125,198,255,.7)); }
  .card .edge { position: absolute; top: 14%; bottom: 14%; width: 2px; opacity: 0; pointer-events: none; border-radius: 2px; background: linear-gradient(180deg, transparent, #bfe4ff 30%, #fff 50%, #bfe4ff 70%, transparent); box-shadow: 0 0 16px 3px rgba(125,198,255,.7); }
  .card.a .edge { left: -1px; } .card.b .edge { right: -1px; }

  /* soft: a smooth glide, a single line of light and a bloom where they touch */
  .arena[data-anim="soft"].intro .card.a { animation: sfA 1.4s cubic-bezier(.22,.7,.2,1) both; } .arena[data-anim="soft"].intro .card.b { animation: sfB 1.4s cubic-bezier(.22,.7,.2,1) both; }
  @keyframes sfA { 0% { transform: translateX(380px); opacity: 0; } 40% { transform: translateX(-150px); opacity: 1; animation-timing-function: cubic-bezier(.45,0,.2,1); } 100% { transform: none; } }
  @keyframes sfB { 0% { transform: translateX(-380px); opacity: 0; } 40% { transform: translateX(150px); opacity: 1; animation-timing-function: cubic-bezier(.45,0,.2,1); } 100% { transform: none; } }
  .arena[data-anim="soft"].contact .thin { animation: thin 1s ease-out both; } .arena[data-anim="soft"].contact .bloom { animation: bloom 1.1s ease-out both; }
  @keyframes thin { 0% { opacity: 0; transform: scaleY(.2); } 15% { opacity: 1; transform: scaleY(1); } 100% { opacity: 0; transform: scaleY(1); } }
  @keyframes bloom { 0% { opacity: 0; transform: scale(.3); } 20% { opacity: 1; } 100% { opacity: 0; transform: scale(1.4); } }

  /* energy wave: the facing edges light up, a ring runs out through the grid */
  .arena[data-anim="wave"].intro .card.a { animation: sfA 1.4s cubic-bezier(.22,.7,.2,1) both; } .arena[data-anim="wave"].intro .card.b { animation: sfB 1.4s cubic-bezier(.22,.7,.2,1) both; }
  .arena[data-anim="wave"].contact .card .edge { animation: edge 1.3s ease-out both; }
  @keyframes edge { 0% { opacity: 0; } 12% { opacity: 1; } 100% { opacity: 0; } }
  .arena[data-anim="wave"].contact .wave { animation: wave 1.4s cubic-bezier(.1,.6,.3,1) both; }
  @keyframes wave { 0% { opacity: 1; transform: scale(.2); } 100% { opacity: 0; transform: scale(9, 5); } }
  .arena[data-anim="wave"].contact .wgrid { animation: wgrid 1.5s ease-out both; }
  @keyframes wgrid { 0% { opacity: 1; -webkit-mask-size: 30% 30%; -webkit-mask-position: center; } 100% { opacity: 0; -webkit-mask-size: 600% 600%; -webkit-mask-position: center; } }
  .arena[data-anim="wave"].contact .thin { animation: thin .8s ease-out both; }

  /* heavy: they gather speed, meet with weight, the room dims for a beat */
  .arena[data-anim="heavy"].intro .card.a { animation: hvA 1.7s both; } .arena[data-anim="heavy"].intro .card.b { animation: hvB 1.7s both; }
  @keyframes hvA { 0% { transform: translateX(300px); opacity: 0; animation-timing-function: cubic-bezier(.6,0,.9,.4); } 12% { opacity: 1; } 42% { transform: translateX(-150px); animation-timing-function: linear; } 48% { transform: translateX(-146px) scaleX(.985); animation-timing-function: cubic-bezier(.2,.8,.2,1); } 100% { transform: none; } }
  @keyframes hvB { 0% { transform: translateX(-300px); opacity: 0; animation-timing-function: cubic-bezier(.6,0,.9,.4); } 12% { opacity: 1; } 42% { transform: translateX(150px); animation-timing-function: linear; } 48% { transform: translateX(146px) scaleX(.985); animation-timing-function: cubic-bezier(.2,.8,.2,1); } 100% { transform: none; } }
  .arena[data-anim="heavy"].contact .vign { animation: vign .9s ease-out both; } .arena[data-anim="heavy"].contact .wave { animation: wave 1.1s cubic-bezier(.1,.6,.3,1) both; }
  @keyframes vign { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
  .arena[data-anim="heavy"].contact { animation: nudge .25s ease-out both; }
  @keyframes nudge { 40% { transform: translateY(2px); } }

  /* magnetic: they stop just short of each other, an arc of light jumps the gap, and they part */
  .arena[data-anim="magnet"].intro .card.a { animation: mgA 2s cubic-bezier(.3,.7,.2,1) both; } .arena[data-anim="magnet"].intro .card.b { animation: mgB 2s cubic-bezier(.3,.7,.2,1) both; }
  @keyframes mgA { 0% { transform: translateX(340px); opacity: 0; } 30% { transform: translateX(-118px); opacity: 1; } 52% { transform: translateX(-124px); animation-timing-function: cubic-bezier(.2,.8,.2,1); } 100% { transform: none; } }
  @keyframes mgB { 0% { transform: translateX(-340px); opacity: 0; } 30% { transform: translateX(118px); opacity: 1; } 52% { transform: translateX(124px); animation-timing-function: cubic-bezier(.2,.8,.2,1); } 100% { transform: none; } }
  .arena[data-anim="magnet"].contact .arc { animation: arc .55s steps(1, end) both; }
  @keyframes arc { 0% { opacity: 1; } 20% { opacity: .2; } 30% { opacity: 1; } 55% { opacity: .5; } 70% { opacity: 1; } 100% { opacity: 0; } }
  .arena[data-anim="magnet"].contact .card .edge { animation: edge .9s ease-out both; }

  /* the score arrives quietly in the calmer versions */
  .rise .digits { animation: srise .7s cubic-bezier(.2,.8,.2,1) both; } .rise .digits.da { animation-delay: .08s; }
  @keyframes srise { from { opacity: 0; transform: translateY(18px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
  .rise .vs { animation: vsin .6s ease both; } @keyframes vsin { from { opacity: 0; transform: rotate(45deg) scale(.6); } to { opacity: 1; transform: rotate(45deg); } }
  .lite .digits { animation: slite .5s cubic-bezier(.2,1.2,.4,1) both; } .lite .digits.da { animation-delay: .06s; }
  @keyframes slite { from { opacity: 0; transform: scale(1.18); } to { opacity: 1; transform: none; } }
  .lite .vs { animation: vsin .5s ease both; }

  /* the plain-words dialog (as PlainDialog on the duel page) */
  .pd { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; padding: 16px; background: rgba(6,9,14,.6); backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity .25s; }
  .pd.open { opacity: 1; pointer-events: auto; }
  .pd-panel { position: relative; width: min(680px, 100%); max-height: 86vh; overflow: auto; border-radius: 22px; background: #0b0e14; box-shadow: inset 0 0 0 1px rgba(125,198,255,.14); transform: translateY(10px) scale(.98); transition: transform .3s var(--ease); }
  .pd.open .pd-panel { transform: none; }
  .pd-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 16px 22px; padding-inline-end: 64px; border-radius: 22px 22px 0 0; background: #161c26; }
  .pd-head img { width: 32px; height: 32px; object-fit: contain; }
  .pd-head h4 { font-size: 18px; font-weight: 500; }
  .pd-x { position: absolute; left: 16px; top: 13px; z-index: 3; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.07); }
  .pd-x svg { width: 12px; height: 12px; }
  .pd-cols { display: grid; grid-template-columns: 1.15fr 1fr; align-items: start; gap: 22px; padding: 20px 22px 22px; }
  .pd-list { list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .pd-list li, .pd-steps li { display: flex; align-items: flex-start; gap: 10px; font-size: 15px; line-height: 1.4; color: rgba(255,255,255,.85); }
  .pd-list li svg { width: 18px; height: 18px; flex: none; margin-top: 1px; color: var(--A); }
  .pd-lab { margin: 18px 0 10px; font-size: 15px; font-weight: 500; color: var(--A); } .pd-lab.first { margin-top: 0; }
  .pd-steps { list-style: none; display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 16px; background: rgba(255,255,255,.04); }
  .pd-steps b { width: 24px; height: 24px; flex: none; border-radius: 50%; background: #fff; color: #12161f; display: grid; place-items: center; font-size: 13px; font-weight: 600; }
  .pd-note { margin-top: 14px; font-size: 13px; color: rgba(255,255,255,.55); }
  .pd-empty { padding: 24px; font-size: 15px; color: rgba(255,255,255,.6); }

  /* the duel page's backdrop: the Antar brain, big and blurred, as on the real page */
  .hero { overflow-x: clip; }
  .brain { position: absolute; z-index: -1; pointer-events: none; }
  .brain.r { right: max(-120px, calc(50% - 860px)); top: 70px; width: 394px; rotate: 32deg; filter: blur(6.8px); }
  .brain.l { left: max(-110px, calc(50% - 860px)); top: 820px; width: 266px; rotate: -18deg; filter: blur(12px); }
  .burger { display: none; }

  /* ---------- phones: the contenders stacked, the score between them, rounds as a swipe row ---------- */
  @media (max-width: 760px) {
    .brain.r { right: -70px; top: 60px; width: 200px; }
    .brain.l { display: none; }
    .hero { padding: 104px 0 40px; }
    .head { padding: 0 16px; gap: 12px; }
    .pill { font-size: 14px; }
    .head h1 { font-size: 38px; }
    .head p { font-size: 16px; }
    /* popular duels: one per row, no sideways scroll */
    .pop { width: 100%; margin-top: 8px; flex-direction: column; align-items: stretch; gap: 8px; font-size: 14px; }
    .pop button { height: 42px; justify-content: center; font-size: 14px; }

    /* the contenders side by side, the score over them, column for column */
    .arena { width: calc(100% - 24px); margin-top: 30px; grid-template-columns: 1fr 1fr; grid-template-areas: "s s" "a b"; column-gap: 10px; }
    .arena > .card.a { grid-area: a; } .arena > .card.b { grid-area: b; } .arena > .mid { grid-area: s; }
    .mid { padding: 0 0 22px; }
    .sc { width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; justify-items: center; gap: 0; }
    .digits { font-size: 58px; }
    .vs { width: 34px; height: 34px; border-radius: 9px; } .vs span { font-size: 12px; }
    .card { padding: 22px 12px 12px; border-radius: 20px; gap: 10px; }
    .face { gap: 10px; height: 100%; }
    .top { justify-content: center; }
    .top .swap { display: none; }
    .side { height: 24px; font-size: 12px; padding: 0 10px; }
    .who { flex-direction: column; gap: 8px; text-align: center; }
    .who img { width: 44px; height: 44px; }
    .who b { font-size: 17px; min-height: 2.2em; display: grid; place-items: center; }
    .dd-btn { height: 40px; padding: 0 10px; border-radius: 13px; gap: 6px; }
    .dd-btn span { display: none; }
    .dd-btn b { font-size: 14px; }
    .seg { flex-wrap: wrap; gap: 2px; border-radius: 16px; padding: 3px; }
    .seg button { flex: 1 0 30%; height: 30px; font-size: 12px; }
    .seg.he { flex-direction: column; } .seg.he button { flex: none; height: 32px; font-size: 12px; }
    .lbl { font-size: 12px; text-align: center; }
    .price { align-items: center; text-align: center; }
    .price .from { font-size: 12px; }
    .price .row { flex-wrap: wrap; justify-content: center; gap: 2px 6px; }
    .price .now { font-size: 26px; flex-basis: 100%; text-align: center; }
    .price .was { font-size: 13px; } .price .per { font-size: 12px; }
    .code { height: 42px; padding: 0 12px 0 4px; gap: 8px; margin-top: auto; }
    .code span { display: none; }
    .code b { font-size: 15px; letter-spacing: 1px; }
    .copy { width: 34px; height: 34px; padding: 0; justify-content: center; }
    .copy em { display: none; }
    .plain { align-self: center; font-size: 13px; }
    .swap2 { display: inline-flex; }
    .wtag { font-size: 12px; padding: 4px 10px; top: -12px; gap: 4px; }
    .wtag svg { width: 12px; height: 12px; }
    /* the firm picker opens under the duel, across both cards */
    .pick.pm { position: relative; top: auto; inset: auto; width: calc(100% - 24px); margin: 12px auto 0; }
    /* entrance: the same clash, scaled to the narrow arena */
    .arena.first .card.a { animation-name: inAs; } .arena.first .card.b { animation-name: inBs; }
    @keyframes inAs { 0% { transform: translateX(115%) skewX(-8deg); filter: blur(8px); opacity: 0; } 34% { transform: translateX(-10px) skewX(0); filter: blur(0); opacity: 1; } 42% { transform: translateX(-6px) scaleX(.97); } 100% { transform: none; } }
    @keyframes inBs { 0% { transform: translateX(-115%) skewX(8deg); filter: blur(8px); opacity: 0; } 34% { transform: translateX(10px) skewX(0); filter: blur(0); opacity: 1; } 42% { transform: translateX(6px) scaleX(.97); } 100% { transform: none; } }
    .card .trail { display: none; }

    /* rounds: all five in one row, no sideways scroll */
    .rounds { width: calc(100% - 24px); margin-top: 16px; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .rd { padding: 9px 3px 10px; border-radius: 12px; gap: 3px; }
    .rd small { font-size: 11px; } .rd strong { font-size: 12px; line-height: 1.2; min-height: 2.4em; display: grid; place-items: center; } .rd .s { font-size: 15px; } .rd .go { display: none; }
    .pick { top: 56px; padding: 14px; }
    .switch { bottom: 14px; } .switch button { height: 38px; font-size: 14px; }

    .pd { padding: 12px; }
    .pd-head { padding: 14px 16px; padding-inline-end: 60px; }
    .pd-head h4 { font-size: 16px; }
    .pd-x { left: 12px; top: 12px; }
    .pd-cols { grid-template-columns: 1fr; gap: 18px; padding: 16px; }

    .full { padding: 56px 0 96px; margin-top: 40px; }
    .full .w { width: calc(100% - 32px); gap: 12px; }
    .fhead { flex-direction: column; align-items: stretch; gap: 16px; margin-bottom: 4px; }
    .full h2 { font-size: 30px; }
    .full .sub { font-size: 16px; }
    .tgl button { flex: 1; }
    .vsbar { display: none; }
    .vsbar .f { flex-wrap: wrap; gap: 4px 8px; font-size: 14px; }
    .vsbar .f img { width: 24px; height: 24px; }
    .vsbar .f small { font-size: 12px; flex-basis: 100%; }
    .vsbar .f.b { flex-direction: row; justify-content: flex-end; text-align: left; }
    .vsbar .m { font-size: 13px; }
    .grp { padding: 4px 14px 8px; border-radius: 20px; }
    .gh { grid-template-columns: 1fr; padding: 14px 0 8px; }
    .gh .n { display: none; }
    .gh h3 { font-size: 19px; }
    /* a row: the label across the top, the two values side by side under it */
    .r { grid-template-columns: 1fr 1fr; grid-template-areas: "k k" "a b"; gap: 6px 14px; padding: 12px 0; }
    .r .k { grid-area: k; text-align: right; font-size: 14px; }
    .r .v { grid-area: a; } .r .v.b { grid-area: b; }
    .r .val { font-size: 15px; flex-wrap: wrap; gap: 6px; }
    .r .v.b .val { justify-content: flex-end; }

<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AntarTrade - טעימה מהאקדמיה</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: "Fb Reforma"; src: url("../../fonts/FbReforma-Regular.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Fb Reforma"; src: url("../../fonts/FbReforma-Medium.woff2") format("woff2"); font-weight: 500 700; }
  :root { --navy: #12161f; --card: #0b0e14; --sky: #7dc6ff; --blue: #2e8bd8; --ice: #d6ecff; --mint: #3fd8c2; --ease: cubic-bezier(.22,.61,.36,1); }
  @property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Fb Reforma", "Roboto", sans-serif; background: var(--navy); color: #fff; }
  section { padding: 120px 16px 140px; background: radial-gradient(50% 40% at 85% 10%, rgba(46,139,216,.18), transparent 70%), var(--navy); }
  .wrap { max-width: 1171px; margin: 0 auto; }
  .head { text-align: center; }
  .pill { display: inline-block; font-size: 13px; font-weight: 500; padding: 6px 14px; border-radius: 999px; background: rgba(125,198,255,.14); color: var(--sky); }
  h2 { margin-top: 16px; font-size: 40px; font-weight: 500; line-height: 1.2; }
  h2 b { font-weight: 500; color: var(--sky); }
  .head p { margin-top: 12px; font-size: 20px; color: rgba(255,255,255,.6); }

  /* tabs: a curated pick first, then a short taste of each type that ends in a link to the full library */
  .tabs { margin: 40px auto 48px; width: max-content; max-width: 100%; display: flex; gap: 4px; padding: 5px; border-radius: 999px; background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); position: relative; }
  .tabs button { position: relative; z-index: 1; border: 0; background: none; font: 500 15px "Fb Reforma", sans-serif; color: rgba(255,255,255,.6); padding: 10px 22px; border-radius: 999px; cursor: pointer; transition: color .3s; }
  .tabs button.on { color: var(--navy); }
  .tabs .ind { position: absolute; top: 5px; bottom: 5px; border-radius: 999px; background: var(--sky); transition: all .45s var(--ease); }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; align-items: stretch; }
  .grid.four { grid-template-columns: repeat(4, 1fr); }
  .grid.fade { animation: in .5s var(--ease); }
  @keyframes in { from { opacity: 0; transform: translateY(12px); } }

  /* dark chip-glow card, as approved for the duel and deals cards */
  .card { position: relative; border-radius: 24px; text-decoration: none; color: inherit; display: flex; flex-direction: column; isolation: isolate;
    background: radial-gradient(90% 70% at 0% 100%, rgba(46,139,216,.22), transparent 60%), var(--card);
    box-shadow: inset 0 0 0 1px rgba(125,198,255,.12); transition: transform .5s var(--ease), box-shadow .5s var(--ease); }
  /* hover: a sky ring travels once around the edge (like the halo buttons), then settles as a gradient stroke */
  .card::before, .card::after { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0; }
  .card::before { z-index: 3; background: conic-gradient(from var(--a), transparent 0deg, var(--sky) 40deg, var(--blue) 100deg, transparent 150deg 360deg); transition: opacity .3s; }
  .card::after { z-index: 2; background: linear-gradient(135deg, var(--blue), var(--sky) 50%, rgba(214,236,255,.6)); transition: opacity .4s .7s; }
  .card:hover::before { opacity: 1; animation: ring 1.1s var(--ease) forwards; }
  .card:hover::after { opacity: 1; }
  @keyframes ring { from { --a: 0deg; } to { --a: 360deg; } }
  .card:hover { transform: translateY(-6px); box-shadow: inset 0 0 0 1px rgba(125,198,255,0), 0 30px 60px -20px rgba(46,139,216,.45); }

  /* every cover keeps its own format: courses 4:3, YouTube videos 16:9, article covers 1920x1008 */
  .media { position: relative; margin: 8px 8px 0; border-radius: 18px; overflow: hidden; background: #000; }
  .course .media { aspect-ratio: 4 / 3; }
  .video .media { aspect-ratio: 16 / 9; }
  .article .media { aspect-ratio: 1920 / 1008; }
  .media img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .8s var(--ease); }
  .card:hover .media img { transform: scale(1.05); }
  .veil { position: absolute; inset: 0; background: radial-gradient(70% 60% at 0% 100%, rgba(46,139,216,.6), transparent 70%), linear-gradient(0deg, rgba(11,14,20,.85), rgba(11,14,20,0) 60%);
    opacity: 0; transform: translateY(18%); transition: opacity .5s var(--ease), transform .6s var(--ease); }
  .card:hover .veil { opacity: 1; transform: none; }
  .go { position: absolute; left: 14px; bottom: 14px; display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 999px; background: #fff; color: var(--navy);
    font: 500 14px "Fb Reforma", sans-serif; opacity: 0; transform: translateY(10px); transition: opacity .4s .12s var(--ease), transform .5s .12s var(--ease); }
  .go svg { width: 14px; height: 14px; transition: transform .4s var(--ease); }
  .card:hover .go { opacity: 1; transform: none; }
  .card:hover .go svg { transform: translateX(-4px); }
  .dur { position: absolute; right: 12px; top: 12px; font: 500 12px "Roboto", sans-serif; color: #fff; background: rgba(11,14,20,.75); padding: 5px 10px; border-radius: 999px; }

  .body { padding: 16px 20px 22px; display: grid; gap: 8px; }
  .tag { justify-self: start; font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px; background: rgba(125,198,255,.14); color: var(--sky); }
  .tag.free { background: rgba(63,216,194,.14); color: var(--mint); }
  .tag.paid { background: rgba(255,255,255,.1); color: #fff; }
  .card h3 { font-size: 19px; font-weight: 500; line-height: 1.35; }
  .card p { font-size: 14px; line-height: 1.55; color: rgba(255,255,255,.62); }
  /* the flagship course always wears its gradient stroke */
  .card.flag::after { opacity: 1; transition: none; }

  /* closing tile of each tab: says how much more there is and opens the full library */
  .all { justify-content: center; align-items: center; text-align: center; gap: 10px; padding: 32px 20px; align-self: stretch;
    background: radial-gradient(80% 70% at 50% 100%, rgba(46,139,216,.3), transparent 70%), var(--card); }
  .all .n { font: 700 54px "Roboto", sans-serif; color: var(--sky); line-height: 1; }
  .all .t { font-size: 18px; font-weight: 500; }
  .all .arrow { margin-top: 8px; width: 44px; height: 44px; border-radius: 50%; background: #fff; color: var(--navy); display: grid; place-items: center; transition: transform .4s var(--ease); }
  .all .arrow svg { width: 16px; height: 16px; }
  .all:hover .arrow { transform: translateX(-6px); }

  .more { margin-top: 48px; text-align: center; }
  .halo { display: inline-block; padding: 6px; border-radius: 999px; background: rgba(85,169,235,.05); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  .halo a { display: inline-flex; align-items: center; gap: 8px; height: 50px; padding: 0 26px; border-radius: 999px; background: linear-gradient(180deg, #a8d8ff, var(--sky)); color: var(--navy); text-decoration: none; font: 500 18px "Fb Reforma", sans-serif; }
  @media (max-width: 980px) { .grid, .grid.four { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 620px) { .grid, .grid.four { grid-template-columns: 1fr; } h2 { font-size: 32px; } .tabs button { padding: 10px 14px; } }
  @media (prefers-reduced-motion: reduce) { .card, .card *, .card::before, .card::after, .grid { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<section>
  <div class="wrap">
    <div class="head">
      <span class="pill">האקדמיה של AntarTrade</span>
      <h2>טעימה <b>מהאקדמיה</b></h2>
      <p>קורסים, סרטונים ומדריכים - כל מה שצריך כדי לסחור חכם יותר.</p>
    </div>
    <div class="tabs" id="tabs">
      <span class="ind"></span>
      <button class="on" data-f="pick">נבחרים</button>
      <button data-f="course">קורסים</button>
      <button data-f="video">סרטונים</button>
      <button data-f="article">מאמרים</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="more"><span class="halo"><a href="#">לכל האקדמיה <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M12 7H2M6 3L2 7L6 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></span></div>
  </div>
</section>
<script>
  const ARROW = '<svg viewBox="0 0 14 14" fill="none"><path d="M12 7H2M6 3L2 7L6 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  // site hierarchy: flagship course > free courses > paid course > videos > articles
  const C = [
    { t: 'course', img: 'full.webp', tag: ['paid', 'הקורס המלא'], h: 'המסלול המלא למסחר בחוזים עתידיים', p: 'מהיסודות ועד לתכנים המתקדמים של קורס Order Flow.', flag: 1 },
    { t: 'course', img: 'nostro.webp', tag: ['free', 'חינם'], h: 'קורס הנוסטרו החינמי', p: 'מה זה מסחר ממומן, איך עובדים המבחנים והחשבונות.' },
    { t: 'course', img: 'intro.webp', tag: ['free', 'חינם'], h: 'קורס המבוא החינמי', p: 'יסודות שוק ההון, פקודות מסחר ונרות יפנים.' },
    { t: 'course', img: 'orderflow.webp', tag: ['paid', 'בתשלום'], h: 'קורס Order Flow', p: 'קריאת זרימת פקודות ועומק שוק לסוחרים מנוסים.' },
  ];
  const V = [
    { t: 'video', img: 'v-apex.jpg', dur: '35 דק׳', h: 'מדריך לאפקס - איך קונים ומתקינים' },
    { t: 'video', img: 'v-tp.jpg', dur: '25 דק׳', h: 'מדריך לחוקים של טייק פרופיט' },
    { t: 'video', img: 'v-topstep.jpg', dur: '20 דק׳', h: 'מדריך לטופסטפ - TopStep' },
    { t: 'video', img: 'v-ninja.jpg', dur: '25 דק׳', h: 'מדריך לתוכנת המסחר נינג׳ה טריידר' },
    { t: 'video', img: 'v-replikanto.jpg', dur: '20 דק׳', h: 'מדריך לקופי טריידינג - Replikanto' },
  ];
  const A = [
    { t: 'article', img: 'a-footprint.jpg', h: 'מה זה פוטפרינט? המדריך המלא' },
    { t: 'article', img: 'a-apex.jpg', h: 'המדריך המלא לאפקס טריידר פאנדינג' },
    { t: 'article', img: 'a-topstep.jpg', h: 'Topstep - המדריך המלא לטופסטפ' },
    { t: 'article', img: 'a-tradovate.jpg', h: 'סטופ יומי וניהול סיכונים ב-Tradovate' },
    { t: 'article', img: 'a-rithmic.jpg', h: 'המדריך המלא להגדרת סטופ יומי ב-Rithmic' },
  ];
  // totals on the live site, so the closing tile tells the truth (update when content grows)
  const TOTAL = { video: 20, article: 7, academy: 31 };
  const LABEL = { video: ['סרטון', 'לצפייה', 'סרטונים נוספים בספריית הווידאו'], article: ['מאמר', 'לקריאה', 'מאמרים נוספים'], course: ['', 'לעמוד הקורס'] };
  const card = d => `<a class="card ${d.t}${d.flag ? ' flag' : ''}" href="#"><div class="media"><img src="img/${d.img}" alt="">${d.dur ? `<span class="dur">${d.dur}</span>` : ''}<span class="veil"></span><span class="go">${LABEL[d.t][1]} ${ARROW}</span></div>
    <div class="body"><span class="tag ${d.tag ? d.tag[0] : ''}">${d.tag ? d.tag[1] : LABEL[d.t][0]}</span><h3>${d.h}</h3>${d.p ? `<p>${d.p}</p>` : ''}</div></a>`;
  const tile = (n, t) => `<a class="card all" href="#"><span class="n">+${n}</span><span class="t">${t}</span><span class="arrow">${ARROW}</span></a>`;
  const VIEWS = {
    // curated pick: a row of courses (4:3), then a video and an article (both wide) and the way into the library
    pick: { cls: '', html: () => C.slice(0, 3).map(card).join('') + card(V[0]) + card(A[0]) + tile(TOTAL.academy - 5, 'קורסים, סרטונים ומאמרים באקדמיה') },
    course: { cls: 'four', html: () => C.map(card).join('') },
    video: { cls: '', html: () => V.map(card).join('') + tile(TOTAL.video - V.length, LABEL.video[2]) },
    article: { cls: '', html: () => A.map(card).join('') + tile(TOTAL.article - A.length, LABEL.article[2]) },
  };
  const grid = document.getElementById('grid'), tabs = document.getElementById('tabs'), ind = tabs.querySelector('.ind');
  function show(f) { grid.className = 'grid fade ' + VIEWS[f].cls; grid.innerHTML = VIEWS[f].html(); }
  function place(b) { ind.style.left = b.offsetLeft + 'px'; ind.style.width = b.offsetWidth + 'px'; }
  function pick(b) { tabs.querySelector('.on').classList.remove('on'); b.classList.add('on'); place(b); show(b.dataset.f); }
  tabs.querySelectorAll('button').forEach(b => b.onclick = () => pick(b));
  // ?tab=video opens a tab directly (used for checking)
  pick(tabs.querySelector(`[data-f="${new URLSearchParams(location.search).get('tab') || 'pick'}"]`) || tabs.querySelector('.on'));
  addEventListener('load', () => place(tabs.querySelector('.on')));
</script>
</body>
</html>

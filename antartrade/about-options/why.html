<body><h1>תמונה לסקשן "למה האתר הזה?"</h1><p class="lead">כל אופציה מוצגת כמו שהיא תיראה בסקשן: כהה ונמסה לרקע, עם הטקסט משמאל. בכל תמונה עם מסכים טורקיז אני יכול להחליף את המסכים לגרפי מסחר אמיתיים, כמו שעשיתי ברקע של נועם. תגידי לי מספר.</p><div class="g"><figure><div class="sec"><div class="ph" style="background-image:url(why-0.jpg);background-position:70% 40%"></div><div class="tx"><span>02</span><h3>למה האתר הזה?</h3><p>כשהתחלתי בתחום המימון, לא היה מקום אחד שריכז את כל המידע. הייתי צריך לחפש, לשאול, לטעות ולהפסיד כסף בדרך.</p></div></div><figcaption><b>1</b>מה שיש עכשיו: סוחר כותב הערות מול ארבעה מסכים</figcaption></figure><figure><div class="sec"><div class="ph" style="background-image:url(why-1.jpg);background-position:35% 40%"></div><div class="tx"><span>02</span><h3>למה האתר הזה?</h3><p>כשהתחלתי בתחום המימון, לא היה מקום אחד שריכז את כל המידע. הייתי צריך לחפש, לשאול, לטעות ולהפסיד כסף בדרך.</p></div></div><figcaption><b>2</b>סוחר עם קפה מול מסכי נרות, משרד מואר</figcaption></figure><figure><div class="sec"><div class="ph" style="background-image:url(why-3.jpg);background-position:50% 40%"></div><div class="tx"><span>02</span><h3>למה האתר הזה?</h3><p>כשהתחלתי בתחום המימון, לא היה מקום אחד שריכז את כל המידע. הייתי צריך לחפש, לשאול, לטעות ולהפסיד כסף בדרך.</p></div></div><figcaption><b>3</b>מבט מאחור על עמדת מסחר עם שישה מסכים וקיר לבנים</figcaption></figure><figure><div class="sec"><div class="ph" style="background-image:url(why-4.jpg);background-position:20% 50%"></div><div class="tx"><span>02</span><h3>למה האתר הזה?</h3><p>כשהתחלתי בתחום המימון, לא היה מקום אחד שריכז את כל המידע. הייתי צריך לחפש, לשאול, לטעות ולהפסיד כסף בדרך.</p></div></div><figcaption><b>4</b>סוחר בחליפה חושב מול המסך, חלל עבודה חם</figcaption></figure><figure><div class="sec"><div class="ph" style="background-image:url(why-5.jpg);background-position:40% 50%"></div><div class="tx"><span>02</span><h3>למה האתר הזה?</h3><p>כשהתחלתי בתחום המימון, לא היה מקום אחד שריכז את כל המידע. הייתי צריך לחפש, לשאול, לטעות ולהפסיד כסף בדרך.</p></div></div><figcaption><b>5</b>עמדת מסחר ביתית בלילה</figcaption></figure><figure><div class="sec"><div class="ph" style="background-image:url(why-7.jpg);background-position:60% 40%"></div><div class="tx"><span>02</span><h3>למה האתר הזה?</h3><p>כשהתחלתי בתחום המימון, לא היה מקום אחד שריכז את כל המידע. הייתי צריך לחפש, לשאול, לטעות ולהפסיד כסף בדרך.</p></div></div><figcaption><b>6</b>סוחר עם אוזניות מצביע על הגרף</figcaption></figure></div></body></html>

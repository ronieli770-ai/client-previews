<body><h1>הרקע מאחורי נועם - "מה מייחד אותי"</h1><p>כל הרקעים הם תמונות אמיתיות, ונועם מורכב עליהן עם טשטוש קל של עומק וצל רך. בעמוד התמונה תהיה כהה ונמסה לרקע כמו בשאר הסקשנים. תגידי לי מספר.</p><div class="g"><figure><img src="noam-bg-1.jpg" alt=""><figcaption><b>1</b>חדר עבודה ביתי עם קיר מסכים (מה שיש עכשיו)</figcaption></figure><figure><img src="noam-bg-2.jpg" alt=""><figcaption><b>2</b>חדר מסחר כהה עם מסכים וקיר לבנים</figcaption></figure><figure><img src="noam-bg-3.jpg" alt=""><figcaption><b>3</b>לופט עם מנורה ירוקה ומסך מסחר</figcaption></figure><figure><img src="noam-bg-4.jpg" alt=""><figcaption><b>4</b>חדר עבודה חם עם ארבעה מסכים ומנורה</figcaption></figure><figure><img src="noam-bg-5.jpg" alt=""><figcaption><b>5</b>משרד מסחר כהה בלילה</figcaption></figure></div></body></html>

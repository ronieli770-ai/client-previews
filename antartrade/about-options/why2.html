<body><h1>תמונה לסקשן "למה האתר הזה?" - סבב 2</h1><p class="lead">אותו חדר מסחר כמו ב"מה מייחד אותי", סוחר בצל מאחור, רק שני מסכים בגוונים כחולים, עם נגיעות קטנות ושקטות של ירוק ואדום. כל אופציה מוצגת כמו בסקשן. תגידי לי מספר.</p><div class="g"><figure><div class="sec"><div class="ph" style="background-image:url(why2-1.jpg);background-position:45% 50%"></div><div class="tx"><span>02</span><h3>למה האתר הזה?</h3><p>כשהתחלתי בתחום המימון, לא היה מקום אחד שריכז את כל המידע. הייתי צריך לחפש, לשאול, לטעות ולהפסיד כסף בדרך.</p></div></div><figcaption><b>1</b>שני מסכים, הסוחר באמצע, חלון גדול מאחור</figcaption></figure><figure><div class="sec"><div class="ph" style="background-image:url(why2-2.jpg);background-position:60% 50%"></div><div class="tx"><span>02</span><h3>למה האתר הזה?</h3><p>כשהתחלתי בתחום המימון, לא היה מקום אחד שריכז את כל המידע. הייתי צריך לחפש, לשאול, לטעות ולהפסיד כסף בדרך.</p></div></div><figcaption><b>2</b>שני מסכים, הסוחר מימין על כיסא משרדי</figcaption></figure><figure><div class="sec"><div class="ph" style="background-image:url(why2-3.jpg);background-position:45% 60%"></div><div class="tx"><span>02</span><h3>למה האתר הזה?</h3><p>כשהתחלתי בתחום המימון, לא היה מקום אחד שריכז את כל המידע. הייתי צריך לחפש, לשאול, לטעות ולהפסיד כסף בדרך.</p></div></div><figcaption><b>3</b>שני מסכים מקרוב, הסוחר מימין ומנורה תלויה</figcaption></figure><figure><div class="sec"><div class="ph" style="background-image:url(why2-4.jpg);background-position:70% 60%"></div><div class="tx"><span>02</span><h3>למה האתר הזה?</h3><p>כשהתחלתי בתחום המימון, לא היה מקום אחד שריכז את כל המידע. הייתי צריך לחפש, לשאול, לטעות ולהפסיד כסף בדרך.</p></div></div><figcaption><b>4</b>שני מסכים בצד ימין של החדר, הסוחר בצללית מלאה</figcaption></figure></div></body></html>
